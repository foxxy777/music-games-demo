<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>档位1 - 高低判断</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px}
.sub{color:#888;margin-bottom:24px;font-size:14px}
.stats{display:flex;gap:32px;margin-bottom:24px;font-size:18px}
.stats span{color:#e94560;font-weight:bold}
.btn-play{background:#e94560;color:#fff;border:none;padding:14px 48px;font-size:20px;border-radius:50px;cursor:pointer;margin-bottom:24px;transition:all .2s}
.btn-play:hover{background:#ff6b6b;transform:scale(1.05)}
.btn-play:disabled{background:#555;cursor:not-allowed;transform:none}
.choices{display:flex;gap:20px;margin-bottom:24px}
.choice{background:#16213e;color:#eee;border:2px solid #0f3460;padding:16px 40px;font-size:22px;border-radius:12px;cursor:pointer;transition:all .2s;min-width:140px;text-align:center}
.choice:hover{border-color:#e94560;background:#1a2640}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice.correct{background:#2d6a4f;border-color:#52b788;animation:pop .3s}
.choice.wrong{background:#6a2d2d;border-color:#e94560;animation:shake .3s}
.result{font-size:24px;font-weight:bold;min-height:36px;margin-bottom:16px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.back{position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:14px}
.back:hover{color:#e94560}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回总览</a>
<h1>档位 1 · 高低判断</h1>
<div class="sub">听两个音，选哪个更高</div>
<div class="stats">
  得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span>
</div>
<button class="btn-play" id="playBtn" onclick="playQuestion()">🔊 播放题目</button>
<div class="choices" id="choices">
  <button class="choice" id="btnA" onclick="answer('A')" disabled>🔺 第一个更高</button>
  <button class="choice" id="btnB" onclick="answer('B')" disabled>🔻 第二个更高</button>
</div>
<div class="result" id="result"></div>

<script>
let noteA, noteB, correctAnswer, score=0, combo=0, total=0;
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function pickNote(){ return Math.floor(Math.random()*24)+48; } // C3-B4
function playTone(freq, time, dur=0.6){
  const synth = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.3,sustain:0.2,release:0.5}}).toDestination();
  synth.triggerAttackRelease(Tone.Frequency(freq,'hz').toNote(), dur, time);
}

async function playQuestion(){
  await Tone.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('result').textContent = '';
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.className='choice'});

  const midiA = pickNote();
  let midiB;
  do { midiB = pickNote(); } while(midiB === midiA);
  noteA = midiToFreq(midiA);
  noteB = midiToFreq(midiB);
  correctAnswer = noteA > noteB ? 'B' : 'A'; // which one is higher

  const now = Tone.now();
  playTone(noteA, now);
  playTone(noteB, now + 0.8);

  setTimeout(()=>{
    document.querySelectorAll('.choice').forEach(b=>b.disabled=false);
  }, 1600);
}

function answer(choice){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('playBtn').disabled = false;
  total++;
  const btn = choice==='A' ? 'btnA' : 'btnB';

  if(choice === correctAnswer){
    score++; combo++;
    document.getElementById(btn).classList.add('correct');
    document.getElementById('result').textContent = '✅ 正确！';
    document.getElementById('result').style.color = '#52b788';
  } else {
    combo = 0;
    document.getElementById(btn).classList.add('wrong');
    document.getElementById('result').textContent = '❌ 答错了～';
    document.getElementById('result').style.color = '#e94560';
  }
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  document.getElementById('total').textContent = total;
}
</script>
</body>
</html>
