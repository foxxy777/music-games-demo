<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>档位4 - 参考音·上方下方</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px}.sub{color:#888;margin-bottom:24px;font-size:14px}
.stats{display:flex;gap:32px;margin-bottom:24px;font-size:18px}.stats span{color:#e94560;font-weight:bold}
.ref-box{background:#16213e;border:2px solid #0f3460;border-radius:12px;padding:16px 32px;margin-bottom:20px;text-align:center;font-size:16px}
.ref-box b{color:#e94560;font-size:20px}
.btn-play{background:#e94560;color:#fff;border:none;padding:14px 48px;font-size:20px;border-radius:50px;cursor:pointer;margin-bottom:24px;transition:all .2s}
.btn-play:hover{background:#ff6b6b;transform:scale(1.05)}.btn-play:disabled{background:#555;cursor:not-allowed}
.choices{display:flex;gap:20px;margin-bottom:24px}
.choice{background:#16213e;color:#eee;border:2px solid #0f3460;padding:16px 40px;font-size:22px;border-radius:12px;cursor:pointer;transition:all .2s;min-width:140px;text-align:center}
.choice:hover{border-color:#e94560;background:#1a2640}.choice:disabled{opacity:.5;cursor:not-allowed}
.choice.correct{background:#2d6a4f;border-color:#52b788}.choice.wrong{background:#6a2d2d;border-color:#e94560}
.result{font-size:24px;font-weight:bold;min-height:36px;margin-bottom:16px}
.back{position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:14px}.back:hover{color:#e94560}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回总览</a>
<h1>档位 4 · 参考音定位</h1>
<div class="sub">先听参考音 C，再听目标音，判断在上方还是下方</div>
<div class="stats">得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span></div>
<div class="ref-box">🎯 参考音：<b>C4（中央C）</b></div>
<button class="btn-play" id="playBtn" onclick="playQuestion()">🔊 播放题目</button>
<div class="choices">
  <button class="choice" id="btnUp" onclick="answer('up')" disabled>⬆️ 上方</button>
  <button class="choice" id="btnDown" onclick="answer('down')" disabled>⬇️ 下方</button>
</div>
<div class="result" id="result"></div>

<script>
let correctAnswer, score=0, combo=0, total=0;
const C4 = 60; // MIDI
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
function playTone(freq, time, dur=0.6){
  const s = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.3,sustain:0.2,release:0.5}}).toDestination();
  s.triggerAttackRelease(Tone.Frequency(freq,'hz').toNote(), dur, time);
}

async function playQuestion(){
  await Tone.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('result').textContent = '';
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.className='choice'});

  const target = Math.floor(Math.random()*12)+54; // 54-65, can be above or below C4(60)
  correctAnswer = target >= C4 ? 'up' : 'down';

  const now = Tone.now();
  playTone(midiToFreq(C4), now, 0.8); // reference C4
  playTone(midiToFreq(target), now + 1.0); // target

  setTimeout(()=>{ document.querySelectorAll('.choice').forEach(b=>b.disabled=false); }, 1800);
}

function answer(choice){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('playBtn').disabled = false;
  total++;
  const btn = choice==='up' ? 'btnUp' : 'btnDown';
  if(choice===correctAnswer){
    score++; combo++;
    document.getElementById(btn).classList.add('correct');
    document.getElementById('result').textContent='✅ 正确！';
    document.getElementById('result').style.color='#52b788';
  } else {
    combo=0;
    document.getElementById(btn).classList.add('wrong');
    document.getElementById('result').textContent='❌ 答错了～';
    document.getElementById('result').style.color='#e94560';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
}
</script>
</body>
</html>
