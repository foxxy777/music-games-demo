<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>档位7 - 音程分类</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px}.sub{color:#888;margin-bottom:24px;font-size:14px}
.stats{display:flex;gap:32px;margin-bottom:24px;font-size:18px}.stats span{color:#e94560;font-weight:bold}
.btn-play{background:#e94560;color:#fff;border:none;padding:14px 48px;font-size:20px;border-radius:50px;cursor:pointer;margin-bottom:24px;transition:all .2s}
.btn-play:hover{background:#ff6b6b;transform:scale(1.05)}.btn-play:disabled{background:#555;cursor:not-allowed}
.choices{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.choice{background:#16213e;color:#eee;border:2px solid #0f3460;padding:16px 32px;font-size:22px;border-radius:12px;cursor:pointer;transition:all .2s;min-width:120px;text-align:center}
.choice:hover{border-color:#e94560;background:#1a2640}.choice:disabled{opacity:.5;cursor:not-allowed}
.choice.correct{background:#2d6a4f;border-color:#52b788}.choice.wrong{background:#6a2d2d;border-color:#e94560}
.result{font-size:24px;font-weight:bold;min-height:36px;margin-bottom:16px}
.back{position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:14px}.back:hover{color:#e94560}
.hint{color:#666;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回总览</a>
<h1>档位 7 · 音程分类</h1>
<div class="sub">听两个音，判断音程属于"大"、"小"还是"纯"</div>
<div class="hint">不播放参考音，纯靠耳朵判断</div>
<div class="stats">得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span></div>
<button class="btn-play" id="playBtn" onclick="playQuestion()">🔊 播放题目</button>
<div class="choices">
  <button class="choice" id="btnMajor" onclick="answer('major')" disabled>🔵 大音程</button>
  <button class="choice" id="btnMinor" onclick="answer('minor')" disabled>🟣 小音程</button>
  <button class="choice" id="btnPerfect" onclick="answer('perfect')" disabled>🟢 纯音程</button>
</div>
<div class="result" id="result"></div>

<script>
let correctAnswer, correctName, score=0, combo=0, total=0;
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
function playTone(freq, time, dur=0.6){
  const s = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.3,sustain:0.2,release:0.5}}).toDestination();
  s.triggerAttackRelease(Tone.Frequency(freq,'hz').toNote(), dur, time);
}

// interval categories
const intervals = [
  {semitones:1, name:'小二度', cat:'minor'},
  {semitones:2, name:'大二度', cat:'major'},
  {semitones:3, name:'小三度', cat:'minor'},
  {semitones:4, name:'大三度', cat:'major'},
  {semitones:5, name:'纯四度', cat:'perfect'},
  // skip tritone(6) - ambiguous
  {semitones:7, name:'纯五度', cat:'perfect'},
  {semitones:8, name:'小六度', cat:'minor'},
  {semitones:9, name:'大六度', cat:'major'},
  {semitones:10, name:'小七度', cat:'minor'},
  {semitones:11, name:'大七度', cat:'major'},
];

async function playQuestion(){
  await Tone.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('result').textContent = '';
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.className='choice'});

  const base = Math.floor(Math.random()*12)+48; // C3-B3
  const iv = intervals[Math.floor(Math.random()*intervals.length)];
  correctAnswer = iv.cat;
  correctName = iv.name;

  const now = Tone.now();
  playTone(midiToFreq(base), now);
  playTone(midiToFreq(base + iv.semitones), now + 0.8);

  setTimeout(()=>{ document.querySelectorAll('.choice').forEach(b=>b.disabled=false); }, 1600);
}

function answer(choice){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('playBtn').disabled = false;
  total++;
  const btnMap = {major:'btnMajor',minor:'btnMinor',perfect:'btnPerfect'};
  if(choice===correctAnswer){
    score++; combo++;
    document.getElementById(btnMap[choice]).classList.add('correct');
    document.getElementById('result').textContent='✅ 正确！('+correctName+')';
    document.getElementById('result').style.color='#52b788';
  } else {
    combo=0;
    document.getElementById(btnMap[choice]).classList.add('wrong');
    document.getElementById('result').textContent='❌ 是'+correctName;
    document.getElementById('result').style.color='#e94560';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
}
</script>
</body>
</html>
