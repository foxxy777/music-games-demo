<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>档位13 - 三和弦类型</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px}.sub{color:#888;margin-bottom:24px;font-size:14px}
.stats{display:flex;gap:32px;margin-bottom:24px;font-size:18px}.stats span{color:#e94560;font-weight:bold}
.btn-play{background:#e94560;color:#fff;border:none;padding:14px 48px;font-size:20px;border-radius:50px;cursor:pointer;margin-bottom:24px;transition:all .2s}
.btn-play:hover{background:#ff6b6b;transform:scale(1.05)}.btn-play:disabled{background:#555;cursor:not-allowed}
.choices{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.choice{background:#16213e;color:#eee;border:2px solid #0f3460;padding:14px 24px;font-size:18px;border-radius:10px;cursor:pointer;transition:all .2s;min-width:100px;text-align:center}
.choice:hover{border-color:#e94560;background:#1a2640}.choice:disabled{opacity:.5;cursor:not-allowed}
.choice.correct{background:#2d6a4f;border-color:#52b788}.choice.wrong{background:#6a2d2d;border-color:#e94560}
.result{font-size:24px;font-weight:bold;min-height:36px;margin-bottom:16px}
.back{position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:14px}.back:hover{color:#e94560}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回总览</a>
<h1>档位 13 · 三和弦类型</h1>
<div class="sub">听和弦，识别是大/小/增/减/挂留和弦</div>
<div class="stats">得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span></div>
<button class="btn-play" id="playBtn" onclick="playQuestion()">🔊 播放和弦</button>
<div class="choices" id="choices"></div>
<div class="result" id="result"></div>

<script>
let correctName, score=0, combo=0, total=0;
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const chordTypes = [
  {name:'大三', intervals:[0,4,7]},
  {name:'小三', intervals:[0,3,7]},
  {name:'增三', intervals:[0,4,8]},
  {name:'减三', intervals:[0,3,6]},
  {name:'挂四', intervals:[0,5,7]},
  {name:'挂二', intervals:[0,2,7]},
];

async function playQuestion(){
  await Tone.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('result').textContent = '';
  document.getElementById('choices').innerHTML = '';

  const base = Math.floor(Math.random()*12)+48;
  const ct = chordTypes[Math.floor(Math.random()*chordTypes.length)];
  correctName = ct.name;

  const notes = ct.intervals.map(i => Tone.Frequency(midiToFreq(base+i),'hz').toNote());
  const synth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{type:'triangle'},
    envelope:{attack:0.02,decay:0.3,sustain:0.4,release:0.8}
  }).toDestination();
  synth.triggerAttackRelease(notes, '4n', Tone.now());

  const opts = shuffle(chordTypes.map(c=>c.name));
  const container = document.getElementById('choices');
  opts.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = name;
    btn.onclick = () => answer(name, btn);
    container.appendChild(btn);
  });

  setTimeout(()=>{
    document.querySelectorAll('.choice').forEach(b=>b.disabled=false);
    document.getElementById('playBtn').disabled = false;
  }, 1500);
}

function answer(choice, btn){
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  total++;
  if(choice===correctName){
    score++; combo++;
    btn.classList.add('correct');
    document.getElementById('result').textContent='✅ 正确！';
    document.getElementById('result').style.color='#52b788';
  } else {
    combo=0;
    btn.classList.add('wrong');
    document.getElementById('result').textContent='❌ 正确答案: '+correctName;
    document.getElementById('result').style.color='#e94560';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
}
</script>
</body>
</html>
