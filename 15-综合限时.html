<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>档位15 - 综合限时</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{color:#e94560;margin-bottom:8px}.sub{color:#888;margin-bottom:16px;font-size:14px}
.stats{display:flex;gap:24px;margin-bottom:16px;font-size:18px}.stats span{color:#e94560;font-weight:bold}
.timer{font-size:28px;font-weight:bold;color:#ff6b6b;margin-bottom:16px}
.timer.warning{animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-play{background:#e94560;color:#fff;border:none;padding:14px 48px;font-size:20px;border-radius:50px;cursor:pointer;margin-bottom:16px;transition:all .2s}
.btn-play:hover{background:#ff6b6b;transform:scale(1.05)}.btn-play:disabled{background:#555;cursor:not-allowed}
.question-type{font-size:16px;color:#aaa;margin-bottom:12px;background:#16213e;padding:8px 20px;border-radius:8px}
.choices{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.choice{background:#16213e;color:#eee;border:2px solid #0f3460;padding:12px 20px;font-size:18px;border-radius:10px;cursor:pointer;transition:all .2s;min-width:80px;text-align:center}
.choice:hover{border-color:#e94560;background:#1a2640}.choice:disabled{opacity:.5;cursor:not-allowed}
.choice.correct{background:#2d6a4f;border-color:#52b788}.choice.wrong{background:#6a2d2d;border-color:#e94560}
.result{font-size:20px;font-weight:bold;min-height:28px;margin-bottom:8px}
.back{position:fixed;top:20px;left:20px;color:#888;text-decoration:none;font-size:14px}.back:hover{color:#e94560}
</style>
</head>
<body>
<a class="back" href="index.html">← 返回总览</a>
<h1>档位 15 · 综合限时</h1>
<div class="sub">随机混合题型，每题限时8秒</div>
<div class="stats">得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span></div>
<div class="timer" id="timer">⏱️ --</div>
<div class="question-type" id="qType">点击开始随机挑战</div>
<button class="btn-play" id="playBtn" onclick="nextQuestion()">🔊 开始挑战</button>
<div class="choices" id="choices"></div>
<div class="result" id="result"></div>

<script>
let score=0, combo=0, total=0, timerInterval=null, timeLeft=0;
const midiToFreq = m => 440 * Math.pow(2, (m-69)/12);
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function playTone(freq, time, dur=0.5){
  const s = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.2,sustain:0.2,release:0.4}}).toDestination();
  s.triggerAttackRelease(Tone.Frequency(freq,'hz').toNote(), dur, time);
}

const types = ['高低','音名','音程分类','和弦'];

async function nextQuestion(){
  await Tone.start();
  if(timerInterval) clearInterval(timerInterval);
  document.getElementById('playBtn').disabled = true;
  document.getElementById('result').textContent = '';
  document.getElementById('choices').innerHTML = '';

  const type = types[Math.floor(Math.random()*types.length)];
  document.getElementById('qType').textContent = '题型: ' + type;

  if(type==='高低') genHighLow();
  else if(type==='音名') genNoteName();
  else if(type==='音程分类') genIntervalCat();
  else if(type==='和弦') genChord();

  // start timer
  timeLeft = 8;
  document.getElementById('timer').textContent = '⏱️ ' + timeLeft + 's';
  document.getElementById('timer').className = 'timer';
  timerInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent = '⏱️ ' + timeLeft + 's';
    if(timeLeft<=3) document.getElementById('timer').className='timer warning';
    if(timeLeft<=0){
      clearInterval(timerInterval);
      timeout();
    }
  }, 1000);
}

function timeout(){
  combo=0; total++;
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('result').textContent='⏰ 超时！';
  document.getElementById('result').style.color='#e94560';
  document.getElementById('playBtn').disabled = false;
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
}

function genHighLow(){
  const a = Math.floor(Math.random()*24)+48;
  let b; do{b=Math.floor(Math.random()*24)+48}while(b===a);
  const correct = a>b?'B':'A';
  playTone(midiToFreq(a), Tone.now());
  playTone(midiToFreq(b), Tone.now()+0.7);
  showChoices(['A:第一个高','B:第二个高'], correct);
}

function genNoteName(){
  const off = Math.floor(Math.random()*12);
  const midi = 60+off;
  playTone(midiToFreq(60), Tone.now(), 0.6);
  playTone(midiToFreq(midi), Tone.now()+0.8);
  let opts=[noteNames[off]];
  while(opts.length<4){const w=noteNames[Math.floor(Math.random()*12)];if(!opts.includes(w))opts.push(w);}
  showChoices(shuffle(opts), noteNames[off]);
}

function genIntervalCat(){
  const ivs=[{s:2,c:'大'},{s:3,c:'小'},{s:4,c:'大'},{s:5,c:'纯'},{s:7,c:'纯'}];
  const iv=ivs[Math.floor(Math.random()*ivs.length)];
  const base=Math.floor(Math.random()*12)+48;
  playTone(midiToFreq(base),Tone.now());
  playTone(midiToFreq(base+iv.s),Tone.now()+0.7);
  showChoices(shuffle(['大','小','纯']), iv.c);
}

function genChord(){
  const base=Math.floor(Math.random()*12)+48;
  const isMaj=Math.random()>0.5;
  const synth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.3,sustain:0.4,release:0.8}}).toDestination();
  const third=isMaj?base+4:base+3;
  synth.triggerAttackRelease([Tone.Frequency(midiToFreq(base),'hz').toNote(),Tone.Frequency(midiToFreq(third),'hz').toNote(),Tone.Frequency(midiToFreq(base+7),'hz').toNote()],'4n',Tone.now());
  showChoices(shuffle(['大三','小三']), isMaj?'大三':'小三');
}

function showChoices(options, correct){
  const container = document.getElementById('choices');
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = opt;
    btn.onclick = () => answer(opt===correct, btn);
    container.appendChild(btn);
  });
}

function answer(isCorrect, btn){
  clearInterval(timerInterval);
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
  document.getElementById('playBtn').disabled = false;
  total++;
  if(isCorrect){
    score++; combo++;
    btn.classList.add('correct');
    document.getElementById('result').textContent='✅ 正确！';
    document.getElementById('result').style.color='#52b788';
  } else {
    combo=0;
    btn.classList.add('wrong');
    document.getElementById('result').textContent='❌ 答错了～';
    document.getElementById('result').style.color='#e94560';
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
}
</script>
</body>
</html>
