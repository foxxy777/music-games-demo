<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频诊断</title>
<style>
body{background:#1a1a2e;color:#eee;font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto}
button{display:block;width:100%;padding:16px;margin:8px 0;font-size:16px;border:none;border-radius:8px;cursor:pointer}
.test1{background:#e94560;color:#fff}
.test2{background:#52b788;color:#fff}
.test3{background:#3498db;color:#fff}
.test4{background:#f39c12;color:#fff}
.log{background:#000;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;color:#0f0;margin-top:12px;min-height:100px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🔍 鸿蒙音频诊断</h2>
<button class="test1" onclick="test1()">测试1: HTML Audio 播放网络文件</button>
<button class="test2" onclick="test2()">测试2: HTML Audio 播放 base64</button>
<button class="test3" onclick="test3()">测试3: Web Audio API 播放网络文件</button>
<button class="test4" onclick="test4()">测试4: Web Audio API 振荡器</button>

<div class="log" id="log">点击上面的按钮测试...
</div>

<script>
function log(msg) {
  var el = document.getElementById('log');
  el.textContent += '\n' + new Date().toLocaleTimeString() + ': ' + msg;
}

function test1() {
  log('Test1: Trying HTML Audio with network file...');
  try {
    var a = new Audio('https://foxxy777.github.io/music-games-demo/v10/assets/audio/question_4C.wav');
    a.play().then(function() {
      log('Test1 OK: Audio playing!');
    }).catch(function(e) {
      log('Test1 FAIL: ' + e.message);
    });
  } catch(e) {
    log('Test1 ERROR: ' + e.message);
  }
}

function test2() {
  log('Test2: Trying HTML Audio with base64...');
  try {
    var a = new Audio('data:audio/wav;base64,UklGRtQDAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YTQDAAAAAAAAAAAAAAAAAAAA//8AQABA/2AA`);
    a.play().then(function() {
      log('Test2 OK: base64 audio playing!');
    }).catch(function(e) {
      log('Test2 FAIL: ' + e.message);
    });
  } catch(e) {
    log('Test2 ERROR: ' + e.message);
  }
}

function test3() {
  log('Test3: Trying Web Audio API with network file...');
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    log('Test3: AudioContext state=' + ctx.state);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://foxxy777.github.io/music-games-demo/v10/assets/audio/question_4C.wav', true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function() {
      log('Test3: XHR loaded ' + xhr.response.byteLength + ' bytes');
      ctx.decodeAudioData(xhr.response, function(buf) {
        log('Test3: Decoded OK, duration=' + buf.duration);
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start(0);
        log('Test3: Started playback');
      }, function(e) {
        log('Test3 decode FAIL: ' + e);
      });
    };
    xhr.onerror = function() { log('Test3 XHR ERROR'); };
    xhr.send();
  } catch(e) {
    log('Test3 ERROR: ' + e.message);
  }
}

function test4() {
  log('Test4: Trying Web Audio API oscillator...');
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    log('Test4: AudioContext state=' + ctx.state);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    gain.gain.value = 0.3;
    osc.frequency.value = 440;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    log('Test4: Oscillator started at 440Hz');
    setTimeout(function() { osc.stop(); log('Test4: Oscillator stopped'); }, 2000);
  } catch(e) {
    log('Test4 ERROR: ' + e.message);
  }
}

log('Page loaded. Browser: ' + navigator.userAgent.substring(0, 80));
</script>
</body>
</html>
