<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 听音识谱</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%);
  color: #eee;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
}

h1 { 
  margin: 10px 0 5px; 
  font-size: 26px;
  background: linear-gradient(90deg, #ff6b9d, #ffa07a, #ff6b9d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% auto;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }

.subtitle { color: #888; margin-bottom: 12px; font-size: 14px; }

/* Stats bar */
.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 12px;
}
.stat { 
  background: rgba(255,255,255,0.05); 
  backdrop-filter: blur(10px);
  padding: 8px 18px; 
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 15px;
  color: #aaa;
}
.stat span { color: #ff6b9d; font-weight: bold; font-size: 20px; margin-left: 6px; }

/* Controls */
.controls { 
  margin-bottom: 12px; 
  display: flex; 
  gap: 12px; 
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
label { font-size: 13px; color: #888; }
select {
  background: rgba(255,255,255,0.08);
  color: #eee;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 7px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}
button {
  background: linear-gradient(135deg, #ff6b9d, #ff8e6f);
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(255,107,157,0.3);
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,107,157,0.5);
}
button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-replay {
  background: linear-gradient(135deg, #4ecdc4, #44a08d);
  box-shadow: 0 4px 15px rgba(78,205,196,0.3);
  padding: 8px 20px;
  font-size: 14px;
}

/* Message */
.message {
  min-height: 28px;
  font-size: 16px;
  margin: 6px 0;
  text-align: center;
  transition: all 0.3s;
}
.message.correct { color: #4ecdc4; text-shadow: 0 0 10px rgba(78,205,196,0.5); }
.message.wrong { color: #ff6b6b; }
.message.info { color: #74b9ff; }
.message.playing { color: #ffa07a; }

/* Visualizer */
.visualizer {
  width: 100%;
  max-width: 600px;
  height: 60px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.viz-bar {
  width: 6px;
  height: 4px;
  background: linear-gradient(180deg, #ff6b9d, #ff8e6f);
  border-radius: 3px;
  transition: height 0.1s ease-out;
  opacity: 0.3;
}

/* Note chips */
.note-sequence {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 6px 0;
  min-height: 38px;
}
.note-chip {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 5px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  transition: all 0.3s;
}
.note-chip.played { background: rgba(78,205,196,0.2); border-color: #4ecdc4; }
.note-chip.correct { background: rgba(78,205,196,0.3); border-color: #4ecdc4; color: #4ecdc4; }
.note-chip.wrong { background: rgba(255,107,107,0.2); border-color: #ff6b6b; color: #ff6b6b; }
.note-chip.pending { opacity: 0.35; }

/* Feedback */
.feedback-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 4px 0;
  min-height: 28px;
  flex-wrap: wrap;
}
.feedback-chip {
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: #fff;
}

/* Staff */
.staff-container {
  background: #fafafa;
  border-radius: 16px;
  padding: 16px 24px;
  margin: 8px 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  position: relative;
}
canvas { display: block; cursor: pointer; }

/* Glow pulse when playing */
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 8px 32px rgba(255,107,157,0.4); }
}
.staff-container.playing { animation: glowPulse 0.6s ease-in-out; }

/* Heart decoration */
.heart-float {
  position: fixed;
  pointer-events: none;
  font-size: 20px;
  animation: floatUp 1.5s ease-out forwards;
  z-index: 100;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}
</style>
</head>
<body>

<h1>🎵 听音识谱</h1>
<p class="subtitle">听她的声音，在五线谱上找出音符 ✨</p>

<div class="stats">
  <div class="stat">关卡<span id="level">1</span></div>
  <div class="stat">得分<span id="score">0</span></div>
  <div class="stat">连击<span id="combo">0</span></div>
</div>

<div class="visualizer" id="visualizer"></div>

<div class="controls">
  <label>音符数</label>
  <select id="noteCount">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  <label>间隔</label>
  <select id="interval">
    <option value="3500" selected>慢（3.5s）</option>
    <option value="3000">正常（3.0s）</option>
    <option value="2500">快（2.5s）</option>
  </select>
  <button id="startBtn" onclick="startRound()">开始</button>
  <button class="btn-replay" id="replayBtn" onclick="replaySequence()" disabled>🔊 再听一次</button>
</div>

<div class="message info" id="message">点「开始」听音，然后在五线谱上按顺序点击 ✨</div>

<div class="note-sequence" id="noteSequence"></div>
<div class="feedback-row" id="feedbackRow"></div>

<div class="staff-container" id="staffContainer">
  <canvas id="staff" width="680" height="260"></canvas>
</div>

<script>
// === Notes ===
const NOTES = {
  '4C': { solfege: 'Do',  freq: 261.63, staffY: 0,   ledger: [-1] },
  '4D': { solfege: 'Re',  freq: 293.66, staffY: 0.5, ledger: [] },
  '4E': { solfege: 'Mi',  freq: 329.63, staffY: 1,   ledger: [] },
  '4F': { solfege: 'Fa',  freq: 349.23, staffY: 1.5, ledger: [] },
  '4G': { solfege: 'Sol', freq: 392.00, staffY: 2,   ledger: [] },
  '4A': { solfege: 'La',  freq: 440.00, staffY: 2.5, ledger: [] },
  '4B': { solfege: 'Si',  freq: 493.88, staffY: 3,   ledger: [] },
  '5C': { solfege: 'Do',  freq: 523.25, staffY: 3.5, ledger: [] },
  '5D': { solfege: 'Re',  freq: 587.33, staffY: 4,   ledger: [] },
  '5E': { solfege: 'Mi',  freq: 659.25, staffY: 4.5, ledger: [] },
  '5F': { solfege: 'Fa',  freq: 698.46, staffY: 5,   ledger: [] },
};
const NOTE_LIST = Object.keys(NOTES);

// === Canvas geometry ===
const LINE_GAP = 16;
const STAFF_TOP = 40;
const STAFF_LEFT = 90;
const STAFF_WIDTH = 560;

function staffY(noteName) {
  return STAFF_TOP + (4 - NOTES[noteName].staffY) * LINE_GAP;
}

// === Audio ===
let audioCtx = null;
const noteBuffers = {};
let reverbNode = null;
let masterGain = null;

async function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // Create reverb for atmosphere
  reverbNode = audioCtx.createConvolver();
  reverbNode.buffer = createReverbImpulse(audioCtx, 2.5, 2.5);
  
  const reverbGain = audioCtx.createGain();
  reverbGain.gain.value = 0.35; // 35% wet
  
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.0;
  
  // Chain: source -> masterGain -> destination
  //        source -> reverb -> reverbGain -> destination
  masterGain.connect(audioCtx.destination);
  reverbNode.connect(reverbGain);
  reverbGain.connect(audioCtx.destination);
  
  // Load samples
  for (const name of NOTE_LIST) {
    try {
      const resp = await fetch(name + '.wav');
      const buf = await resp.arrayBuffer();
      noteBuffers[name] = await audioCtx.decodeAudioData(buf);
    } catch(e) {
      console.warn('Load failed: ' + name);
    }
  }
}

function createReverbImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const length = Math.max(1, Math.floor(rate * duration));
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

function playNote(name) {
  if (!audioCtx) return;
  
  if (noteBuffers[name]) {
    const src = audioCtx.createBufferSource();
    src.buffer = noteBuffers[name];
    
    // Gain envelope for smooth fade
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.9, now + 0.08);   // gentle fade in
    gain.gain.setValueAtTime(0.9, now + 2.5);              // hold
    gain.gain.linearRampToValueAtTime(0, now + 3.2);       // gentle fade out
    
    // Connect: src -> gain -> master (dry)
    src.connect(gain);
    gain.connect(masterGain);
    
    // Also send to reverb (wet)
    gain.connect(reverbNode);
    
    src.start();
    src.stop(now + 3.5);
    
    // Visualizer
    animateVisualizer();
  } else {
    // Fallback oscillator
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = NOTES[name].freq;
    osc.type = 'sine';
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2);
    osc.connect(gain);
    gain.connect(masterGain);
    gain.connect(reverbNode);
    osc.start();
    osc.stop(now + 2);
    animateVisualizer();
  }
}

// === Visualizer ===
const vizContainer = document.getElementById('visualizer');
const NUM_BARS = 32;
const vizBars = [];
for (let i = 0; i < NUM_BARS; i++) {
  const bar = document.createElement('div');
  bar.className = 'viz-bar';
  vizContainer.appendChild(bar);
  vizBars.push(bar);
}
let vizAnimating = false;

function animateVisualizer() {
  if (vizAnimating) return;
  vizAnimating = true;
  let frame = 0;
  function tick() {
    frame++;
    vizBars.forEach((bar, i) => {
      const t = frame * 0.08;
      const base = Math.sin(t + i * 0.4) * 0.5 + 0.5;
      const wave = Math.sin(t * 2 + i * 0.6) * 0.3 + 0.7;
      const decay = Math.exp(-frame * 0.015);
      const h = base * wave * decay * 50 + 3;
      bar.style.height = h + 'px';
      bar.style.opacity = 0.3 + base * decay * 0.7;
    });
    if (frame < 120) {
      requestAnimationFrame(tick);
    } else {
      vizBars.forEach(b => { b.style.height = '4px'; b.style.opacity = '0.3'; });
      vizAnimating = false;
    }
  }
  tick();
}

// === Canvas ===
const canvas = document.getElementById('staff');
const ctx = canvas.getContext('2d');

let hoverNote = null;
let hoverX = 0;

function drawStaff() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Staff lines
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = STAFF_TOP + i * LINE_GAP;
    ctx.beginPath();
    ctx.moveTo(STAFF_LEFT - 10, y);
    ctx.lineTo(STAFF_LEFT + STAFF_WIDTH, y);
    ctx.stroke();
  }
  
  // Treble clef
  ctx.fillStyle = '#555';
  ctx.font = '76px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('𝄞', STAFF_LEFT - 35, STAFF_TOP + 2 * LINE_GAP + 4);
  
  // End bar
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(STAFF_LEFT + STAFF_WIDTH, STAFF_TOP - 2);
  ctx.lineTo(STAFF_LEFT + STAFF_WIDTH, STAFF_TOP + 4 * LINE_GAP + 2);
  ctx.stroke();
  
  // Draw clicked notes
  clickedNotes.forEach((cn, idx) => {
    const x = STAFF_LEFT + 70 + idx * 55;
    drawNote(cn.name, x, staffY(cn.name), cn.status);
  });
  
  // Hover preview
  if (hoverNote && isListening) {
    ctx.globalAlpha = 0.35;
    drawNote(hoverNote, hoverX, staffY(hoverNote), 'hover');
    ctx.globalAlpha = 1;
  }
}

function drawNote(name, x, y, status) {
  const colors = {
    correct: '#4ecdc4',
    wrong: '#ff6b6b',
    hover: '#ff6b9d',
    default: '#2d3748'
  };
  const color = colors[status] || colors.default;
  
  // Ledger lines
  const note = NOTES[name];
  if (name === '4C') {
    // Ledger line below staff
    const ly = STAFF_TOP + 5 * LINE_GAP;
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 14, ly);
    ctx.lineTo(x + 14, ly);
    ctx.stroke();
  }
  
  // Note head (slightly tilted ellipse like real notation)
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, 10.5, 7.5, -0.35, 0, Math.PI * 2);
  ctx.fill();
  
  // Stem
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  if (NOTES[name].staffY < 3) {
    // Stem down
    ctx.beginPath();
    ctx.moveTo(x - 9.5, y);
    ctx.lineTo(x - 9.5, y + 32);
    ctx.stroke();
  } else {
    // Stem up
    ctx.beginPath();
    ctx.moveTo(x + 9.5, y);
    ctx.lineTo(x + 9.5, y - 32);
    ctx.stroke();
  }
  
  // Label
  ctx.fillStyle = '#888';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name, x, y + 26);
}

// Mouse
canvas.addEventListener('mousemove', (e) => {
  if (!isListening) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  
  let closest = null, minD = Infinity;
  for (const n of NOTE_LIST) {
    const d = Math.abs(my - staffY(n));
    if (d < minD) { minD = d; closest = n; }
  }
  hoverNote = (minD < LINE_GAP * 0.65) ? closest : null;
  hoverX = mx;
  drawStaff();
});

canvas.addEventListener('mouseleave', () => { hoverNote = null; drawStaff(); });

canvas.addEventListener('click', (e) => {
  if (!isListening || !hoverNote) return;
  if (userAnswers.length >= currentSequence.length) return;
  
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  submitAnswer(hoverNote, mx, my);
});

// === Game ===
let currentSequence = [];
let userAnswers = [];
let clickedNotes = [];
let isPlaying = false;
let isListening = false;
let level = 1, score = 0, combo = 0;

async function startRound() {
  if (!audioCtx) await initAudio();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  
  if (isPlaying) return;
  isPlaying = true;
  isListening = false;
  clickedNotes = [];
  userAnswers = [];
  hoverNote = null;
  
  const count = parseInt(document.getElementById('noteCount').value);
  const interval = parseInt(document.getElementById('interval').value);
  
  currentSequence = [];
  let lastNote = null;
  for (let i = 0; i < count; i++) {
    // Avoid repeating same note twice in a row
    let n;
    do { n = NOTE_LIST[Math.floor(Math.random() * NOTE_LIST.length)]; }
    while (n === lastNote && count > 1);
    currentSequence.push(n);
    lastNote = n;
  }
  
  updateSequenceDisplay();
  document.getElementById('feedbackRow').innerHTML = '';
  
  document.getElementById('startBtn').disabled = true;
  document.getElementById('replayBtn').disabled = true;
  document.getElementById('staffContainer').classList.add('playing');
  setTimeout(() => document.getElementById('staffContainer').classList.remove('playing'), 600);
  
  document.getElementById('message').textContent = '🎧 仔细听...';
  document.getElementById('message').className = 'message playing';
  
  await sleep(400);
  for (let i = 0; i < currentSequence.length; i++) {
    playNote(currentSequence[i]);
    document.getElementById('message').textContent = `🎧 第 ${i+1}/${count} 个音...`;
    if (i < currentSequence.length - 1) await sleep(interval);
  }
  
  await sleep(600);
  isListening = true;
  document.getElementById('message').textContent = '👆 在五线谱上按顺序点击你听到的音';
  document.getElementById('message').className = 'message info';
  document.getElementById('replayBtn').disabled = false;
  drawStaff();
}

function replaySequence() {
  if (!currentSequence.length || isPlaying) return;
  document.getElementById('replayBtn').disabled = true;
  const interval = parseInt(document.getElementById('interval').value);
  
  (async () => {
    document.getElementById('message').textContent = '🔊 重听...';
    document.getElementById('message').className = 'message playing';
    document.getElementById('staffContainer').classList.add('playing');
    
    await sleep(200);
    for (let i = 0; i < currentSequence.length; i++) {
      playNote(currentSequence[i]);
      if (i < currentSequence.length - 1) await sleep(interval);
    }
    await sleep(400);
    document.getElementById('staffContainer').classList.remove('playing');
    document.getElementById('message').textContent = '👆 继续点击';
    document.getElementById('message').className = 'message info';
    document.getElementById('replayBtn').disabled = false;
  })();
}

function submitAnswer(note, mx, my) {
  userAnswers.push(note);
  const idx = userAnswers.length - 1;
  const ok = note === currentSequence[idx];
  clickedNotes.push({ name: note, status: ok ? 'correct' : 'wrong' });
  
  playNote(note);
  animateVisualizer();
  
  // Floating heart on click
  floatHeart(mx, my, ok ? '💚' : '💔');
  
  updateSequenceDisplay();
  drawStaff();
  
  if (userAnswers.length === currentSequence.length) {
    isListening = false;
    setTimeout(checkResults, 500);
  }
}

function floatHeart(x, y, emoji) {
  const rect = canvas.getBoundingClientRect();
  const hx = rect.left + (x / canvas.width) * rect.width;
  const hy = rect.top + (y / canvas.height) * rect.height;
  const el = document.createElement('div');
  el.className = 'heart-float';
  el.textContent = emoji;
  el.style.left = hx + 'px';
  el.style.top = hy + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function checkResults() {
  const correct = userAnswers.filter((a, i) => a === currentSequence[i]).length;
  const total = currentSequence.length;
  const all = correct === total;
  
  if (all) {
    const pts = Math.round(total * 10 * (1 + combo * 0.15));
    score += pts;
    combo++;
    level++;
    document.getElementById('message').textContent = `✨ 完美！+${pts} 分`;
    document.getElementById('message').className = 'message correct';
  } else {
    combo = 0;
    const answer = currentSequence.map(n => `${n}(${NOTES[n].solfege})`).join(' → ');
    document.getElementById('message').textContent = `${correct}/${total} 正确 · 答案：${answer}`;
    document.getElementById('message').className = 'message wrong';
  }
  
  updateStats();
  updateFeedbackRow();
  
  const btn = document.getElementById('startBtn');
  btn.disabled = false;
  btn.textContent = '下一关';
  isPlaying = false;
}

function updateSequenceDisplay() {
  const c = document.getElementById('noteSequence');
  c.innerHTML = '';
  for (let i = 0; i < currentSequence.length; i++) {
    const chip = document.createElement('div');
    if (i < userAnswers.length) {
      const ok = userAnswers[i] === currentSequence[i];
      chip.className = 'note-chip ' + (ok ? 'correct' : 'wrong');
      chip.textContent = userAnswers[i];
    } else {
      chip.className = 'note-chip pending';
      chip.textContent = '?';
    }
    c.appendChild(chip);
  }
}

function updateFeedbackRow() {
  const c = document.getElementById('feedbackRow');
  c.innerHTML = '';
  currentSequence.forEach((note, i) => {
    const chip = document.createElement('div');
    chip.className = 'feedback-chip';
    if (userAnswers[i] === note) {
      chip.style.background = 'rgba(78,205,196,0.3)';
      chip.textContent = `✓ ${note}`;
    } else {
      chip.style.background = 'rgba(255,107,107,0.25)';
      chip.textContent = `✗ ${note}（你：${userAnswers[i] || '-'}）`;
    }
    c.appendChild(chip);
  });
}

function updateStats() {
  document.getElementById('level').textContent = level;
  document.getElementById('score').textContent = Math.round(score);
  document.getElementById('combo').textContent = combo;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Init
drawStaff();
document.getElementById('message').textContent = '点「开始」听音，然后在五线谱上按顺序点击 ✨';
</script>
</body>
</html>
