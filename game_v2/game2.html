<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 听音识谱</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #0d1117 0%, #1a1a2e 50%, #16213e 100%);
  color: #eee; font-family: 'Segoe UI', sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 20px; overflow-x: hidden;
}
h1 {
  margin: 10px 0 5px; font-size: 26px;
  background: linear-gradient(90deg, #ff6b9d, #ffa07a, #ff6b9d);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-size: 200% auto; animation: shimmer 3s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }
.subtitle { color: #888; margin-bottom: 12px; font-size: 14px; }
.stats { display: flex; gap: 20px; margin-bottom: 12px; }
.stat {
  background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
  padding: 8px 18px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1); font-size: 15px; color: #aaa;
}
.stat span { color: #ff6b9d; font-weight: bold; font-size: 20px; margin-left: 6px; }
.controls {
  margin-bottom: 12px; display: flex; gap: 12px; align-items: center;
  flex-wrap: wrap; justify-content: center;
}
label { font-size: 13px; color: #888; }
select {
  background: rgba(255,255,255,0.08); color: #eee;
  border: 1px solid rgba(255,255,255,0.15);
  padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: 14px;
}
button {
  background: linear-gradient(135deg, #ff6b9d, #ff8e6f);
  color: #fff; border: none; padding: 10px 28px; border-radius: 25px;
  cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(255,107,157,0.3);
}
button:hover:not(:disabled) {
  transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,157,0.5);
}
button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-replay {
  background: linear-gradient(135deg, #4ecdc4, #44a08d);
  box-shadow: 0 4px 15px rgba(78,205,196,0.3); padding: 8px 20px; font-size: 14px;
}
.message { min-height: 28px; font-size: 16px; margin: 6px 0; text-align: center; transition: all 0.3s; }
.message.correct { color: #4ecdc4; text-shadow: 0 0 10px rgba(78,205,196,0.5); }
.message.wrong { color: #ff6b6b; }
.message.info { color: #74b9ff; }
.message.playing { color: #ffa07a; }
.visualizer { width: 100%; max-width: 600px; height: 60px; margin: 8px 0;
  display: flex; align-items: center; justify-content: center; gap: 4px; }
.viz-bar {
  width: 6px; height: 4px; background: linear-gradient(180deg, #ff6b9d, #ff8e6f);
  border-radius: 3px; transition: height 0.1s ease-out; opacity: 0.3;
}
.note-sequence { display: flex; gap: 8px; justify-content: center; margin: 6px 0; min-height: 38px; }
.note-chip {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  padding: 5px 14px; border-radius: 10px; font-size: 16px; font-weight: bold; transition: all 0.3s;
}
.note-chip.correct { background: rgba(78,205,196,0.3); border-color: #4ecdc4; color: #4ecdc4; }
.note-chip.wrong { background: rgba(255,107,107,0.2); border-color: #ff6b6b; color: #ff6b6b; }
.note-chip.pending { opacity: 0.35; }
.feedback-row { display: flex; gap: 8px; justify-content: center; margin: 4px 0; min-height: 28px; flex-wrap: wrap; }
.feedback-chip { padding: 4px 12px; border-radius: 8px; font-size: 13px; color: #fff; }
.staff-container {
  background: #fafafa; border-radius: 16px; padding: 16px 24px; margin: 8px 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); position: relative;
}
canvas { display: block; cursor: pointer; }
@keyframes glowPulse {
  0%,100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 8px 40px rgba(255,107,157,0.5); }
}
.staff-container.playing { animation: glowPulse 0.6s ease-in-out; }
.heart-float {
  position: fixed; pointer-events: none; font-size: 20px;
  animation: floatUp 1.5s ease-out forwards; z-index: 100;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
}
</style>
</head>
<body>
<h1>🎵 听音识谱</h1>
<p class="subtitle">听她的声音，在五线谱上找出音符 ✨</p>
<div class="stats">
  <div class="stat">关卡<span id="level">1</span></div>
  <div class="stat">得分<span id="score">0</span></div>
  <div class="stat">连击<span id="combo">0</span></div>
</div>
<div class="visualizer" id="visualizer"></div>
<div class="controls">
  <label>音符数</label>
  <select id="noteCount">
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
  </select>
  <button id="startBtn" onclick="startRound()">开始</button>
  <button class="btn-replay" id="replayBtn" onclick="replaySequence()" disabled>🔊 再听一次</button>
</div>
<div class="message info" id="message">点「开始」听音 ✨</div>
<div class="note-sequence" id="noteSequence"></div>
<div class="feedback-row" id="feedbackRow"></div>
<div class="staff-container" id="staffContainer">
  <canvas id="staff" width="680" height="260"></canvas>
</div>

<script>
const NOTES = {
  '4C': {solfege:'Do',freq:261.63,sY:0}, '4D': {solfege:'Re',freq:293.66,sY:0.5},
  '4E': {solfege:'Mi',freq:329.63,sY:1}, '4F': {solfege:'Fa',freq:349.23,sY:1.5},
  '4G': {solfege:'Sol',freq:392.00,sY:2}, '4A': {solfege:'La',freq:440.00,sY:2.5},
  '4B': {solfege:'Si',freq:493.88,sY:3}, '5C': {solfege:'Do',freq:523.25,sY:3.5},
  '5D': {solfege:'Re',freq:587.33,sY:4}, '5E': {solfege:'Mi',freq:659.25,sY:4.5},
  '5F': {solfege:'Fa',freq:698.46,sY:5},
};
const NOTE_LIST = Object.keys(NOTES);
const LG=16, ST=40, SL=90, SW=560;
function sY(n){return ST+(4-NOTES[n].sY)*LG;}

let audioCtx=null, noteBuffers={}, reverbNode, masterGain;

async function initAudio(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  reverbNode=audioCtx.createConvolver();
  reverbNode.buffer=makeReverb(audioCtx,3.0,3.0);
  const rg=audioCtx.createGain(); rg.gain.value=0.4;
  masterGain=audioCtx.createGain(); masterGain.gain.value=1.0;
  masterGain.connect(audioCtx.destination);
  reverbNode.connect(rg); rg.connect(audioCtx.destination);
  for(const n of NOTE_LIST){
    try{
      const r=await fetch(n+'.wav'); const b=await r.arrayBuffer();
      noteBuffers[n]=await audioCtx.decodeAudioData(b);
    }catch(e){}
  }
}

function makeReverb(ctx,dur,decay){
  const rate=ctx.sampleRate; const len=Math.max(1,Math.floor(rate*dur));
  const imp=ctx.createBuffer(2,len,rate);
  for(let c=0;c<2;c++){const d=imp.getChannelData(c);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return imp;
}

/**
 * The core: play a note as part of a "climax curve".
 * intensity 0→1 controls how intense this note sounds:
 *   0 = soft, breathy, low volume, slow fade in
 *   0.5 = moderate, building
 *   1.0 = peak: loud, pitch wavering, bright filter
 */
function playNote(name, intensity=0.5, isFinale=false, phase='mid') {
  if(!audioCtx||!noteBuffers[name]){synthFallback(NOTES[name].freq);return;}
  const now=audioCtx.currentTime;
  const buf=noteBuffers[name];
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  src.playbackRate.value=1.0;
  const gain=audioCtx.createGain();
  src.connect(gain);
  gain.connect(masterGain); gain.connect(reverbNode);

  // Duration and volume based on climax phase
  const vol = 0.3 + intensity * 0.7;
  const fadeIn = 0.03;  // always quick attack
  let dur, fadeOutDur;

  switch(phase) {
    case 'warmup':
      dur = 0.35 + Math.random() * 0.15;  // very short, hesitant
      fadeOutDur = 0.1;
      break;
    case 'rise':
      dur = 0.6 + Math.random() * 0.2;    // moderate
      fadeOutDur = 0.15;
      break;
    case 'sprint':
      dur = 0.4 + Math.random() * 0.1;    // short burst
      fadeOutDur = 0.08;
      break;
    case 'peak':
      dur = 2.5;                           // long sustained cry
      fadeOutDur = 1.5;
      break;
    default:
      dur = 0.8;
      fadeOutDur = 0.2;
  }

  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + fadeIn);
  gain.gain.setValueAtTime(vol, now + dur - fadeOutDur);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

  src.start(now);
  src.stop(now + dur + 0.1);
  animateVisualizer(intensity);
}

function synthFallback(freq){
  const osc=audioCtx.createOscillator(); const g=audioCtx.createGain();
  osc.frequency.value=freq; osc.type='sine';
  const now=audioCtx.currentTime;
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(0.3,now+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,now+2);
  osc.connect(g); g.connect(masterGain); osc.start(); osc.stop(now+2);
  animateVisualizer(0.5);
}

// === Visualizer ===
const vizC=document.getElementById('visualizer'); const NBAR=32, vbars=[];
for(let i=0;i<NBAR;i++){const b=document.createElement('div');b.className='viz-bar';vizC.appendChild(b);vbars.push(b);}
let vf=0, va=false;
function animateVisualizer(intensity=0.5){
  va=true; vf=0;
  const peak = 30 + intensity * 30;
  function tick(){
    vf++;
    vbars.forEach((b,i)=>{
      const t=vf*0.08;
      const base=Math.sin(t+i*0.4)*0.5+0.5;
      const wave=Math.sin(t*2+i*0.6)*0.3+0.7;
      const decay=Math.exp(-vf*0.012);
      const h=base*wave*decay*peak+3;
      b.style.height=h+'px'; b.style.opacity=0.3+base*decay*0.7;
    });
    if(vf<150&&va)requestAnimationFrame(tick);
    else{vbars.forEach(b=>{b.style.height='4px';b.style.opacity='0.3';});va=false;}
  }
  tick();
}

// === Canvas ===
const canvas=document.getElementById('staff'); const ctx=canvas.getContext('2d');
let hoverNote=null, hoverX=0;
function drawStaff(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#999'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){const y=ST+i*LG;ctx.beginPath();ctx.moveTo(SL-10,y);ctx.lineTo(SL+SW,y);ctx.stroke();}
  ctx.fillStyle='#555'; ctx.font='76px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('𝄞',SL-35,ST+2*LG+4);
  ctx.strokeStyle='#999'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(SL+SW,ST-2);ctx.lineTo(SL+SW,ST+4*LG+2);ctx.stroke();
  clickedNotes.forEach((cn,idx)=>{drawNote(cn.name,SL+70+idx*55,sY(cn.name),cn.status);});
  if(hoverNote&&isListening){ctx.globalAlpha=0.35;drawNote(hoverNote,hoverX,sY(hoverNote),'hover');ctx.globalAlpha=1;}
}
function drawNote(name,x,y,status){
  const colors={correct:'#4ecdc4',wrong:'#ff6b6b',hover:'#ff6b9d',default:'#2d3748'};
  const color=colors[status]||colors.default;
  if(name==='4C'){const ly=ST+5*LG;ctx.strokeStyle='#999';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x-14,ly);ctx.lineTo(x+14,ly);ctx.stroke();}
  ctx.fillStyle=color; ctx.beginPath();ctx.ellipse(x,y,10.5,7.5,-0.35,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=1.8;
  if(NOTES[name].sY<3){ctx.beginPath();ctx.moveTo(x-9.5,y);ctx.lineTo(x-9.5,y+32);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(x+9.5,y);ctx.lineTo(x+9.5,y-32);ctx.stroke();}
  ctx.fillStyle='#888'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(name,x,y+26);
}
canvas.addEventListener('mousemove',e=>{
  if(!isListening)return;
  const r=canvas.getBoundingClientRect(); const mx=(e.clientX-r.left)*(canvas.width/r.width);
  const my=(e.clientY-r.top)*(canvas.height/r.height);
  let closest=null,minD=1e9;
  for(const n of NOTE_LIST){const d=Math.abs(my-sY(n));if(d<minD){minD=d;closest=n;}}
  hoverNote=(minD<LG*0.65)?closest:null; hoverX=mx; drawStaff();
});
canvas.addEventListener('mouseleave',()=>{hoverNote=null;drawStaff();});
canvas.addEventListener('click',e=>{
  if(!isListening||!hoverNote||userAnswers.length>=currentSequence.length)return;
  const r=canvas.getBoundingClientRect(); const mx=(e.clientX-r.left)*(canvas.width/r.width);
  const my=(e.clientY-r.top)*(canvas.height/r.height);
  submitAnswer(hoverNote,mx,my);
});

// === Game State ===
let currentSequence=[], userAnswers=[], clickedNotes=[];
let isPlaying=false, isListening=false;
let level=1, score=0, combo=0;

/**
 * Build intensity curve based on climax analysis report.
 * 5 phases: warmup → rise → sprint → peak → release
 */
function buildIntensityCurve(count) {
  const curve = [];
  for (let i = 0; i < count; i++) {
    const t = i / Math.max(1, count - 1); // 0 → 1
    let intensity;
    if (count <= 2) {
      intensity = t * 0.7 + 0.3;
    } else {
      // Map to 5 phases
      if (t < 0.15) {
        // warmup: very low
        intensity = 0.1 + Math.random() * 0.1;
      } else if (t < 0.4) {
        // rise: gradual
        intensity = 0.2 + (t - 0.15) / 0.25 * 0.3;
      } else if (t < 0.7) {
        // sprint: rapid increase
        intensity = 0.5 + (t - 0.4) / 0.3 * 0.3;
      } else if (t < 0.9) {
        // peak: max
        intensity = 0.85 + Math.random() * 0.15;
      } else {
        // release: slight drop for final note if not the peak
        intensity = 0.7;
      }
    }
    // Last note is always the peak
    if (i === count - 1) intensity = 1.0;
    curve.push(Math.min(1, intensity));
  }
  return curve;
}

/**
 * Generate note sequence that tends to climb upward (mimics rising pitch = rising excitement).
 * Not strictly ascending but biased upward.
 */
function generateSequence(count) {
  const seq = [];
  let lastIdx = Math.floor(Math.random() * 5); // start in lower range
  for (let i = 0; i < count; i++) {
    const t = i / Math.max(1, count - 1);
    // Bias: later notes tend higher
    const lowBound = Math.floor(t * 3);
    const highBound = Math.min(NOTE_LIST.length, 5 + Math.floor(t * 5));
    let idx;
    // 60% chance to go up, 25% stay same range, 15% dip down
    const r = Math.random();
    if (r < 0.6) {
      idx = Math.min(highBound - 1, lastIdx + 1 + Math.floor(Math.random() * 2));
    } else if (r < 0.85) {
      idx = lastIdx;
    } else {
      idx = Math.max(lowBound, lastIdx - 1);
    }
    idx = Math.max(0, Math.min(NOTE_LIST.length - 1, idx));
    seq.push(NOTE_LIST[idx]);
    lastIdx = idx;
  }
  return seq;
}

/**
 * Timing curve based on climax report.
 * warmup: 2~3s gaps
 * rise: 1~1.5s gaps
 * sprint: 0.5~0.8s gaps
 * peak: long sustained note
 */
function buildTimingCurve(count) {
  const timings = [];
  for (let i = 0; i < count; i++) {
    const t = i / Math.max(1, count - 1);
    if (i === count - 1) {
      timings.push(0);
    } else {
      const nextT = (i + 1) / Math.max(1, count - 1);
      const midT = (t + nextT) / 2;
      let interval;
      if (midT < 0.15) {
        // warmup: 2~3s
        interval = 2500 + Math.random() * 500;
      } else if (midT < 0.4) {
        // rise: 1.2~1.8s
        interval = 1200 + Math.random() * 600;
      } else if (midT < 0.7) {
        // sprint: 0.5~0.8s
        interval = 500 + Math.random() * 300;
      } else {
        // pre-peak: 0.4~0.6s then a slight pause
        interval = 400 + Math.random() * 200;
      }
      timings.push(Math.max(350, interval));
    }
  }
  return timings;
}

async function startRound() {
  if(!audioCtx) await initAudio();
  if(audioCtx.state==='suspended') await audioCtx.resume();
  if(isPlaying) return;
  isPlaying=true; isListening=false;
  clickedNotes=[]; userAnswers=[]; hoverNote=null;

  const count = parseInt(document.getElementById('noteCount').value);
  currentSequence = generateSequence(count);
  const intensities = buildIntensityCurve(count);
  const timings = buildTimingCurve(count);

  updateSequenceDisplay();
  document.getElementById('feedbackRow').innerHTML='';
  document.getElementById('startBtn').disabled=true;
  document.getElementById('replayBtn').disabled=true;
  document.getElementById('staffContainer').classList.add('playing');
  setTimeout(()=>document.getElementById('staffContainer').classList.remove('playing'),600);
  document.getElementById('message').textContent='🎧 仔细听...';
  document.getElementById('message').className='message playing';

  // Store for replay (available immediately)
  window._lastIntensities = intensities;
  window._lastTimings = timings;
  document.getElementById('replayBtn').disabled = false; // allow replay immediately

  await sleep(500);
  for(let i=0; i<count; i++){
    const t = i / Math.max(1, count - 1);
    let phase;
    if (t < 0.15) phase = 'warmup';
    else if (t < 0.4) phase = 'rise';
    else if (t < 0.7) phase = 'sprint';
    else if (i === count - 1) phase = 'peak';
    else phase = 'sprint';
    
    playNote(currentSequence[i], intensities[i], i === count - 1, phase);
    if(i < count - 1) {
      document.getElementById('message').textContent = `🎧 ${i+1}/${count}...`;
      await sleep(timings[i]);
    } else {
      document.getElementById('message').textContent = `🎧 ~`;
    }
  }
  await sleep(800);
  isListening=true;
  document.getElementById('message').textContent='👆 在五线谱上按顺序点击你听到的音';
  document.getElementById('message').className='message info';
  drawStaff();
}

function replaySequence(){
  if(!currentSequence.length)return;
  // Don't block during playback — allow replay anytime
  document.getElementById('replayBtn').disabled=true;
  const intensities = window._lastIntensities || [];
  const timings = window._lastTimings || [];
  (async()=>{
    document.getElementById('message').textContent='🔊 重听...';
    document.getElementById('message').className='message playing';
    document.getElementById('staffContainer').classList.add('playing');
    await sleep(300);
    for(let i=0;i<currentSequence.length;i++){
      const t = i / Math.max(1, currentSequence.length - 1);
      let phase;
      if (t < 0.15) phase = 'warmup';
      else if (t < 0.4) phase = 'rise';
      else if (t < 0.7) phase = 'sprint';
      else if (i === currentSequence.length - 1) phase = 'peak';
      else phase = 'sprint';
      playNote(currentSequence[i], intensities[i], i===currentSequence.length-1, phase);
      if(i<currentSequence.length-1) await sleep(timings[i]||1500);
    }
    await sleep(500);
    document.getElementById('staffContainer').classList.remove('playing');
    document.getElementById('message').textContent='👆 继续点击';
    document.getElementById('message').className='message info';
    document.getElementById('replayBtn').disabled=false;
  })();
}

function submitAnswer(note,mx,my){
  userAnswers.push(note);
  const idx=userAnswers.length-1;
  const ok=note===currentSequence[idx];
  clickedNotes.push({name:note,status:ok?'correct':'wrong'});
  // Play the note user clicked (soft, for feedback)
  playNote(note, 0.3, false, 'rise');
  floatHeart(mx,my,ok?'💚':'💔');
  updateSequenceDisplay(); drawStaff();
  if(userAnswers.length===currentSequence.length){
    isListening=false;
    setTimeout(checkResults,500);
  }
}

function floatHeart(x,y,emoji){
  const r=canvas.getBoundingClientRect(); const el=document.createElement('div');
  el.className='heart-float'; el.textContent=emoji;
  el.style.left=(r.left+(x/canvas.width)*r.width)+'px';
  el.style.top=(r.top+(y/canvas.height)*r.height)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1500);
}

function checkResults(){
  const correct=userAnswers.filter((a,i)=>a===currentSequence[i]).length;
  const total=currentSequence.length;
  if(correct===total){
    const pts=Math.round(total*10*(1+combo*0.15));
    score+=pts; combo++; level++;
    document.getElementById('message').textContent=`✨ 完美！+${pts} 分`;
    document.getElementById('message').className='message correct';
  } else {
    combo=0;
    const answer=currentSequence.map(n=>`${n}(${NOTES[n].solfege})`).join(' → ');
    document.getElementById('message').textContent=`${correct}/${total} 正确 · 答案：${answer}`;
    document.getElementById('message').className='message wrong';
  }
  updateStats(); updateFeedbackRow();
  document.getElementById('startBtn').disabled=false;
  document.getElementById('startBtn').textContent='下一关';
  isPlaying=false;
}

function updateSequenceDisplay(){
  const c=document.getElementById('noteSequence'); c.innerHTML='';
  for(let i=0;i<currentSequence.length;i++){
    const chip=document.createElement('div');
    if(i<userAnswers.length){
      const ok=userAnswers[i]===currentSequence[i];
      chip.className='note-chip '+(ok?'correct':'wrong');
      chip.textContent=userAnswers[i];
    } else {chip.className='note-chip pending'; chip.textContent='?';}
    c.appendChild(chip);
  }
}
function updateFeedbackRow(){
  const c=document.getElementById('feedbackRow'); c.innerHTML='';
  currentSequence.forEach((note,i)=>{
    const chip=document.createElement('div'); chip.className='feedback-chip';
    if(userAnswers[i]===note){chip.style.background='rgba(78,205,196,0.3)';chip.textContent=`✓ ${note}`;}
    else{chip.style.background='rgba(255,107,107,0.25)';chip.textContent=`✗ ${note}（你：${userAnswers[i]||'-'}）`;}
    c.appendChild(chip);
  });
}
function updateStats(){
  document.getElementById('level').textContent=level;
  document.getElementById('score').textContent=Math.round(score);
  document.getElementById('combo').textContent=combo;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
drawStaff();
</script>
