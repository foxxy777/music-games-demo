<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听音识谱 - 肉鸽训练</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #eee;
  font-family: 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 { margin: 10px 0 5px; font-size: 28px; }
.subtitle { color: #888; margin-bottom: 15px; }

/* Game stats */
.stats {
  display: flex;
  gap: 30px;
  margin-bottom: 15px;
  font-size: 18px;
}
.stat { 
  background: #16213e; 
  padding: 8px 20px; 
  border-radius: 10px;
  border: 1px solid #0f3460;
}
.stat span { color: #e94560; font-weight: bold; font-size: 22px; }

/* Controls */
.controls { margin-bottom: 15px; display: flex; gap: 15px; align-items: center; }
label { font-size: 14px; color: #aaa; }
select, button {
  background: #0f3460;
  color: #eee;
  border: 1px solid #1a4a8a;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}
select:hover, button:hover { background: #1a4a8a; }
.btn-primary {
  background: #e94560;
  border-color: #e94560;
  font-weight: bold;
  font-size: 18px;
  padding: 10px 30px;
}
.btn-primary:hover { background: #ff5570; }
.btn-replay {
  background: #2d6a4f;
  border-color: #2d6a4f;
}
.btn-replay:hover { background: #40916c; }

/* Status message */
.message {
  min-height: 30px;
  font-size: 18px;
  margin: 8px 0;
  text-align: center;
}
.message.correct { color: #40916c; }
.message.wrong { color: #e94560; }
.message.info { color: #4da6ff; }

/* Staff */
.staff-container {
  background: #fff;
  border-radius: 12px;
  padding: 20px 30px;
  margin: 10px 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
canvas { display: block; cursor: pointer; }

/* Results display */
.note-sequence {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
  min-height: 40px;
}
.note-chip {
  background: #16213e;
  border: 1px solid #0f3460;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
}
.note-chip.played { background: #2d6a4f; border-color: #40916c; }
.note-chip.correct { background: #40916c; border-color: #52b788; }
.note-chip.wrong { background: #e94560; border-color: #ff5570; }
.note-chip.pending { opacity: 0.4; }

/* Answer feedback */
.feedback-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 5px 0;
  min-height: 30px;
}
.feedback-chip {
  padding: 4px 12px;
  border-radius: 6px;
  font-size: 14px;
}
</style>
</head>
<body>

<h1>🎼 听音识谱</h1>
<p class="subtitle">听旋律 → 在五线谱上按顺序点出音符</p>

<div class="stats">
  <div class="stat">关卡 <span id="level">1</span></div>
  <div class="stat">得分 <span id="score">0</span></div>
  <div class="stat">连击 <span id="combo">0</span></div>
</div>

<div class="controls">
  <label>音符数：</label>
  <select id="noteCount">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  <label>速度间隔(ms)：</label>
  <select id="interval">
    <option value="3000" selected>3000</option>
    <option value="2500">2500</option>
    <option value="2000">2000</option>
    <option value="1500">1500</option>
  </select>
  <button class="btn-primary" id="startBtn" onclick="startRound()">开始</button>
  <button class="btn-replay" id="replayBtn" onclick="replaySequence()" disabled>🔊 重新听</button>
</div>

<div class="message info" id="message">点击「开始」按钮，听音后在五线谱上点击对应位置</div>

<div class="note-sequence" id="noteSequence"></div>
<div class="feedback-row" id="feedbackRow"></div>

<div class="staff-container">
  <canvas id="staff" width="700" height="280"></canvas>
</div>

<script>
// === Note definitions ===
// Notes from C4 to F5 (natural notes only)
// Staff positions (Y coordinates on canvas) for treble clef
// Each line/space is spaced by LINE_GAP

const LINE_GAP = 16; // pixels between staff lines
const STAFF_TOP = 50;
const STAFF_LEFT = 100;
const STAFF_WIDTH = 580;

// Note positions: Y coordinate = staff position
// Treble clef lines (bottom to top): E4, G4, B4, D5, F5
// Spaces (bottom to top): F4, A4, C5, E5
// Below staff: D4(space below), C4(1st ledger), B3(below ledger), A3...
// Above staff: G5(space above), A5(1st ledger above)

const NOTES = {
  '4C': { name: '4C', solfege: 'Do', freq: 261.63, staffY: STAFF_TOP + LINE_GAP * 5,     // 1st ledger line below
          ledgerLines: [-1] },
  '4D': { name: '4D', solfege: 'Re', freq: 293.66, staffY: STAFF_TOP + LINE_GAP * 4.5,   // space below staff
          ledgerLines: [] },
  '4E': { name: '4E', solfege: 'Mi', freq: 329.63, staffY: STAFF_TOP + LINE_GAP * 4 },    // bottom line
  '4F': { name: '4F', solfege: 'Fa', freq: 349.23, staffY: STAFF_TOP + LINE_GAP * 3.5 },  // 1st space
  '4G': { name: '4G', solfege: 'Sol',freq: 392.00, staffY: STAFF_TOP + LINE_GAP * 3 },    // 2nd line
  '4A': { name: '4A', solfege: 'La', freq: 440.00, staffY: STAFF_TOP + LINE_GAP * 2.5 },  // 2nd space
  '4B': { name: '4B', solfege: 'Si', freq: 493.88, staffY: STAFF_TOP + LINE_GAP * 2 },    // 3rd line (middle)
  '5C': { name: '5C', solfege: 'Do', freq: 523.25, staffY: STAFF_TOP + LINE_GAP * 1.5 },  // 3rd space
  '5D': { name: '5D', solfege: 'Re', freq: 587.33, staffY: STAFF_TOP + LINE_GAP * 1 },    // 4th line
  '5E': { name: '5E', solfege: 'Mi', freq: 659.25, staffY: STAFF_TOP + LINE_GAP * 0.5 },  // 4th space
  '5F': { name: '5F', solfege: 'Fa', freq: 698.46, staffY: STAFF_TOP },                   // top line
};

const NOTE_LIST = Object.keys(NOTES);

// === Audio ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const NOTE_AUDIO = {};

// Load all note samples
async function loadAudio() {
  const base = 'xstudio_natural_notes/';
  for (const name of NOTE_LIST) {
    try {
      const resp = await fetch(base + name + '.wav');
      const buf = await resp.arrayBuffer();
      NOTE_AUDIO[name] = await audioCtx.decodeAudioData(buf);
    } catch(e) {
      console.warn('Could not load ' + name + '.wav, using synth fallback');
    }
  }
}

function playNote(name) {
  if (NOTE_AUDIO[name]) {
    const src = audioCtx.createBufferSource();
    src.buffer = NOTE_AUDIO[name];
    src.connect(audioCtx.destination);
    src.start();
  } else {
    // Fallback: oscillator
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = NOTES[name].freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.5);
  }
}

// === Game State ===
let currentSequence = [];
let userAnswers = [];
let isPlaying = false;
let isListening = false;
let level = 1;
let score = 0;
let combo = 0;
let clickedNotes = []; // {name, x, y} for display

// === Canvas / Staff ===
const canvas = document.getElementById('staff');
const ctx = canvas.getContext('2d');

function drawStaff() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw 5 staff lines
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const y = STAFF_TOP + i * LINE_GAP;
    ctx.beginPath();
    ctx.moveTo(STAFF_LEFT, y);
    ctx.lineTo(STAFF_LEFT + STAFF_WIDTH, y);
    ctx.stroke();
  }

  // Draw treble clef (simplified)
  ctx.fillStyle = '#333';
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('𝄞', STAFF_LEFT - 30, STAFF_TOP + LINE_GAP * 2.5);

  // Draw bar line at end
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(STAFF_LEFT + STAFF_WIDTH, STAFF_TOP);
  ctx.lineTo(STAFF_LEFT + STAFF_WIDTH, STAFF_TOP + 4 * LINE_GAP);
  ctx.stroke();

  // Draw clicked notes
  clickedNotes.forEach((cn, idx) => {
    drawNote(cn.name, STAFF_LEFT + 80 + idx * 60, NOTES[cn.name].staffY, cn.status);
  });

  // Draw hover indicator
  if (hoverNote) {
    ctx.globalAlpha = 0.3;
    drawNote(hoverNote, hoverX, NOTES[hoverNote].staffY, 'hover');
    ctx.globalAlpha = 1;
  }
}

function drawNote(name, x, y, status) {
  const isCorrect = status === 'correct';
  const isWrong = status === 'wrong';
  
  // Ledger lines for notes below/above staff
  if (NOTES[name].ledgerLines) {
    NOTES[name].ledgerLines.forEach(offset => {
      const ly = STAFF_TOP + LINE_GAP * (4 - offset);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - 14, ly);
      ctx.lineTo(x + 14, ly);
      ctx.stroke();
    });
  }
  
  // Special ledger line for C4 (below staff)
  if (name === '4C') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 14, STAFF_TOP + 5 * LINE_GAP);
    ctx.lineTo(x + 14, STAFF_TOP + 5 * LINE_GAP);
    ctx.stroke();
  }
  // D4 sits just below staff, no ledger needed
  
  // Note head
  ctx.fillStyle = isCorrect ? '#40916c' : isWrong ? '#e94560' : '#1a1a2e';
  ctx.beginPath();
  ctx.ellipse(x, y, 11, 8, -0.3, 0, Math.PI * 2);
  ctx.fill();
  
  // Note stem
  ctx.strokeStyle = isCorrect ? '#40916c' : isWrong ? '#e94560' : '#1a1a2e';
  ctx.lineWidth = 2;
  // Stems go up for notes below middle line, down for above
  if (NOTES[name].staffY > STAFF_TOP + 2 * LINE_GAP) {
    // stem up (right side)
    ctx.beginPath();
    ctx.moveTo(x + 10, y);
    ctx.lineTo(x + 10, y - 35);
    ctx.stroke();
  } else {
    // stem down (left side)
    ctx.beginPath();
    ctx.moveTo(x - 10, y);
    ctx.lineTo(x - 10, y + 35);
    ctx.stroke();
  }
  
  // Note label
  ctx.fillStyle = '#666';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(name, x, y + 28);
}

// === Mouse interaction ===
let hoverNote = null;
let hoverX = 0;

canvas.addEventListener('mousemove', (e) => {
  if (!isListening) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  
  // Find closest note by Y
  let closest = null;
  let minDist = Infinity;
  for (const name of NOTE_LIST) {
    const dist = Math.abs(my - NOTES[name].staffY);
    if (dist < minDist) {
      minDist = dist;
      closest = name;
    }
  }
  
  if (minDist < LINE_GAP * 0.7) {
    hoverNote = closest;
    hoverX = mx;
  } else {
    hoverNote = null;
  }
  drawStaff();
});

canvas.addEventListener('mouseleave', () => {
  hoverNote = null;
  drawStaff();
});

canvas.addEventListener('click', (e) => {
  if (!isListening) return;
  if (hoverNote) {
    submitAnswer(hoverNote);
  }
});

// === Game Logic ===
async function startRound() {
  if (isPlaying) return;
  isPlaying = true;
  isListening = false;
  clickedNotes = [];
  userAnswers = [];
  hoverNote = null;
  
  const count = parseInt(document.getElementById('noteCount').value);
  const interval = parseInt(document.getElementById('interval').value);
  
  // Generate random sequence (allow repeats for longer sequences)
  currentSequence = [];
  for (let i = 0; i < count; i++) {
    const note = NOTE_LIST[Math.floor(Math.random() * NOTE_LIST.length)];
    currentSequence.push(note);
  }
  
  // Show pending chips
  updateSequenceDisplay();
  
  document.getElementById('startBtn').disabled = true;
  document.getElementById('replayBtn').disabled = true;
  document.getElementById('message').textContent = '🔊 听音中...';
  document.getElementById('message').className = 'message info';
  
  // Play sequence
  await sleep(500);
  for (let i = 0; i < currentSequence.length; i++) {
    playNote(currentSequence[i]);
    if (i < currentSequence.length - 1) await sleep(interval);
  }
  
  await sleep(800);
  
  // Enable listening
  isListening = true;
  document.getElementById('message').textContent = '👆 在五线谱上按顺序点击你听到的音符';
  document.getElementById('message').className = 'message info';
  document.getElementById('replayBtn').disabled = false;
  drawStaff();
}

function replaySequence() {
  if (!currentSequence.length || isPlaying) return;
  document.getElementById('replayBtn').disabled = true;
  const interval = parseInt(document.getElementById('interval').value);
  
  (async () => {
    document.getElementById('message').textContent = '🔊 重新播放...';
    for (let i = 0; i < currentSequence.length; i++) {
      playNote(currentSequence[i]);
      if (i < currentSequence.length - 1) await sleep(interval);
    }
    await sleep(500);
    document.getElementById('message').textContent = '👆 继续点击';
    document.getElementById('replayBtn').disabled = false;
  })();
}

function submitAnswer(note) {
  if (!isListening) return;
  if (userAnswers.length >= currentSequence.length) return;
  
  userAnswers.push(note);
  const idx = userAnswers.length - 1;
  const expected = currentSequence[idx];
  const isCorrect = note === expected;
  
  clickedNotes.push({ name: note, status: isCorrect ? 'correct' : 'wrong' });
  
  // Play the note
  playNote(note);
  
  updateSequenceDisplay();
  drawStaff();
  
  if (userAnswers.length === currentSequence.length) {
    // Round complete
    isListening = false;
    checkResults();
  }
}

function checkResults() {
  const correct = userAnswers.filter((a, i) => a === currentSequence[i]).length;
  const total = currentSequence.length;
  const allCorrect = correct === total;
  
  if (allCorrect) {
    score += total * 10 * (1 + combo * 0.1);
    combo++;
    level++;
    document.getElementById('message').textContent = `🎉 全对！+${Math.round(total * 10 * (1 + (combo-1) * 0.1))}分`;
    document.getElementById('message').className = 'message correct';
  } else {
    combo = 0;
    document.getElementById('message').textContent = `❌ ${correct}/${total} 正确，正确答案：${currentSequence.map(n => n + '(' + NOTES[n].solfege + ')').join(' → ')}`;
    document.getElementById('message').className = 'message wrong';
  }
  
  updateStats();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('startBtn').textContent = '下一关';
  isPlaying = false;
  
  // Show answer chips
  updateFeedbackRow();
}

function updateSequenceDisplay() {
  const container = document.getElementById('noteSequence');
  container.innerHTML = '';
  for (let i = 0; i < currentSequence.length; i++) {
    const chip = document.createElement('div');
    if (i < userAnswers.length) {
      const isCorrect = userAnswers[i] === currentSequence[i];
      chip.className = 'note-chip ' + (isCorrect ? 'correct' : 'wrong');
      chip.textContent = userAnswers[i];
    } else if (i === userAnswers.length && isListening) {
      chip.className = 'note-chip pending';
      chip.textContent = '?';
    } else {
      chip.className = 'note-chip pending';
      chip.textContent = '?';
    }
    container.appendChild(chip);
  }
}

function updateFeedbackRow() {
  const container = document.getElementById('feedbackRow');
  container.innerHTML = '';
  currentSequence.forEach((note, i) => {
    const chip = document.createElement('div');
    chip.className = 'feedback-chip';
    if (userAnswers[i] === note) {
      chip.style.background = '#40916c';
      chip.style.color = '#fff';
      chip.textContent = `✓ ${note}`;
    } else {
      chip.style.background = '#e94560';
      chip.style.color = '#fff';
      chip.textContent = `✗ ${note}（你选：${userAnswers[i] || '-'}）`;
    }
    container.appendChild(chip);
  });
}

function updateStats() {
  document.getElementById('level').textContent = level;
  document.getElementById('score').textContent = Math.round(score);
  document.getElementById('combo').textContent = combo;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// === Init ===
document.getElementById('message').textContent = '加载音频中...';
loadAudio().then(() => {
  document.getElementById('message').textContent = '点击「开始」按钮，听音后在五线谱上点击对应位置';
  drawStaff();
});

// Reset start button text
document.getElementById('startBtn').addEventListener('mousedown', function() {
  this.textContent = '开始';
});

</script>
</body>
</html>
