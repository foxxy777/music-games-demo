<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0812">
<title>V11 · 音符对撞 · 走音的八音盒</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0812; touch-action:manipulation;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; }

  #stage { position:fixed; left:50%; top:50%; width:1920px; height:1080px;
    transform:translate(-50%,-50%); transform-origin:center center;
    background:radial-gradient(ellipse at 30% 20%, #1a1326 0%, #0b0812 60%);
    display:flex; flex-direction:column; }

  #turnBanner { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:17px; color:#cbb8de;
    letter-spacing:3px; background:#00000055; padding:6px 22px; border-radius:20px; z-index:50; }

  /* ============ 战场：英雄(左) / 7音轨(中) / 小怪(右) ============ */
  #battlefield { flex:1; display:flex; padding:56px 10px 6px; min-height:0; }
  .charZone { width:250px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:26px; }
  #enemyZone { width:280px; }
  .figure { font-size:120px; line-height:1.15; filter:drop-shadow(0 0 22px rgba(255,215,0,.28)); }
  #enemyZone .figure { filter:drop-shadow(0 0 22px rgba(255,120,160,.30)); }
  .charName { font-size:22px; font-weight:800; letter-spacing:2px; margin-top:8px; }
  #heroZone .charName { color:#ffd88a; } #enemyZone .charName { color:#ff9fc0; }
  .charHpWrap { width:210px; margin-bottom:10px; }
  .hpbar { height:20px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:10px; overflow:hidden; position:relative; }
  .hpfill { height:100%; background:linear-gradient(90deg,#e94560,#ff6b6b); transition:width .35s; }
  #enemyZone .hpfill { background:linear-gradient(90deg,#c0392b,#ff7675); }
  .hptext { position:absolute; inset:0; text-align:center; font-size:13px; color:#fff; line-height:20px; font-weight:700; text-shadow:0 1px 2px #000; }
  .shieldChip { margin-top:6px; font-size:15px; color:#bdefff; font-weight:800; min-height:20px; }
  .shieldChip.has { background:#1f7a8c55; border:1px solid #7ee8fa88; border-radius:10px; padding:1px 12px; }
  #intentLabel { margin-top:14px; font-size:15px; color:#c9a; text-align:center; line-height:1.5; max-width:250px; }

  /* 音轨 */
  #lanesWrap { flex:1; position:relative; padding:6px 8px; min-width:0; }
  #lanes { position:relative; height:100%; display:flex; flex-direction:column-reverse; gap:6px; }
  .lane { flex:1; position:relative; border-radius:12px; background:var(--laneBg); border:1px solid var(--laneBd);
    box-shadow:inset 0 0 30px rgba(0,0,0,.35); overflow:visible; }
  .laneTag { position:absolute; left:-6px; top:50%; transform:translateY(-50%); width:66px; text-align:center;
    font-size:24px; font-weight:900; color:var(--laneC); text-shadow:0 0 12px var(--laneC); font-family:Georgia,serif; z-index:5; }
  .laneZone { position:absolute; left:70px; right:110px; top:0; bottom:0; }
  .goalP { position:absolute; left:70px; top:0; bottom:0; width:8px; border-radius:4px; background:linear-gradient(#7ee8fa33,#1f7a8c55); }
  .goalE { position:absolute; right:110px; top:0; bottom:0; width:8px; border-radius:4px; background:linear-gradient(#ff9fc055,#c0392b66); }

  /* 飞行音块 */
  .blk { position:absolute; width:58px; height:58px; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; font-family:Georgia,serif;
    color:#fff; text-shadow:0 1px 3px #000; will-change:left; z-index:10; }
  .blk.p { border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--c2), var(--c1) 70%); border:3px solid var(--c1);
    box-shadow:0 0 16px var(--c1); }
  .blk.e { border-radius:14px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(135deg, #3a2030, #552838);
    border:3px solid var(--c1); box-shadow:0 0 14px var(--c1); }
  .blk.e > span:not(.fnum) { transform:rotate(-45deg); }
  .blk .fnum { position:absolute; bottom:-6px; right:-6px; font-size:13px; background:#000a; border-radius:8px; padding:1px 6px; color:#ffd88a; font-family:system-ui; }

  /* 待发格（钢琴卷帘出招表）：小一号+呼吸动画 */
  .slot { position:absolute; width:46px; height:46px; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:900; font-family:Georgia,serif;
    color:#fff; text-shadow:0 1px 3px #000; z-index:8; animation:slotbreath 1.6s ease-in-out infinite alternate; }
  .slot.p { border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--c2), var(--c1) 75%); border:2px solid var(--c1);
    box-shadow:0 0 10px var(--c1); opacity:.92; }
  .slot.e { border-radius:10px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(135deg,#3a2030,#552838);
    border:2px solid var(--c1); box-shadow:0 0 9px var(--c1); opacity:.92; }
  .slot.e > span:not(.fnum) { transform:rotate(-45deg); }
  .slot .fnum { position:absolute; bottom:-5px; right:-5px; font-size:11px; background:#000a; border-radius:6px; padding:0 4px; color:#ffd88a; font-family:system-ui; }
  @keyframes slotbreath { from { filter:brightness(.85); } to { filter:brightness(1.12); } }

  #resonantSvg { pointer-events:none; z-index:9; }
  .spark { position:absolute; width:10px; height:10px; border-radius:50%; background:#fff; z-index:20; pointer-events:none;
    animation:sparkfly .55s ease-out forwards; }
  @keyframes sparkfly { to { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
  .dmgFloat { position:absolute; font-size:30px; font-weight:900; color:#ff7675; text-shadow:0 2px 4px #000; z-index:30;
    animation:dmgup .9s ease-out forwards; pointer-events:none; }
  @keyframes dmgup { to { transform:translateY(-56px); opacity:0; } }

  /* ============ 底栏：两张卡 + 结束小节 ============ */
  #bottombar { height:280px; position:relative; display:flex; align-items:flex-end; justify-content:center; padding:0 40px 14px; }
  #hand { display:flex; align-items:flex-end; justify-content:center; gap:36px; min-height:240px; }
  .card { width:230px; height:240px; border-radius:16px; position:relative; cursor:pointer;
    background:linear-gradient(160deg, #2a2333, #171221); border:3px solid var(--cardBd,#556);
    box-shadow:0 4px 14px #000a; transition:transform .16s ease, box-shadow .16s ease; z-index:1; }
  @media (hover:hover) {
    .card:hover { transform:translateY(-30px) scale(1.1); z-index:20; box-shadow:0 10px 30px #000c, 0 0 20px var(--cardBd); }
    #endTurnBtn:hover:not(:disabled) { box-shadow:0 0 26px #ff9fc066; }
    #overlayBtn:hover { background:#ffd60a22; }
  }
  .card.selected { transform:translateY(-30px) scale(1.1); z-index:30; border-color:#ffd60a !important;
    box-shadow:0 10px 34px #000d, 0 0 26px #ffd60aaa !important; }
  .card.disabled { filter:grayscale(.85) brightness(.6); }
  .cardType { text-align:center; font-size:13px; color:#b9a8c9; letter-spacing:4px; margin-top:18px; }
  .cardName { text-align:center; font-size:32px; font-weight:900; margin-top:6px; color:var(--cardTc,#fff);
    text-shadow:0 0 14px var(--cardBd); font-family:Georgia,"Microsoft YaHei",serif; }
  .cardGlyph { text-align:center; font-size:40px; margin:10px 0 4px; }
  .cardDesc { position:absolute; left:12px; right:12px; bottom:38px; text-align:center; font-size:14.5px; line-height:1.5; color:#d8cbe6; }
  .cardForce { position:absolute; bottom:10px; width:100%; text-align:center; font-size:14px; color:#ffd88a; font-weight:800; }

  #endTurnBtn { position:absolute; right:52px; bottom:90px; width:180px; height:64px; border-radius:14px; border:2px solid #ff9fc0;
    background:linear-gradient(160deg,#4a2030,#2a1020); color:#ffb8cf; font-size:21px; font-weight:800; cursor:pointer; letter-spacing:3px;
    box-shadow:0 0 16px #ff9fc033; }
  #endTurnBtn:disabled { opacity:.35; cursor:not-allowed; }
  /* 触屏设备（手机/平板横屏）：按钮加大，好按（必须写在基础规则之后） */
  @media (pointer:coarse) {
    #endTurnBtn { width:230px; height:96px; font-size:26px; right:36px; bottom:76px; border-radius:18px; }
  }

  /* 触屏点选说明条 */
  #cardPreview { position:absolute; bottom:300px; left:50%; transform:translateX(-50%);
    background:#000000d0; border:1px solid #ffd60a66; border-radius:14px; color:#ffe9b0;
    font-size:30px; line-height:1.5; padding:14px 30px; max-width:1500px; white-space:nowrap;
    opacity:0; transition:opacity .15s; pointer-events:none; z-index:60; }
  #cardPreview.show { opacity:1; }
  #cardPreview .pvHint { color:#ffd60a; font-weight:800; }

  /* 竖屏遮罩 */
  #rotateMask { position:fixed; inset:0; z-index:999; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(ellipse at 30% 20%, #1a1326 0%, #0b0812 60%); }
  #rotateMask.show { display:flex; }
  #rotateMask .rotIcon { font-size:76px; line-height:1; animation:rotphone 2.2s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(255,216,10,.25)); }
  @keyframes rotphone { 0%,25% { transform:rotate(0deg); } 55%,100% { transform:rotate(-90deg); } }
  #rotateMask .rotTitle { font-size:30px; color:#ffd88a; font-weight:800; letter-spacing:2px; }
  #rotateMask .rotSub { font-size:16px; color:#9a8bb0; }

  #toast { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:#000c; color:#ffd88a; font-size:17px;
    padding:10px 28px; border-radius:12px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; max-width:1400px; text-align:center; }

  #overlay { position:absolute; inset:0; background:#000000bb; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; }
  #overlay.show { display:flex; }
  #overlayTitle { font-size:74px; font-weight:900; letter-spacing:8px; margin-bottom:14px; }
  #overlaySub { font-size:20px; color:#b9a8c9; margin-bottom:44px; }
  #overlayBtn { padding:16px 52px; font-size:22px; border-radius:14px; border:2px solid #ffd60a; background:transparent;
    color:#ffd60a; cursor:pointer; letter-spacing:4px; font-weight:800; }
</style>
</head>
<body>
<div id="stage">
  <div id="turnBanner">第 1 小节</div>

  <div id="battlefield">
    <div class="charZone" id="heroZone">
      <div class="charHpWrap">
        <div class="hpbar"><div class="hpfill" id="pHpFill"></div><div class="hptext" id="pHpText"></div></div>
        <div class="shieldChip" id="shieldChip"></div>
      </div>
      <div class="figure">📻</div>
      <div class="charName">老收音机</div>
    </div>

    <div id="lanesWrap">
      <div id="lanes"></div>
    </div>

    <div class="charZone" id="enemyZone">
      <div class="charHpWrap">
        <div class="hpbar"><div class="hpfill" id="eHpFill"></div><div class="hptext" id="eHpText"></div></div>
      </div>
      <div class="figure">🎵</div>
      <div class="charName">走音的八音盒</div>
      <div id="intentLabel"></div>
    </div>
  </div>

  <div id="bottombar">
    <div id="cardPreview"></div>
    <div id="hand">
      <div class="card" id="cardAttack">
        <div class="cardType">攻 击</div>
        <div class="cardName">四季 · 春</div>
        <div class="cardGlyph">🌸</div>
        <div class="cardDesc">奏响维瓦尔第《春》的下一句（6 个音块）</div>
        <div class="cardForce">每个音块 力度 4</div>
      </div>
      <div class="card" id="cardDefense">
        <div class="cardType">防 御</div>
        <div class="cardName">升阶曲</div>
        <div class="cardGlyph">🛡️</div>
        <div class="cardDesc">升起 8 点护盾，抵挡本回合伤害（机制占位，待大爷细化）</div>
        <div class="cardForce">护盾 8</div>
      </div>
    </div>
    <button id="endTurnBtn">结束小节</button>
  </div>

  <div id="toast"></div>
  <div id="overlay">
    <div id="overlayTitle"></div>
    <div id="overlaySub"></div>
    <button id="overlayBtn">再奏一曲</button>
  </div>
</div>

<div id="rotateMask">
  <div class="rotIcon">📱</div>
  <div class="rotTitle">请把手机横过来</div>
  <div class="rotSub">这个游戏为横屏设计 · 转过来就开始（若已锁定屏幕方向，请先解除锁定）</div>
</div>

<script>
'use strict';
/* ================= V11 音符对撞 · 卷帘对峙版 =================
   大爷 09-01 10:54 改版：
   - 英雄(左) vs 小怪(右)，血条挂在各自头上
   - 敌方意图 = 音轨右端预排待发格（先发的靠中间）
   - 我方出卡 = 音轨左端预排待发格
   - 结束小节：双方按节拍(500ms/step)齐射 → 同轨对撞抵消 → 到达扣血
   - 手牌只有两张：四季·春(攻击·每回合一次) / 升阶曲(防御占位·每回合一次)
   音序来源：v10h_audio/analysis/tracks.json《春》真音频归轨数据。 */

const NOTES = [
  { id:'do',  cn:'Do',  semi:0,  hue:0   },
  { id:'re',  cn:'Re',  semi:2,  hue:55  },
  { id:'mi',  cn:'Mi',  semi:4,  hue:203 },
  { id:'fa',  cn:'Fa',  semi:5,  hue:352 },
  { id:'sol', cn:'Sol', semi:7,  hue:32  },
  { id:'la',  cn:'La',  semi:9,  hue:128 },
  { id:'si',  cn:'Si',  semi:11, hue:225 },
];
const NMAP = Object.fromEntries(NOTES.map(n=>[n.id,n]));
const LANE_C = {};
NOTES.forEach(n=>{
  LANE_C[n.id] = { c1:`hsl(${n.hue} 90% 58%)`, c2:`hsl(${n.hue} 70% 30%)`,
    bg:`hsl(${n.hue} 60% 14% / .55)`, bd:`hsl(${n.hue} 70% 40% / .5)` };
});

/* ---------- 曲子数据 ---------- */
/* 维瓦尔第《春》主题：v10h_audio 真音频归轨（E大调 mi 主导，14 格） */
const SPRING = ['mi','mi','mi','mi','sol','mi','mi','mi','fa','mi','si','si','sol','mi'];
const SPRING_SEG = 6, SPRING_FORCE = 4;
/* 敌方：小星星分句，4 小节循环，每圈力度 +cycle 加成 */
const SONG = [
  { label:'小星星 · 第一句', notes:[['do',3],['do',3],['sol',4]] },
  { label:'小星星 · 第二句', notes:[['sol',4],['la',4],['la',5]] },
  { label:'小星星 · 第三句', notes:[['si',5],['do',6]] },
  { label:'小星星 · 第四句', notes:[['do',4],['sol',4],['la',5],['si',5]] },
];
const ENEMY_HP = 66, PLAYER_HP = 50, SHIELD_VAL = 8;
const NOTE_FORCE_UNUSED = 0, BASE_SPEED = 240; // px/s（设计稿坐标）

/* ---------- 状态 ---------- */
const S = {
  php:PLAYER_HP, ehp:ENEMY_HP, shield:0,
  turn:1, phase:'play', // play | resolve | over
  blocks:[],            // 飞行中的音块
  pending:{ p:[], e:[] }, // 待发格（卷帘）：{note, force, step, slotEl}
  springIdx:0, cardsUsed:{ attack:false, defense:false },
  cycle:0, songIdx:0, launched:false,
};
const $=id=>document.getElementById(id);
const lanesEl=$('lanes');

/* ---------- 音频（Web Audio 合成；首次触摸解锁） ---------- */
let AC=null;
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); }
document.addEventListener('pointerdown', ensureAudio, {capture:true});
document.addEventListener('touchstart', ensureAudio, {capture:true, passive:true});
function playNote(id, vol=.4, dur=.5){
  if(!AC || AC.state!=='running') return;
  const f=261.63*Math.pow(2,NMAP[id].semi/12), t=AC.currentTime;
  const o1=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
  o1.type='triangle'; o2.type='sine'; o1.frequency.value=f; o2.frequency.value=f*2;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o1.connect(g); o2.connect(g); g.connect(AC.destination);
  o1.start(t); o2.start(t); o1.stop(t+dur); o2.stop(t+dur);
}
function playCrash(){ if(!AC)return; const t=AC.currentTime, len=.22, buf=AC.createBuffer(1,AC.sampleRate*len|0,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(); s.buffer=buf; const g=AC.createGain(); g.gain.value=.35;
  const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900;
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); }
function playChord(ids){ ids.forEach((n,i)=>setTimeout(()=>playNote(n,.45,.75), i*90)); }
function playBad(){ playNote('fa',.3,.3); setTimeout(()=>playNote('mi',.3,.4),110); }

/* ---------- 舞台缩放（全横屏） ---------- */
const stage=$('stage');
const DESIGN_W=1920, DESIGN_H=1080;
let S_SCALE=1;
const TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints>0 || matchMedia('(pointer: coarse)').matches;
function fit(){
  const portrait = innerWidth < innerHeight;
  $('rotateMask').classList.toggle('show', portrait);
  stage.style.visibility = portrait ? 'hidden' : 'visible';
  S_SCALE = Math.min(innerWidth/DESIGN_W, innerHeight/DESIGN_H);
  stage.style.transform=`translate(-50%,-50%) scale(${S_SCALE})`;
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);
fit();

/* ---------- 建轨道 ---------- */
NOTES.forEach(n=>{
  const lane=document.createElement('div'); lane.className='lane'; lane.id='lane_'+n.id;
  const c=LANE_C[n.id];
  lane.style.setProperty('--laneBg',c.bg); lane.style.setProperty('--laneBd',c.bd); lane.style.setProperty('--laneC',c.c1);
  lane.innerHTML=`<div class="laneTag">${n.cn}</div><div class="laneZone" id="zone_${n.id}"></div>
    <div class="goalP"></div><div class="goalE"></div>`;
  lanesEl.appendChild(lane);
});
function zoneOf(id){ return $('zone_'+id); }
function zoneW(id){ return zoneOf(id).clientWidth; }

/* ---------- 飞行音块 ---------- */
function spawnBlock(side, note, force){
  const c=LANE_C[note];
  const el=document.createElement('div'); el.className='blk '+side;
  el.style.setProperty('--c1',c.c1); el.style.setProperty('--c2',c.c2);
  el.innerHTML=`<span>${NMAP[note].cn}</span><span class="fnum">${force}</span>`;
  const b={ side, note, force, x:(side==='p'?40:zoneW(note)-40), el };
  el.style.left=b.x+'px'; zoneOf(note).appendChild(el);
  S.blocks.push(b);
  playNote(note, side==='p'?.4:.25, side==='p'?.5:.35);
  return b;
}
function killBlock(b, spark=true){
  if(spark) doSpark(b);
  b.el.remove(); const i=S.blocks.indexOf(b); if(i>=0) S.blocks.splice(i,1);
}
function stagePosOfZone(zone){
  const r=zone.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  return { ox:(r.left-sr.left)/S_SCALE, oy:(r.top-sr.top)/S_SCALE, w:r.width/S_SCALE, h:r.height/S_SCALE };
}
function doSpark(b){
  const z=stagePosOfZone(zoneOf(b.note));
  const zx=z.ox + b.x, zy=z.oy + z.h/2;
  for(let i=0;i<6;i++){
    const sp=document.createElement('div'); sp.className='spark';
    sp.style.left=zx+'px'; sp.style.top=zy+'px';
    sp.style.background=Math.random()<.5?LANE_C[b.note].c1:'#fff';
    sp.style.setProperty('--dx',(Math.random()*160-80)+'px');
    sp.style.setProperty('--dy',(Math.random()*120-60)+'px');
    stage.appendChild(sp); setTimeout(()=>sp.remove(),600);
  }
}
function floatDmg(target, val){
  const el=document.createElement('div'); el.className='dmgFloat'; el.textContent='-'+val;
  const px = target==='e'? 1620 : 300, py = 260;
  el.style.left=px+'px'; el.style.top=py+'px'; stage.appendChild(el); setTimeout(()=>el.remove(),950);
}

/* ---------- 待发格（卷帘） ---------- */
function queueBlock(side, note, force, step){
  const b={ side, note, force, step, slotEl:null };
  S.pending[side].push(b);
  renderSlot(b);
  return b;
}
function renderSlot(b){
  const c=LANE_C[b.note];
  const el=document.createElement('div'); el.className='slot '+b.side;
  el.style.setProperty('--c1',c.c1); el.style.setProperty('--c2',c.c2);
  el.innerHTML=`<span>${NMAP[b.note].cn}</span><span class="fnum">${b.force}</span>`;
  el.style.left=slotX(b)+'px';
  zoneOf(b.note).appendChild(el);
  b.slotEl=el;
}
/* 我方格排在左端：先发的(step小)最靠中间，依次往左；敌方镜像 */
function slotX(b){
  const w=zoneW(b.note);
  const same=S.pending[b.side].filter(x=>x.note===b.note && x.step<=b.step).length; // 含自己，1=第一个
  const k=same-1;
  return b.side==='p' ? 108 + k*62 : w-108 - k*62;
}
function refreshSlots(side){
  S.pending[side].forEach(b=>{ if(b.slotEl){ b.slotEl.style.left=slotX(b)+'px'; } });
}
function removeSlot(b){
  if(b.slotEl){ b.slotEl.remove(); b.slotEl=null; }
  const arr=S.pending[b.side]; const i=arr.indexOf(b); if(i>=0){ arr.splice(i,1); refreshSlots(b.side); }
}

/* ---------- 卡牌 ---------- */
function renderCards(){
  const atk=$('cardAttack'), def=$('cardDefense');
  atk.classList.toggle('disabled', S.phase!=='play' || S.cardsUsed.attack);
  def.classList.toggle('disabled', S.phase!=='play' || S.cardsUsed.defense);
  atk.style.setProperty('--cardBd','#63d47e'); atk.style.setProperty('--cardTc','#fff');
  def.style.setProperty('--cardBd','#7ea8d4'); def.style.setProperty('--cardTc','#e6f0ff');
  atk.classList.toggle('selected', selectedCard==='attack');
  def.classList.toggle('selected', selectedCard==='defense');
}
function nextSpringSeg(){
  const seg=[];
  for(let i=0;i<SPRING_SEG;i++) seg.push(SPRING[(S.springIdx+i)%SPRING.length]);
  S.springIdx=(S.springIdx+SPRING_SEG)%SPRING.length;
  return seg;
}
function playCard(key){
  if(S.phase!=='play'){ toast('这一小节已经结束啦'); return; }
  if(S.cardsUsed[key]){ toast(key==='attack'?'四季·春 本小节已奏过':'升阶曲 本小节已用'); return; }
  clearSelection();
  if(key==='attack'){
    S.cardsUsed.attack=true;
    const seg=nextSpringSeg();
    seg.forEach((note,i)=> queueBlock('p', note, SPRING_FORCE, i));
    refreshSlots('p');
    toast('🌸 四季·春：'+seg.map(n=>NMAP[n].cn).join('-')+' 蓄势待发');
  } else {
    S.cardsUsed.defense=true;
    S.shield+=SHIELD_VAL;
    toast('🛡️ 升阶曲：护盾 +'+SHIELD_VAL);
  }
  renderTop(); renderCards();
}
/* 触屏两段式 */
let selectedCard=null;
function clearSelection(){ selectedCard=null; hidePreview(); renderCards(); }
function showPreview(key){
  const pv=$('cardPreview');
  const usable=S.phase==='play' && !S.cardsUsed[key];
  const name=key==='attack'?'四季·春':'升阶曲';
  const desc=key==='attack'?'奏响维瓦尔第《春》下一句（6 音块×力度4）':`护盾 +${SHIELD_VAL}（占位机制，待细化）`;
  pv.innerHTML=`【${name}】 ${desc} <span class="pvHint">${usable?'▸ 再点一次打出':'▸ '+(S.phase!=='play'?'等这小节结束':'本小节已用')}</span>`;
  pv.classList.add('show');
}
function hidePreview(){ $('cardPreview').classList.remove('show'); }
function cardTap(key){
  if(!TOUCH){ playCard(key); return; }
  if(selectedCard===key){ clearSelection(); playCard(key); return; }
  selectedCard=key; renderCards(); showPreview(key);
}
$('cardAttack').onclick=(ev)=>{ ev.stopPropagation(); cardTap('attack'); };
$('cardDefense').onclick=(ev)=>{ ev.stopPropagation(); cardTap('defense'); };
lanesEl.addEventListener('pointerdown', ()=>{ if(selectedCard) clearSelection(); });

/* ---------- 顶栏渲染 ---------- */
function renderTop(){
  $('pHpFill').style.width=(S.php/PLAYER_HP*100)+'%'; $('pHpText').textContent=S.php+' / '+PLAYER_HP;
  $('eHpFill').style.width=(Math.max(0,S.ehp)/ENEMY_HP*100)+'%'; $('eHpText').textContent=Math.max(0,S.ehp)+' / '+ENEMY_HP;
  const sc=$('shieldChip');
  if(S.shield>0){ sc.textContent='🛡️ '+S.shield; sc.classList.add('has'); } else { sc.textContent=''; sc.classList.remove('has'); }
  $('turnBanner').textContent='第 '+S.turn+' 小节'+(S.phase==='resolve'?' · 交战中…':'');
  $('endTurnBtn').disabled = S.phase!=='play';
}
function renderIntent(){
  const bar=SONG[S.songIdx];
  $('intentLabel').innerHTML=`结束本小节时它将唱：<br><b style="color:#ff9fc0">${bar.label}</b>${S.cycle>0?`（狂热+${S.cycle}）`:''}<br><span style="font-size:13px">（右侧菱形格=它的音块）</span>`;
}

/* ---------- 结束小节：双方齐射 ---------- */
const STEP_MS=500;
$('endTurnBtn').onclick=()=>{
  if(S.phase!=='play') return;
  clearSelection();
  S.phase='resolve'; renderTop(); renderCards();
  const maxStep=Math.max(0, ...S.pending.p.map(b=>b.step), ...S.pending.e.map(b=>b.step), 0);
  for(let step=0; step<=maxStep; step++){
    setTimeout(()=>{
      if(S.phase==='over') return;
      S.pending.p.filter(b=>b.step===step).forEach(b=>{ removeSlot(b); spawnBlock('p',b.note,b.force); });
      S.pending.e.filter(b=>b.step===step).forEach(b=>{ removeSlot(b); spawnBlock('e',b.note,b.force); });
    }, step*STEP_MS);
  }
  // 注意：不能提前清空 S.pending —— 发射器从里面逐个取；全部发射后自然清空
};
function endResolveCheck(){
  if(S.phase!=='resolve') return;
  if(S.blocks.length){ setTimeout(endResolveCheck,400); return; }
  if(S.php<=0) return gameOver(false);
  if(S.ehp<=0) return gameOver(true);
  S.turn++; S.cardsUsed={attack:false,defense:false}; S.shield=0; S.phase='play';
  S.songIdx++; if(S.songIdx>=SONG.length){ S.songIdx=0; S.cycle++; }
  queueEnemyIntent();
  renderTop(); renderCards(); renderIntent();
  toast('📻 第 '+S.turn+' 小节 · 出牌吧');
}
function queueEnemyIntent(){
  SONG[S.songIdx].notes.forEach(([n,f],i)=> queueBlock('e', n, f+S.cycle, i));
  refreshSlots('e');
}

/* ---------- 主循环：飞行 / 对撞 / 到达 ---------- */
let lastT=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(S.phase!=='over'){
    for(const b of [...S.blocks]){
      const dir=b.side==='p'?1:-1;
      b.x += dir*BASE_SPEED*dt;
      b.el.style.left=b.x+'px';
      if(b.side==='p' && b.x>=zoneW(b.note)-26){
        S.ehp-=b.force; floatDmg('e',b.force); doSpark(b);
        playChord([b.note]); killBlock(b,false);
        renderTop();
        if(S.ehp<=0) return gameOver(true);
      } else if(b.side==='e' && b.x<=26){
        let dmg=b.force;
        if(S.shield>0){ const abs=Math.min(S.shield,dmg); S.shield-=abs; dmg-=abs; }
        if(dmg>0){ S.php-=dmg; floatDmg('p',dmg); }
        doSpark(b); playCrash(); killBlock(b,false);
        renderTop();
        if(S.php<=0) return gameOver(false);
      }
    }
    for(let i=0;i<S.blocks.length;i++){
      const a=S.blocks[i];
      for(let j=i+1;j<S.blocks.length;j++){
        const b=S.blocks[j];
        if(a.note===b.note && a.side!==b.side && Math.abs(a.x-b.x)<44){
          playCrash();
          const diff=a.force-b.force;
          if(diff>0){ b.force=0; killBlock(b); a.force=diff; a.el.querySelector('.fnum').textContent=a.force;
            toast('💥 '+NMAP[a.note].cn+' 轨对撞！我方胜出，余力 '+diff); }
          else if(diff<0){ a.force=0; killBlock(a); b.force=-diff; b.el.querySelector('.fnum').textContent=b.force;
            toast('💥 '+NMAP[b.note].cn+' 轨对撞！敌方胜出，余力 '+(-diff)); }
          else { toast('💥 '+NMAP[a.note].cn+' 轨对撞！同归于尽'); killBlock(a); killBlock(b); }
          renderTop(); break;
        }
      }
    }
    if(S.phase==='resolve' && !S.blocks.length && !S.pending.p.length && !S.pending.e.length) endResolveCheck();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- 胜负 ---------- */
function gameOver(win){
  S.phase='over'; renderTop(); clearSelection();
  S.pending.p.forEach(b=>b.slotEl&&b.slotEl.remove()); S.pending.e.forEach(b=>b.slotEl&&b.slotEl.remove());
  S.pending.p=[]; S.pending.e=[];
  const ov=$('overlay');
  $('overlayTitle').textContent = win?'🏆 演出成功':'📻 声音哑了';
  $('overlayTitle').style.color = win?'#ffd60a':'#ff7675';
  $('overlaySub').textContent = win?'走音的八音盒被你的旋律治好了':'收音机需要重新调频……';
  ov.classList.add('show');
  if(win) playChord(['do','mi','sol','do']);
  else playBad();
}
$('overlayBtn').onclick=()=>location.reload();

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,1600); }

/* ---------- 开局 ---------- */
queueEnemyIntent();
renderTop(); renderCards(); renderIntent();
toast('📻 打出「四季·春」，音块排在音轨左端；点「结束小节」双方齐射对撞！');
window.__game=S; window.__api={playCard, spawnBlock}; // 调试/测试钩子
window.__touch=TOUCH;
</script>
