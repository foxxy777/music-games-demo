<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V10b Demo - 听音辨序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0e16; --bg2:#141a2a; --border:#26304a;
  --accent:#e94560; --accent2:#52b788; --gold:#ffd700;
  --text:#eee; --dim:#8892b0;
}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(1200px 800px at 70% 20%,#141a2a 0%,#0b0e16 60%,#070910 100%);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
button{touch-action:manipulation;cursor:pointer}

/* ===== 1920x1080 舞台（等比缩放居中） ===== */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);transform-origin:center;display:flex;background:#0d1120;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 30px 80px rgba(0,0,0,0.6)}

/* ===== 左 1/3：唱名方块键盘 ===== */
.left-panel{width:640px;height:100%;display:flex;flex-direction:column;padding:14px 14px 16px;border-right:1px solid var(--border)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.panel-header h3{color:var(--accent);font-size:24px;letter-spacing:2px}
.round-info{color:var(--dim);font-size:18px}

.note-stack{flex:1;display:flex;flex-direction:column;gap:3px;min-height:0}

.note-bar{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 0 14px;border-radius:8px;border:1px solid transparent;
  background:hsla(var(--hue),70%,55%,0.10);
  border-left:6px solid hsl(var(--hue),70%,55%);
  transition:background 0.15s,box-shadow 0.15s,transform 0.1s;
  position:relative;
}
.nb-name{font-size:25px;font-weight:800;letter-spacing:1px;color:hsl(var(--hue),75%,68%);line-height:1}
.nb-label{font-family:Consolas,monospace;font-size:18px;font-weight:700;color:rgba(255,255,255,0.35);line-height:1}

/* 播放中亮起 */
.note-bar.lit{
  background:hsla(var(--hue),85%,60%,0.55);
  box-shadow:0 0 24px hsla(var(--hue),85%,60%,0.45),inset 0 0 12px rgba(255,255,255,0.18);
  transform:scale(1.03);
}
.note-bar.lit .nb-name{color:#fff;text-shadow:0 0 14px rgba(255,255,255,0.8)}
.note-bar.lit .nb-label{color:rgba(255,255,255,0.85)}

/* 玩家点过的反馈 */
.note-bar.tapped{outline:3px solid var(--accent2);outline-offset:1px;animation:tappop 0.35s ease}
@keyframes tappop{0%{transform:scale(0.96)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* 答错时正确答案提示 */
.note-bar.reveal{outline:3px solid #4fc3f7;outline-offset:1px;animation:revealPulse 0.5s ease infinite alternate}
@keyframes revealPulse{from{background:hsla(203,90%,60%,0.25)}to{background:hsla(203,90%,60%,0.55)}}

/* ===== 右 2/3：预留图片区 ===== */
.right-panel{width:1280px;height:100%;position:relative}
/* 占位提示：放图时删掉这一块即可 */
.reserved{position:absolute;inset:30px;border:2px dashed rgba(255,255,255,0.10);border-radius:16px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.14);font-size:30px;letter-spacing:6px;pointer-events:none}

/* HUD 右上角 */
.hud-chips{position:absolute;top:22px;right:26px;display:flex;gap:12px}
.chip{background:rgba(0,0,0,0.45);border:1px solid var(--border);border-radius:999px;padding:8px 22px;font-size:20px}
.chip b{color:var(--gold);font-size:22px;margin-left:8px}

/* 控制坞 右下角 */
.control-dock{position:absolute;left:30px;right:30px;bottom:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.state-bar{width:100%;text-align:center;padding:12px;border-radius:10px;font-size:20px;font-weight:bold;background:rgba(0,0,0,0.5);color:var(--dim)}
.state-bar.listen{background:rgba(233,69,96,0.18);color:var(--accent);border:1px solid var(--accent)}
.state-bar.repeat{background:rgba(82,183,136,0.18);color:var(--accent2);border:1px solid var(--accent2)}
.state-bar.correct{background:rgba(82,183,136,0.3);color:var(--accent2)}
.state-bar.wrong{background:rgba(233,69,96,0.3);color:var(--accent)}

.click-sequence{display:flex;gap:10px;justify-content:center;min-height:44px}
.click-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold}
.click-dot.pending{background:rgba(255,255,255,0.08);border:2px dashed var(--dim)}
.click-dot.filled{background:var(--gold);color:#000}
.click-dot.wrong{background:var(--accent);color:#fff}

.btn-row{display:flex;gap:14px}
.btn{padding:14px 46px;border:none;border-radius:12px;font-size:20px;font-weight:bold;transition:all 0.2s}
.btn-play{background:var(--accent);color:#fff}
.btn-replay{background:#223052;color:var(--text);border:1px solid var(--border)}
.btn-replay:hover{background:#2c3d68}
.btn-next{background:var(--accent2);color:#fff}
.btn-next:hover{background:#3a8c68}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-small{padding:14px 26px;background:#1b2440;color:var(--text);border:1px solid var(--border);font-size:18px}
.btn-small:hover:not(:disabled){background:#263358}
.btn-submit.ready{animation:submitPulse 1s ease infinite}
@keyframes submitPulse{0%,100%{box-shadow:0 0 0 0 rgba(82,183,136,0.45)}50%{box-shadow:0 0 26px 6px rgba(82,183,136,0.45)}}

/* 判定文字（舞台中央） */
.judgment-text{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:96px;font-weight:bold;z-index:6;pointer-events:none;opacity:0;white-space:nowrap}
.judgment-text.show{animation:judgePop 0.6s ease-out}
.judgment-text.correct{color:var(--accent2);text-shadow:0 0 40px var(--accent2)}
.judgment-text.wrong{color:var(--accent);text-shadow:0 0 40px var(--accent)}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* 开始遮罩 */
.start-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(4,6,12,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.start-overlay h1{color:var(--accent);font-size:42px;margin-bottom:10px}
.start-overlay p{color:var(--dim);margin-bottom:22px;text-align:center;max-width:520px;line-height:1.7;font-size:16px}
.rotate-hint{display:none;color:#e94560;font-size:14px;margin-bottom:14px}
@media (orientation:portrait){.rotate-hint{display:block}}
.start-btn{background:var(--accent);color:#fff;border:none;padding:16px 56px;font-size:24px;border-radius:50px;transition:all 0.2s}
.start-btn:hover{background:#ff6b6b;transform:scale(1.05)}
.difficulty{display:flex;gap:12px;margin-bottom:20px}
.diff-btn{background:var(--bg2);color:var(--text);border:2px solid var(--border);padding:10px 24px;border-radius:10px;font-size:14px;transition:all 0.2s}
.diff-btn.active{border-color:var(--accent);background:rgba(233,69,96,0.2);color:var(--accent)}
</style>
</head>
<body>
<div id="loader" style="position:fixed;inset:0;background:#0b0e16;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200">
<div style="width:48px;height:48px;border:4px solid #26304a;border-top-color:#e94560;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px"></div>
<div style="color:#8892b0;font-size:14px;margin-bottom:4px" id="loadText">Loading audio...</div>
<div style="color:#e94560;font-size:24px;font-weight:bold" id="loadPct">0%</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<div id="stage">
  <!-- 左 1/3：唱名方块键盘 -->
  <div class="left-panel">
    <div class="panel-header">
      <h3>📜 听音辨序</h3>
      <div class="round-info" id="roundInfo">第 1 轮 · 难度：3音</div>
    </div>
    <div class="note-stack" id="noteStack"></div>
  </div>

  <!-- 右 2/3：预留图片区（放图时删掉 .reserved 占位块即可） -->
  <div class="right-panel">
    <div class="reserved">🖼️ 图片预留区</div>

    <div class="hud-chips">
      <div class="chip">得分<b id="score">0</b></div>
      <div class="chip">连击<b id="combo">0</b></div>
      <div class="chip">轮次<b id="totalRounds">0</b></div>
    </div>

    <div class="control-dock">
      <div class="state-bar listen" id="stateBar">🎧 准备听音</div>
      <div class="click-sequence" id="clickSeq"></div>
      <div class="btn-row">
        <button class="btn btn-replay" id="btnReplay" onclick="replayQuestion()" disabled>🔊 重听题目</button>
        <button class="btn btn-replay" id="btnMyAnswer" onclick="replayMyAnswer()" disabled>🎵 播我的答案</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-small" id="btnUndo" onclick="undoPick()" disabled>↩ 撤销</button>
        <button class="btn btn-small" id="btnClear" onclick="clearPicks()" disabled>🗑 清空</button>
        <button class="btn btn-next btn-submit" id="btnSubmit" onclick="submitAnswer()" disabled>✅ 提交 0/3</button>
        <button class="btn btn-next" id="btnNext" onclick="nextRound()" style="display:none">➡️ 下一轮</button>
      </div>
    </div>
  </div>

  <div class="judgment-text" id="judgeText"></div>
</div>

<!-- 开始遮罩 -->
<div class="start-overlay" id="startOverlay">
  <h1>🎵 听音辨序 V10b</h1>
  <p>先听一段音符序列，按顺序点击左侧唱名方块作答（点击即发声）<br>Do Re Mi Fa Sol La Si 七个音，可以撤销/清空，可重听题目或回放答案<br>按够数量后点「交卷」判定！</p>
  <div class="rotate-hint">📱 手机建议横屏游玩</div>
  <div class="difficulty">
    <button class="diff-btn active" data-level="3" onclick="setDifficulty(3)">3 个音</button>
    <button class="diff-btn" data-level="4" onclick="setDifficulty(4)">4 个音</button>
    <button class="diff-btn" data-level="5" onclick="setDifficulty(5)">5 个音</button>
  </div>
  <button class="start-btn" onclick="startGame()">▶ 开始</button>
</div>

<script>
// ============================
// 配置
// ============================
// 只用一个八度的自然音（4C~4B，中音区）：Do Re Mi Fa Sol La Si
const SCALE_NOTES = ['4C','4D','4E','4F','4G','4A','4B'];

// 唱名（固定 Do 唱法），♯ 为半音
const SOLFEGE = ['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const PC_BASE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function pitchClass(label) {
  const m = label.match(/^(\d)([A-G])(s?)$/);
  return (PC_BASE[m[2]] + (m[3] ? 1 : 0)) % 12;
}
function solfege(label) { return SOLFEGE[pitchClass(label)]; }

function getQuestionFile(label) { return `assets/audio/question_${label}.wav`; }
function getAnswerFile(label)   { return `assets/audio/${label}.wav`; }

// 从高音到低音排列（Si 顶 → Do 底）
const NOTES_LAYOUT = ['4B','4A','4G','4F','4E','4D','4C'];

const NOTE_GAP = 0.25;

// ============================
// 状态
// ============================
let difficulty = 3;
let gameState = 'idle'; // idle, listening, repeating, judging
let score = 0, combo = 0, totalRounds = 0;
let currentSequence = [];
let playerSequence = [];
let highlightedNotes = new Set();
let audioBuffers = {};
let audioCtx = null;
let playTimers = [];
let flashNote = null, flashTimer = null;
let revealNotes = new Set();

// ============================
// 舞台缩放（1920x1080 等比适配）
// ============================
const stage = document.getElementById('stage');
function fitStage() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage, 300));
fitStage();

// ============================
// 构建唱名方块
// ============================
const noteStack = document.getElementById('noteStack');
NOTES_LAYOUT.forEach(label => {
  const pc = pitchClass(label);
  const btn = document.createElement('button');
  btn.className = 'note-bar';
  btn.dataset.note = label;
  btn.style.setProperty('--hue', pc * 30); // 音级→色相：12 个半音均分色环
  btn.innerHTML = `<span class="nb-name">${SOLFEGE[pc]}</span><span class="nb-label">${label}</span>`;
  btn.addEventListener('click', () => onNotePick(label));
  noteStack.appendChild(btn);
});

function renderNoteStates() {
  document.querySelectorAll('.note-bar').forEach(b => {
    const n = b.dataset.note;
    b.classList.toggle('lit', highlightedNotes.has(n));
    b.classList.toggle('tapped', flashNote === n);
    b.classList.toggle('reveal', revealNotes.has(n));
  });
}

function flashTappedNote(note) {
  flashNote = note;
  renderNoteStates();
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashNote = null; renderNoteStates(); }, 400);
}

function revealAnswer(note, holdMs = 2200) {
  revealNotes.add(note);
  renderNoteStates();
  setTimeout(() => { revealNotes.delete(note); renderNoteStates(); }, holdMs);
}

// 移动端音频解锁
function ensureAudioRunning() {
  if (!audioCtx || audioCtx.state !== 'suspended') return;
  try {
    const b = audioCtx.createBuffer(1, 1, 22050);
    const s = audioCtx.createBufferSource();
    s.buffer = b;
    s.connect(audioCtx.destination);
    s.start(0);
  } catch (e) {}
  audioCtx.resume().catch(() => {});
}
['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(ev => {
  document.addEventListener(ev, ensureAudioRunning, { passive: true });
});

// ============================
// 音频
// ============================
let _loadTotal = 0, _loadDone = 0;
async function loadAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  _loadTotal = SCALE_NOTES.length * 2;
  _loadDone = 0;

  const loadFails = [];
  async function loadOne(url, key) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) { loadFails.push(key); return; }
      const buf = await resp.arrayBuffer();
      audioBuffers[key] = await audioCtx.decodeAudioData(buf);
    } catch(e) { loadFails.push(key); console.warn('Load fail:', key, e); }
    finally {
      _loadDone++;
      var pct = Math.round((_loadDone / _loadTotal) * 100);
      var lt = document.getElementById('loadText');
      var lp = document.getElementById('loadPct');
      if (lt) lt.textContent = 'Loading... ' + _loadDone + '/' + _loadTotal;
      if (lp) lp.textContent = pct + '%';
    }
  }

  const tasks = [];
  for (const label of SCALE_NOTES) {
    tasks.push(loadOne(getAnswerFile(label), 'answer_' + label));
    tasks.push(loadOne(getQuestionFile(label), 'question_' + label));
  }
  const BATCH = 6;
  for (let i = 0; i < tasks.length; i += BATCH) {
    await Promise.all(tasks.slice(i, i + BATCH));
  }
  console.log('Audio loaded:', Object.keys(audioBuffers).length, '/', _loadTotal);
  if (loadFails.length) {
    console.warn('Missing audio (' + loadFails.length + '):', loadFails.join(','));
    window._loadFails = loadFails;
  }
}

let activeSources = [];
function playSound(label, type = 'answer', delay = 0) {
  const key = type + '_' + label;
  if (!audioCtx || !audioBuffers[key]) {
    console.warn('No audio:', key);
    return;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = audioBuffers[key];
  const gain = audioCtx.createGain();
  gain.gain.value = 0.7;
  src.connect(gain).connect(audioCtx.destination);
  src.start(audioCtx.currentTime + delay);
  activeSources.push(src);
  src.onended = () => {
    const i = activeSources.indexOf(src);
    if (i >= 0) activeSources.splice(i, 1);
  };
}

function stopAllSounds() {
  activeSources.forEach(s => { try { s.stop(); } catch (e) {} });
  activeSources = [];
}

function noteDuration(label, type = 'question') {
  const buf = audioBuffers[type + '_' + label];
  return (buf && buf.duration > 0) ? buf.duration : 1.5;
}

function scheduleQuestionSequence(sequence) {
  let t = 0;
  sequence.forEach((note, i) => {
    const dur = noteDuration(note, 'question');
    playSound(note, 'question', t);
    playTimers.push(setTimeout(() => { highlightedNotes.add(note); renderNoteStates(); }, t * 1000));
    if (i < sequence.length - 1) {
      playTimers.push(setTimeout(() => { highlightedNotes.delete(note); renderNoteStates(); }, (t + dur) * 1000));
    }
    t += dur + NOTE_GAP;
  });
  return t - NOTE_GAP;
}

// ============================
// 游戏逻辑
// ============================
function generateSequence(count) {
  const seq = [];
  let prev = null;
  for (let i = 0; i < count; i++) {
    let note;
    do {
      note = SCALE_NOTES[Math.floor(Math.random() * SCALE_NOTES.length)];
    } while (note === prev);
    seq.push(note);
    prev = note;
  }
  return seq;
}

function playSequence(sequence) {
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  stopAllSounds();
  ensureAudioRunning();

  gameState = 'listening';
  updateStateBar('🎧 听音中...', 'listen');
  updateInputUI();

  playTimers.push(setTimeout(() => {
    if (audioCtx && audioCtx.state !== 'running') {
      updateStateBar('🔇 声音被浏览器挂起，点一下屏幕任意位置即可开启', 'wrong');
    }
  }, 500));
  highlightedNotes.clear();
  renderNoteStates();

  const lastEnd = scheduleQuestionSequence(sequence);

  playTimers.push(setTimeout(() => {
    highlightedNotes.clear();
    renderNoteStates();
    startPlayerTurn(sequence);
  }, (lastEnd + 0.3) * 1000));
}

function startPlayerTurn(sequence) {
  gameState = 'repeating';
  playerSequence = [];
  updateStateBar('👆 按顺序点击唱名方块', 'repeat');
  renderClickDots(sequence.length);
  document.getElementById('btnReplay').disabled = false;

  sequence.forEach(n => highlightedNotes.add(n));
  renderNoteStates();
  updateInputUI();
}

function renderClickDots(total, results) {
  const el = document.getElementById('clickSeq');
  el.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    const picked = playerSequence[i];
    if (results) {
      dot.className = 'click-dot ' + (results[i] ? 'filled' : 'wrong');
      dot.textContent = picked ? solfege(picked) : (i + 1);
    } else if (picked) {
      dot.className = 'click-dot filled';
      dot.textContent = solfege(picked);
    } else {
      dot.className = 'click-dot pending';
      dot.textContent = i + 1;
    }
    el.appendChild(dot);
  }
}

function updateInputUI() {
  const total = currentSequence.length || difficulty;
  const n = playerSequence.length;
  const full = total > 0 && n === total;
  const canInput = gameState === 'repeating';
  const sub = document.getElementById('btnSubmit');
  sub.textContent = full ? '✅ 交卷' : `✅ 提交 ${n}/${total}`;
  sub.disabled = !full || !canInput;
  sub.classList.toggle('ready', full && canInput);
  document.getElementById('btnUndo').disabled = n === 0 || !canInput;
  document.getElementById('btnClear').disabled = n === 0 || !canInput;
  document.getElementById('btnMyAnswer').disabled = n === 0 || !canInput;
  document.getElementById('btnReplay').disabled = !canInput;
}

function onNotePick(note) {
  if (gameState !== 'repeating') return;
  if (playerSequence.length >= currentSequence.length) return;
  ensureAudioRunning();
  playerSequence.push(note);
  flashTappedNote(note);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  playSound(note);
  renderClickDots(currentSequence.length);
  updateInputUI();
}

function undoPick() {
  if (gameState !== 'repeating' || playerSequence.length === 0) return;
  playerSequence.pop();
  renderClickDots(currentSequence.length);
  updateInputUI();
}

function clearPicks() {
  if (gameState !== 'repeating' || playerSequence.length === 0) return;
  playerSequence = [];
  renderClickDots(currentSequence.length);
  updateInputUI();
}

function replayMyAnswer() {
  if (gameState !== 'repeating' || playerSequence.length === 0) return;
  ensureAudioRunning();
  let t = 0;
  playerSequence.forEach(note => {
    playSound(note, 'answer', t);
    t += noteDuration(note, 'answer') + NOTE_GAP;
  });
}

function submitAnswer() {
  if (gameState !== 'repeating' || playerSequence.length !== currentSequence.length) return;
  const total = currentSequence.length;
  const results = [];
  let allCorrect = true;
  for (let i = 0; i < total; i++) {
    const ok = playerSequence[i] === currentSequence[i];
    results.push(ok);
    if (!ok) allCorrect = false;
  }
  renderClickDots(total, results);
  onRoundComplete(allCorrect);
}

function onRoundComplete(success) {
  gameState = 'judging';
  updateInputUI();

  if (success) {
    score += 100 * (1 + combo * 0.1);
    combo++;
    totalRounds++;
    showJudgment('正确!', 'correct');
    updateStateBar('✅ 全对！', 'correct');
  } else {
    combo = 0;
    totalRounds++;
    showJudgment('错误!', 'wrong');
    updateStateBar('❌ 有音不对', 'wrong');
    // 逐个闪出正确答案的方块
    currentSequence.forEach((n, i) => setTimeout(() => revealAnswer(n), 400 + i * 220));
    const correctSeq = currentSequence.map(n => solfege(n)).join(' → ');
    setTimeout(() => {
      updateStateBar(`正确答案: ${correctSeq}`, 'wrong');
    }, 1800);
  }

  updateHUD();

  setTimeout(() => {
    document.getElementById('btnNext').style.display = 'inline-block';
  }, 1200);
}

function replayQuestion() {
  if (gameState !== 'repeating') return;
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  stopAllSounds();
  ensureAudioRunning();
  gameState = 'listening';
  updateStateBar('🎧 重听题目...', 'listen');
  updateInputUI();
  highlightedNotes.clear();
  renderNoteStates();

  const lastEnd = scheduleQuestionSequence(currentSequence);
  playTimers.push(setTimeout(() => {
    gameState = 'repeating';
    currentSequence.forEach(n => highlightedNotes.add(n));
    renderNoteStates();
    updateStateBar('👆 按顺序点击唱名方块，按完点交卷', 'repeat');
    updateInputUI();
  }, (lastEnd + 0.3) * 1000));
}

function nextRound() {
  document.getElementById('btnNext').style.display = 'none';
  highlightedNotes.clear();
  revealNotes.clear();
  renderNoteStates();
  newRound();
}

function newRound() {
  currentSequence = generateSequence(difficulty);
  document.getElementById('roundInfo').textContent = `第 ${totalRounds + 1} 轮 · 难度：${difficulty}音`;
  playerSequence = [];
  renderClickDots(difficulty);
  updateInputUI();

  setTimeout(() => {
    playSequence(currentSequence);
  }, 500);
}

// ============================
// UI
// ============================
function showJudgment(text, type) {
  const el = document.getElementById('judgeText');
  el.textContent = text;
  el.className = 'judgment-text show ' + type;
  setTimeout(() => { el.className = 'judgment-text'; }, 600);
}

function updateStateBar(text, cls) {
  const el = document.getElementById('stateBar');
  el.textContent = text;
  el.className = 'state-bar ' + cls;
}

function updateHUD() {
  document.getElementById('score').textContent = Math.floor(score);
  document.getElementById('combo').textContent = combo;
  document.getElementById('totalRounds').textContent = totalRounds;
}

function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.level) === level);
  });
}

// ============================
// 控制
// ============================
async function startGame() {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('loader').style.display = 'flex';

  if (!audioCtx) {
    await loadAudio();
  }
  ensureAudioRunning();
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  const loadedCount = Object.keys(audioBuffers).length;
  if (!audioCtx || loadedCount === 0) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('startOverlay').style.display = 'flex';
    alert('音频加载失败（0/' + _loadTotal + '）。请检查网络后刷新页面重试；若持续失败请截图告诉我。');
    return;
  }

  document.getElementById('loader').style.display = 'none';
  score = 0; combo = 0; totalRounds = 0;
  renderNoteStates();
  updateHUD();
  newRound();
}

renderNoteStates();
</script>
