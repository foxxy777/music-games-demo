<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V10 - 听音辨序 (手机版)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a2e;--bg2:#16213e;--border:#0f3460;--accent:#e94560;--accent2:#52b788;--gold:#ffd700;--text:#eee;--dim:#888}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);user-select:none}

.start-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .3s}
.start-overlay.hide{opacity:0;pointer-events:none}
.start-overlay h1{color:var(--accent);font-size:28px;margin-bottom:8px}
.start-overlay p{color:var(--dim);margin-bottom:24px;text-align:center;max-width:90%;line-height:1.6;font-size:14px;padding:0 16px}
.difficulty{display:flex;gap:10px;margin-bottom:20px}
.diff-btn{background:var(--bg2);color:var(--text);border:2px solid var(--border);padding:8px 18px;border-radius:10px;font-size:14px;cursor:pointer}
.diff-btn.active{border-color:var(--accent);background:rgba(233,69,96,0.2);color:var(--accent)}
.start-btn{background:var(--accent);color:#fff;border:none;padding:14px 48px;font-size:22px;border-radius:50px;cursor:pointer}
.start-btn:active{transform:scale(0.95)}

.game-container{display:flex;flex-direction:column;height:100vh}
@media(min-width:700px){.game-container{flex-direction:row}}
.staff-panel{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.staff-header{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.staff-header h3{color:var(--accent);font-size:16px}
.round-info{color:var(--dim);font-size:12px;margin-left:auto}
#staffCanvas{flex:1;cursor:pointer;display:block;min-height:0;touch-action:none}

.char-panel{background:var(--bg2);border-top:2px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center}
@media(min-width:700px){.char-panel{flex-direction:column;border-top:none;border-left:2px solid var(--border);width:220px;padding:16px;justify-content:flex-start}}
.char-panel img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
@media(min-width:700px){.char-panel img{width:100%;max-width:180px;height:auto;border-radius:12px;border:2px solid var(--border);margin-bottom:16px}}
.char-info h4{color:var(--accent);font-size:13px}
.hud{display:flex;gap:8px}
@media(min-width:700px){.hud{flex-direction:column;width:100%}}
.hud-row{padding:4px 10px;background:rgba(0,0,0,0.3);border-radius:6px;font-size:13px;white-space:nowrap}
@media(min-width:700px){.hud-row{padding:6px 12px;margin-bottom:4px;font-size:14px}}
.hud-row span{font-weight:bold;color:var(--gold)}
.state-bar{text-align:center;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;flex-shrink:0}
.state-bar.listen{background:rgba(233,69,96,0.2);color:var(--accent);border:1px solid var(--accent)}
.state-bar.repeat{background:rgba(82,183,136,0.2);color:var(--accent2);border:1px solid var(--accent2)}
.state-bar.correct{background:rgba(82,183,136,0.3);color:var(--accent2)}
.state-bar.wrong{background:rgba(233,69,96,0.3);color:var(--accent)}
.click-sequence{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:32px}
.click-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.click-dot.pending{background:rgba(255,255,255,0.1);border:2px dashed var(--dim)}
.click-dot.filled{background:var(--gold);color:#000}
.click-dot.wrong{background:var(--accent);color:#fff}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;flex-shrink:0}
.btn:active{transform:scale(0.95)}
.btn-replay{background:var(--border);color:var(--text)}
.btn-next{background:var(--accent2);color:#fff}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.judgment-text{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:42px;font-weight:bold;z-index:6;pointer-events:none;opacity:0}
.judgment-text.show{animation:judgePop 0.6s ease-out}
.judgment-text.correct{color:var(--accent2);text-shadow:0 0 20px var(--accent2)}
.judgment-text.wrong{color:var(--accent);text-shadow:0 0 20px var(--accent)}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <h1>🎧 听音辨序 V10</h1>
  <p>听一段旋律，然后按顺序点击五线谱上对应的音符位置<br>出题用的是视唱音频，答对会播放音效</p>
  <div class="difficulty">
    <button class="diff-btn active" data-level="3" onclick="setDifficulty(3)">3 音符</button>
    <button class="diff-btn" data-level="4" onclick="setDifficulty(4)">4 音符</button>
    <button class="diff-btn" data-level="5" onclick="setDifficulty(5)">5 音符</button>
  </div>
  <button class="start-btn" id="startBtn">▶ 开始</button>
</div>

<div class="game-container">
  <div class="staff-panel">
    <div class="staff-header">
      <h3>🎵 听音辨序</h3>
      <div class="round-info" id="roundInfo">第 1 轮 · 难度：3音</div>
    </div>
    <canvas id="staffCanvas"></canvas>
    <div class="judgment-text" id="judgeText"></div>
  </div>
  <div class="char-panel">
    <img src="assets/img/character.png" alt="角色">
    <div class="char-info"><h4>008</h4></div>
    <div class="state-bar listen" id="stateBar">🎵 准备听音</div>
    <div class="hud">
      <div class="hud-row">分: <span id="score">0</span></div>
      <div class="hud-row">连: <span id="combo">0</span></div>
      <div class="hud-row">次: <span id="totalRounds">0</span></div>
    </div>
    <div class="click-sequence" id="clickSeq"></div>
    <button class="btn btn-replay" id="btnReplay" disabled>🔊 再听一遍</button>
    <button class="btn btn-next" id="btnNext" style="display:none">▶ 下一轮</button>
  </div>
</div>

<script>
// 音符
const SCALE_NOTES = ['3G','3G#','3A','3A#','3B','4C','4C#','4D','4D#','4E','4F','4F#','4G','4G#','4A','4A#','4B','5C','5C#','5D','5D#','5E','5F','5F#','5G','5A'];
function qFile(l){return 'assets/audio/question_'+l+'.wav'}
function aFile(l){return 'assets/audio/'+l+'.wav'}

const NOTES_LAYOUT = [
  {label:'5A',idx:0},{label:'5G',idx:1},{label:'5F#',idx:2},{label:'5F',idx:3},
  {label:'5E',idx:4},{label:'5D#',idx:5},{label:'5D',idx:6},{label:'5C#',idx:7},
  {label:'5C',idx:8},{label:'4B',idx:9},{label:'4A#',idx:10},{label:'4A',idx:11},
  {label:'4G#',idx:12},{label:'4G',idx:13},{label:'4F#',idx:14},{label:'4F',idx:15},
  {label:'4E',idx:16},{label:'4D#',idx:17},{label:'4D',idx:18},{label:'4C#',idx:19},
  {label:'4C',idx:20},{label:'3B',idx:21},{label:'3A#',idx:22},{label:'3A',idx:23},
  {label:'3G#',idx:24},{label:'3G',idx:25},
];

const NOTE_INTERVAL = 600; // ms between notes

// State
let difficulty = 3;
let gameState = 'idle';
let score = 0, combo = 0, totalRounds = 0;
let currentSequence = [];
let playerSequence = [];
let highlightedNotes = new Set();
let playTimers = [];
var unlocked = false; // audio unlock flag

// ============================
// Audio: simple on-demand using Audio elements
// No preloading. No Web Audio API. Just new Audio().
// ============================
const audioCache = {};

function playFile(url) {
  let a;
  if (audioCache[url]) {
    a = audioCache[url];
    a.currentTime = 0;
  } else {
    a = new Audio(url);
    audioCache[url] = a;
  }
  a.play().catch(function(e){ console.warn('play fail', url, e); });
  return a;
}

function playNote(label, type) {
  var url = type === 'q' ? qFile(label) : aFile(label);
  playFile(url);
}

// ============================
// Canvas
// ============================
const canvas = document.getElementById('staffCanvas');
const ctx2d = canvas.getContext('2d');

function resizeCanvas() {
  var panel = canvas.parentElement;
  var dpr = window.devicePixelRatio || 1;
  var cw = panel.clientWidth;
  var ch = panel.clientHeight - 40;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawStaff();
}
window.addEventListener('resize', resizeCanvas);

function CW(){return canvas.parentElement.clientWidth}
function CH(){return canvas.parentElement.clientHeight - 40}

function noteToY(label) {
  var n = NOTES_LAYOUT.find(function(x){return x.label===label});
  if(!n) return CH()/2;
  var pad=50, h=CH()-pad*2;
  return pad+(n.idx/(NOTES_LAYOUT.length-1))*h;
}

function yToNote(y) {
  var best=NOTES_LAYOUT[0], minD=9999;
  for(var i=0;i<NOTES_LAYOUT.length;i++){
    var d=Math.abs(noteToY(NOTES_LAYOUT[i].label)-y);
    if(d<minD){minD=d;best=NOTES_LAYOUT[i]}
  }
  return best.label;
}

function drawStaff() {
  var w=CW(), h=CH();
  ctx2d.clearRect(0,0,w,h);
  
  var lines=['5E','5G','4B','4D','4F'];
  ctx2d.strokeStyle='rgba(255,255,255,0.25)';
  ctx2d.lineWidth=1.5;
  lines.forEach(function(ln){
    var y=noteToY(ln);
    ctx2d.beginPath();ctx2d.moveTo(0,y);ctx2d.lineTo(w,y);ctx2d.stroke();
  });
  
  ctx2d.fillStyle='rgba(233,69,96,0.6)';
  ctx2d.font='32px serif';
  ctx2d.fillText('\uD834\uDD1E',12,noteToY('4A')+8);
  
  NOTES_LAYOUT.forEach(function(n){
    var y=noteToY(n.label);
    var hl=highlightedNotes.has(n.label);
    
    ctx2d.strokeStyle='rgba(255,255,255,0.05)';
    ctx2d.lineWidth=1;
    ctx2d.beginPath();ctx2d.moveTo(40,y);ctx2d.lineTo(w-10,y);ctx2d.stroke();
    
    if(hl){
      var grad=ctx2d.createLinearGradient(40,y,w-10,y);
      grad.addColorStop(0,'rgba(255,215,0,0)');
      grad.addColorStop(0.5,'rgba(255,215,0,0.3)');
      grad.addColorStop(1,'rgba(255,215,0,0)');
      ctx2d.fillStyle=grad;
      ctx2d.fillRect(40,y-12,w-50,24);
      
      ctx2d.fillStyle='rgba(255,215,0,0.8)';
      ctx2d.beginPath();ctx2d.arc(w/2,y,16,0,Math.PI*2);ctx2d.fill();
      
      ctx2d.fillStyle='#000';
      ctx2d.font='bold 11px sans-serif';
      ctx2d.textAlign='center';
      ctx2d.fillText(n.label,w/2,y+4);
      ctx2d.textAlign='left';
    }
    
    ctx2d.fillStyle=hl?'rgba(255,215,0,0.9)':'rgba(136,136,136,0.4)';
    ctx2d.font=hl?'bold 12px sans-serif':'10px sans-serif';
    ctx2d.fillText(n.label,42,y+4);
  });
}

// ============================
// Game Logic
// ============================
function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll('.diff-btn').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.level)===level);
  });
}

function generateSequence(count) {
  var seq=[], prev=null;
  for(var i=0;i<count;i++){
    var note;
    do{note=SCALE_NOTES[Math.floor(Math.random()*SCALE_NOTES.length)]}
    while(note===prev);
    seq.push(note); prev=note;
  }
  return seq;
}

function newRound() {
  currentSequence = generateSequence(difficulty);
  playerSequence = [];
  totalRounds++;
  document.getElementById('roundInfo').textContent = '第 '+totalRounds+' 轮 · 难度：'+difficulty+'音';
  updateHUD();
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnReplay').disabled=true;
  setTimeout(function(){playSequence(currentSequence)}, 500);
}

function playSequence(sequence) {
  playTimers.forEach(function(t){clearTimeout(t)});
  playTimers = [];
  gameState = 'listening';
  updateStateBar('🎧 听旋律...', 'listen');
  highlightedNotes.clear();
  drawStaff();
  
  sequence.forEach(function(note, i) {
    var delay = i * NOTE_INTERVAL;
    playTimers.push(setTimeout(function(){playNote(note,'q')}, delay));
    playTimers.push(setTimeout(function(){highlightedNotes.add(note);drawStaff()}, delay));
    if(i < sequence.length-1) {
      playTimers.push(setTimeout(function(){highlightedNotes.delete(note);drawStaff()}, delay + 500));
    }
  });
  
  var totalTime = (sequence.length-1)*NOTE_INTERVAL + 800;
  playTimers.push(setTimeout(function(){
    highlightedNotes.clear();
    drawStaff();
    startPlayerTurn();
  }, totalTime));
}

function startPlayerTurn() {
  gameState = 'repeating';
  playerSequence = [];
  updateStateBar('👆 按顺序点击音符', 'repeat');
  renderClickDots(currentSequence.length);
  document.getElementById('btnReplay').disabled = false;
  currentSequence.forEach(function(n){highlightedNotes.add(n)});
  drawStaff();
}

function replaySequence() {
  if(gameState !== 'repeating') return;
  playSequence(currentSequence);
}

function renderClickDots(total) {
  var el = document.getElementById('clickSeq');
  el.innerHTML = '';
  for(var i=0;i<total;i++){
    var d=document.createElement('div');
    d.className='click-dot pending';
    el.appendChild(d);
  }
}

function onStaffClick(y) {
  if(gameState !== 'repeating') return;
  var note = yToNote(y);
  var idx = playerSequence.length;
  var expected = currentSequence[idx];
  
  playerSequence.push(note);
  playNote(note, 'a'); // answer sound
  
  var dots = document.querySelectorAll('.click-dot');
  if(note === expected) {
    dots[idx].className = 'click-dot filled';
    dots[idx].textContent = note;
  } else {
    dots[idx].className = 'click-dot wrong';
    dots[idx].textContent = '✗';
  }
  
  if(playerSequence.length >= currentSequence.length) {
    setTimeout(judgeRound, 400);
  }
}

function judgeRound() {
  var correct = playerSequence.every(function(n,i){return n===currentSequence[i]});
  if(correct) {
    score += difficulty*10 + combo*5;
    combo++;
    showJudge('PERFECT!', 'correct');
    updateStateBar('✅ 完美！', 'correct');
  } else {
    combo = 0;
    showJudge('MISS', 'wrong');
    updateStateBar('❌ 答案: '+currentSequence.join(' '), 'wrong');
  }
  updateHUD();
  document.getElementById('btnReplay').disabled = true;
  document.getElementById('btnNext').style.display = '';
  gameState = 'judging';
}

function showJudge(text, cls) {
  var el = document.getElementById('judgeText');
  el.textContent = text;
  el.className = 'judgment-text show ' + cls;
  setTimeout(function(){el.className='judgment-text'}, 600);
}

function nextRound(){newRound()}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  document.getElementById('totalRounds').textContent = totalRounds;
}

function updateStateBar(text, cls) {
  var el = document.getElementById('stateBar');
  el.textContent = text;
  el.className = 'state-bar ' + cls;
}

// ============================
// Start: unlock audio on user gesture, then play immediately
// ============================
// Preload one real audio to use as unlock sound
var unlockAudio = new Audio('assets/audio/question_4C.wav');
unlockAudio.load();

document.getElementById('startBtn').addEventListener('click', function() {
  // Hide overlay
  document.getElementById('startOverlay').classList.add('hide');

  // CRITICAL: Play a REAL audio file directly in the click handler to unlock mobile audio.
  // HarmonyOS/Huawei browsers require actual audio playback in the gesture, not data: URLs.
  unlockAudio.volume = 0.01;
  var playPromise = unlockAudio.play();
  if (playPromise) {
    playPromise.then(function() {
      unlocked = true;
      console.log('Audio unlocked with real file');
      unlockAudio.volume = 1.0;
      // Start game after unlock confirmed
      resizeCanvas();
      score = 0; combo = 0; totalRounds = 0;
      updateHUD();
      newRound();
    }).catch(function(e) {
      console.warn('Unlock play rejected:', e);
      // Start anyway, audio might work on subsequent calls
      resizeCanvas();
      score = 0; combo = 0; totalRounds = 0;
      updateHUD();
      newRound();
    });
  } else {
    // Old browser, just start
    resizeCanvas();
    score = 0; combo = 0; totalRounds = 0;
    updateHUD();
    newRound();
  }
});

// Pointer events - click + touch
function handlePointer(e) {
  e.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var cy;
  if(e.touches && e.touches.length > 0) cy = e.touches[0].clientY;
  else cy = e.clientY;
  onStaffClick(cy - rect.top);
}
canvas.addEventListener('click', handlePointer);
canvas.addEventListener('touchstart', handlePointer, {passive:false});

// Init
resizeCanvas();
drawStaff();
</script>
</body>
</html>
