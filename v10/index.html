<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V10 - 听音辨序 (手机优化版)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a2e; --bg2:#16213e; --border:#0f3460;
  --accent:#e94560; --accent2:#52b788; --gold:#ffd700;
  --text:#eee; --dim:#888;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);user-select:none}

/* ===== 加载页 ===== */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
.loader.hide{opacity:0;pointer-events:none}
.loader .spin{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.loader p{margin-top:16px;color:var(--dim);font-size:14px}
.loader .pct{margin-top:8px;color:var(--accent);font-size:20px;font-weight:bold}

/* ===== 开始页 ===== */
.start-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .3s}
.start-overlay.hide{opacity:0;pointer-events:none}
.start-overlay h1{color:var(--accent);font-size:28px;margin-bottom:8px}
.start-overlay p{color:var(--dim);margin-bottom:24px;text-align:center;max-width:90%;line-height:1.6;font-size:14px;padding:0 16px}
.difficulty{display:flex;gap:10px;margin-bottom:20px}
.diff-btn{background:var(--bg2);color:var(--text);border:2px solid var(--border);padding:8px 18px;border-radius:10px;font-size:14px;cursor:pointer;transition:all .2s}
.diff-btn.active{border-color:var(--accent);background:rgba(233,69,96,0.2);color:var(--accent)}
.start-btn{background:var(--accent);color:#fff;border:none;padding:14px 48px;font-size:22px;border-radius:50px;cursor:pointer;transition:all .2s}
.start-btn:active{transform:scale(0.95)}

/* ===== 游戏布局 ===== */
.game-container{display:flex;flex-direction:column;height:100vh}
@media(min-width:700px){.game-container{flex-direction:row}}

.staff-panel{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.staff-header{padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.staff-header h3{color:var(--accent);font-size:16px}
.round-info{color:var(--dim);font-size:12px;margin-left:auto}
#staffCanvas{flex:1;cursor:pointer;display:block;min-height:0}

/* 侧/底部面板 */
.char-panel{background:var(--bg2);border-top:2px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:center}
@media(min-width:700px){.char-panel{flex-direction:column;border-top:none;border-left:2px solid var(--border);width:220px;padding:16px;justify-content:flex-start}}

.char-panel img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
@media(min-width:700px){.char-panel img{width:100%;max-width:180px;height:auto;border-radius:12px;border:2px solid var(--border);margin-bottom:16px}}

.char-info{display:flex;flex-direction:column;align-items:center;gap:2px}
.char-info h4{color:var(--accent);font-size:13px}
@media(min-width:700px){.char-info h4{font-size:15px}}

.hud{display:flex;gap:8px}
@media(min-width:700px){.hud{flex-direction:column;width:100%}}
.hud-row{padding:4px 10px;background:rgba(0,0,0,0.3);border-radius:6px;font-size:13px;white-space:nowrap}
@media(min-width:700px){.hud-row{padding:6px 12px;margin-bottom:4px;font-size:14px}}
.hud-row span{font-weight:bold;color:var(--gold)}

.state-bar{text-align:center;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;flex-shrink:0}
.state-bar.listen{background:rgba(233,69,96,0.2);color:var(--accent);border:1px solid var(--accent)}
.state-bar.repeat{background:rgba(82,183,136,0.2);color:var(--accent2);border:1px solid var(--accent2)}
.state-bar.correct{background:rgba(82,183,136,0.3);color:var(--accent2)}
.state-bar.wrong{background:rgba(233,69,96,0.3);color:var(--accent)}

.click-sequence{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:32px}
.click-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.click-dot.pending{background:rgba(255,255,255,0.1);border:2px dashed var(--dim)}
.click-dot.filled{background:var(--gold);color:#000}
.click-dot.wrong{background:var(--accent);color:#fff}

.btn{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn:active{transform:scale(0.95)}
.btn-play{background:var(--accent);color:#fff}
.btn-replay{background:var(--border);color:var(--text)}
.btn-next{background:var(--accent2);color:#fff}
.btn:disabled{opacity:0.4;cursor:not-allowed}

.judgment-text{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:42px;font-weight:bold;z-index:6;pointer-events:none;opacity:0}
.judgment-text.show{animation:judgePop 0.6s ease-out}
.judgment-text.correct{color:var(--accent2);text-shadow:0 0 20px var(--accent2)}
.judgment-text.wrong{color:var(--accent);text-shadow:0 0 20px var(--accent)}
@keyframes judgePop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>

<!-- 加载页 -->
<div class="loader" id="loader">
  <div class="spin"></div>
  <p>正在加载音频素材...</p>
  <div class="pct" id="loadPct">0%</div>
</div>

<!-- 开始页 -->
<div class="start-overlay hide" id="startOverlay">
  <h1>🎧 听音辨序 V10</h1>
  <p>听一段旋律，然后按顺序点击五线谱上对应的音符位置<br>出题用的是视唱音频，答对会播放音效</p>
  <div class="difficulty">
    <button class="diff-btn active" data-level="3" onclick="setDifficulty(3)">3 音符</button>
    <button class="diff-btn" data-level="4" onclick="setDifficulty(4)">4 音符</button>
    <button class="diff-btn" data-level="5" onclick="setDifficulty(5)">5 音符</button>
  </div>
  <button class="start-btn" id="startBtn">▶ 开始</button>
</div>

<!-- 游戏 -->
<div class="game-container">
  <div class="staff-panel">
    <div class="staff-header">
      <h3>🎵 听音辨序</h3>
      <div class="round-info" id="roundInfo">第 1 轮 · 难度：3音</div>
    </div>
    <canvas id="staffCanvas"></canvas>
    <div class="judgment-text" id="judgeText"></div>
  </div>
  <div class="char-panel">
    <img src="assets/img/character.png" alt="角色">
    <div class="char-info"><h4>008</h4></div>
    <div class="state-bar listen" id="stateBar">🎵 准备听音</div>
    <div class="hud">
      <div class="hud-row">分: <span id="score">0</span></div>
      <div class="hud-row">连: <span id="combo">0</span></div>
      <div class="hud-row">次: <span id="totalRounds">0</span></div>
    </div>
    <div class="click-sequence" id="clickSeq"></div>
    <button class="btn btn-replay" id="btnReplay" disabled>🔊 再听一遍</button>
    <button class="btn btn-next" id="btnNext" style="display:none">▶ 下一轮</button>
  </div>
</div>

<script>
// ============================
// 音符定义
// ============================
const SCALE_NOTES = [
  '3G','3G#','3A','3A#','3B',
  '4C','4C#','4D','4D#','4E','4F','4F#','4G','4G#','4A','4A#','4B',
  '5C','5C#','5D','5D#','5E','5F','5F#','5G','5A'
];

function getQuestionFile(label) { return `assets/audio/question_${label}.wav`; }
function getAnswerFile(label) { return `assets/audio/${label}.wav`; }

const NOTES_LAYOUT = [
  {label:'5A',idx:0},{label:'5G',idx:1},{label:'5F#',idx:2},{label:'5F',idx:3},
  {label:'5E',idx:4},{label:'5D#',idx:5},{label:'5D',idx:6},{label:'5C#',idx:7},
  {label:'5C',idx:8},{label:'4B',idx:9},{label:'4A#',idx:10},{label:'4A',idx:11},
  {label:'4G#',idx:12},{label:'4G',idx:13},{label:'4F#',idx:14},{label:'4F',idx:15},
  {label:'4E',idx:16},{label:'4D#',idx:17},{label:'4D',idx:18},{label:'4C#',idx:19},
  {label:'4C',idx:20},{label:'3B',idx:21},{label:'3A#',idx:22},{label:'3A',idx:23},
  {label:'3G#',idx:24},{label:'3G',idx:25},
];

const NOTE_INTERVAL = 0.6;
const HIGHLIGHT_DURATION = 0.5;

// ============================
// 状态
// ============================
let difficulty = 3;
let gameState = 'idle';
let score = 0, combo = 0, totalRounds = 0;
let currentSequence = [];
let playerSequence = [];
let highlightedNotes = new Set();
let audioBuffers = {};
let audioCtx = null;
let playTimers = [];
let loadedCount = 0;
let totalToLoad = 0;

// ============================
// Canvas
// ============================
const canvas = document.getElementById('staffCanvas');
const ctx2d = canvas.getContext('2d');

function resizeCanvas() {
  const panel = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = panel.clientWidth * dpr;
  canvas.height = (panel.clientHeight - 40) * dpr;
  canvas.style.width = panel.clientWidth + 'px';
  canvas.style.height = (panel.clientHeight - 40) + 'px';
  ctx2d.scale(dpr, dpr);
  drawStaff();
}
window.addEventListener('resize', resizeCanvas);

function getCW() { return canvas.width / (window.devicePixelRatio || 1); }
function getCH() { return canvas.height / (window.devicePixelRatio || 1); }

function noteToY(label) {
  const n = NOTES_LAYOUT.find(x => x.label === label);
  if (!n) return getCH() / 2;
  const padding = 50;
  const usableH = getCH() - padding * 2;
  return padding + (n.idx / (NOTES_LAYOUT.length - 1)) * usableH;
}

function yToNote(y) {
  let closest = NOTES_LAYOUT[0], minDist = Infinity;
  for (const n of NOTES_LAYOUT) {
    const dist = Math.abs(noteToY(n.label) - y);
    if (dist < minDist) { minDist = dist; closest = n; }
  }
  return closest.label;
}

function drawStaff() {
  const w = getCW(), h = getCH();
  ctx2d.clearRect(0, 0, w, h);
  
  // 五线谱
  const lineNotes = ['5E','5G','4B','4D','4F'];
  ctx2d.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx2d.lineWidth = 1.5;
  lineNotes.forEach(ln => {
    const y = noteToY(ln);
    ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(w, y); ctx2d.stroke();
  });
  
  // 高音谱号
  ctx2d.fillStyle = 'rgba(233,69,96,0.6)';
  ctx2d.font = '32px serif';
  ctx2d.fillText('𝄞', 12, noteToY('4A') + 8);
  
  NOTES_LAYOUT.forEach(n => {
    const y = noteToY(n.label);
    const isHl = highlightedNotes.has(n.label);
    
    // 辅助线
    ctx2d.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx2d.lineWidth = 1;
    ctx2d.beginPath(); ctx2d.moveTo(40, y); ctx2d.lineTo(w - 10, y); ctx2d.stroke();
    
    // 高亮
    if (isHl) {
      const grad = ctx2d.createLinearGradient(40, y, w - 10, y);
      grad.addColorStop(0, 'rgba(255,215,0,0)');
      grad.addColorStop(0.5, 'rgba(255,215,0,0.3)');
      grad.addColorStop(1, 'rgba(255,215,0,0)');
      ctx2d.fillStyle = grad;
      ctx2d.fillRect(40, y - 12, w - 50, 24);
      
      ctx2d.fillStyle = 'rgba(255,215,0,0.8)';
      ctx2d.beginPath(); ctx2d.arc(w / 2, y, 16, 0, Math.PI * 2); ctx2d.fill();
      
      ctx2d.fillStyle = '#000';
      ctx2d.font = 'bold 11px Segoe UI'; ctx2d.textAlign = 'center';
      ctx2d.fillText(n.label, w / 2, y + 4); ctx2d.textAlign = 'left';
    }
    
    // 标签
    ctx2d.fillStyle = isHl ? 'rgba(255,215,0,0.9)' : 'rgba(136,136,136,0.4)';
    ctx2d.font = isHl ? 'bold 12px Segoe UI' : '10px Segoe UI';
    ctx2d.fillText(n.label, 42, y + 4);
  });
}

// ============================
// 音频 - 手机专用初始化
// ============================\n\nfunction initAudioContext() {
  if (audioCtx) return true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return true;
  } catch(e) {
    console.error('Cannot create AudioContext:', e);
    return false;
  }
}

async function loadAllAudio() {
  totalToLoad = SCALE_NOTES.length * 2;
  loadedCount = 0;

  const loadOne = async (url, key) => {
    try {
      const resp = await fetch(url);
      if (!resp.ok) return;
      const buf = await resp.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(buf);
      audioBuffers[key] = decoded;
    } catch(e) {
      console.warn('Load fail:', key);
    } finally {
      loadedCount++;
      updateLoadPct();
    }
  };

  const tasks = [];
  for (const label of SCALE_NOTES) {
    tasks.push(() => loadOne(getAnswerFile(label), 'answer_' + label));
    tasks.push(() => loadOne(getQuestionFile(label), 'question_' + label));
  }

  // Process in batches of 6 for mobile
  const BATCH = 6;
  for (let i = 0; i < tasks.length; i += BATCH) {
    const batch = tasks.slice(i, i + BATCH).map(fn => fn());
    await Promise.all(batch);
  }

  console.log('Audio loaded:', Object.keys(audioBuffers).length, '/', totalToLoad);
}

function updateLoadPct() {
  const pct = Math.round((loadedCount / totalToLoad) * 100);
  document.getElementById('loadPct').textContent = pct + '%';
}

function playSound(label, type = 'answer', delay = 0) {
  const key = type + '_' + label;
  if (!audioCtx) { console.warn('No audioCtx'); return; }
  if (!audioBuffers[key]) { console.warn('No buffer:', key); return; }
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuffers[key];
    const gain = audioCtx.createGain();
    gain.gain.value = 0.8;
    src.connect(gain).connect(audioCtx.destination);
    src.start(audioCtx.currentTime + delay);
  } catch(e) { console.error('playSound error:', e); }
}

// ============================
// 游戏逻辑
// ============================
function setDifficulty(level) {
  difficulty = level;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.level) === level);
  });
}

function generateSequence(count) {
  const seq = [];
  let prev = null;
  for (let i = 0; i < count; i++) {
    let note;
    do {
      note = SCALE_NOTES[Math.floor(Math.random() * SCALE_NOTES.length)];
    } while (note === prev);
    seq.push(note);
    prev = note;
  }
  return seq;
}

function newRound() {
  currentSequence = generateSequence(difficulty);
  playerSequence = [];
  totalRounds++;
  document.getElementById('roundInfo').textContent = `第 ${totalRounds} 轮 · 难度：${difficulty}音`;
  updateHUD();
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('btnReplay').disabled = true;
  setTimeout(() => playSequence(currentSequence), 500);
}

function playSequence(sequence) {
  playTimers.forEach(t => clearTimeout(t));
  playTimers = [];
  gameState = 'listening';
  updateStateBar('🎧 听旋律...', 'listen');
  highlightedNotes.clear();
  drawStaff();
  
  sequence.forEach((note, i) => {
    const delay = i * NOTE_INTERVAL * 1000;
    playTimers.push(setTimeout(() => playSound(note, 'question'), delay));
    playTimers.push(setTimeout(() => { highlightedNotes.add(note); drawStaff(); }, delay));
    if (i < sequence.length - 1) {
      playTimers.push(setTimeout(() => { highlightedNotes.delete(note); drawStaff(); }, delay + HIGHLIGHT_DURATION * 1000));
    }
  });
  
  const totalTime = (sequence.length - 1) * NOTE_INTERVAL + HIGHLIGHT_DURATION + 0.3;
  playTimers.push(setTimeout(() => {
    highlightedNotes.clear(); drawStaff();
    startPlayerTurn();
  }, totalTime * 1000));
}

function startPlayerTurn() {
  gameState = 'repeating';
  playerSequence = [];
  updateStateBar('👆 按顺序点击音符', 'repeat');
  renderClickDots(currentSequence.length);
  document.getElementById('btnReplay').disabled = false;
  // 显示所有曾高亮的音符（轻量提示）
  currentSequence.forEach(n => highlightedNotes.add(n));
  drawStaff();
}

function replaySequence() {
  if (gameState !== 'repeating') return;
  playSequence(currentSequence);
}

function renderClickDots(total) {
  const el = document.getElementById('clickSeq');
  el.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const dot = document.createElement('div');
    dot.className = 'click-dot pending';
    el.appendChild(dot);
  }
}

function onStaffClick(y) {
  if (gameState !== 'repeating') return;
  const note = yToNote(y);
  const idx = playerSequence.length;
  const expected = currentSequence[idx];
  
  playerSequence.push(note);
  playSound(note, 'answer');
  
  const dots = document.querySelectorAll('.click-dot');
  if (note === expected) {
    dots[idx].className = 'click-dot filled';
    dots[idx].textContent = note;
  } else {
    dots[idx].className = 'click-dot wrong';
    dots[idx].textContent = '✗';
  }
  
  if (playerSequence.length >= currentSequence.length) {
    setTimeout(() => judgeRound(), 400);
  }
}

function judgeRound() {
  const correct = playerSequence.every((n, i) => n === currentSequence[i]);
  if (correct) {
    score += difficulty * 10 + combo * 5;
    combo++;
    showJudge('PERFECT!', 'correct');
    updateStateBar('✅ 完美！', 'correct');
  } else {
    combo = 0;
    showJudge('MISS', 'wrong');
    updateStateBar(`❌ 答案: ${currentSequence.join(' ')}`, 'wrong');
  }
  updateHUD();
  document.getElementById('btnReplay').disabled = true;
  document.getElementById('btnNext').style.display = '';
  gameState = 'judging';
}

function showJudge(text, cls) {
  const el = document.getElementById('judgeText');
  el.textContent = text;
  el.className = 'judgment-text show ' + cls;
  setTimeout(() => el.className = 'judgment-text', 600);
}

function nextRound() { newRound(); }

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  document.getElementById('totalRounds').textContent = totalRounds;
}

function updateStateBar(text, cls) {
  const el = document.getElementById('stateBar');
  el.textContent = text;
  el.className = 'state-bar ' + cls;
}

// ============================
// 启动流程（手机兼容）
// ============================

// Phase 1: 点击开始按钮 → 同步创建 AudioContext + 显示加载页
document.getElementById('startBtn').addEventListener('click', async function() {
  // 同步创建 AudioContext（必须在用户手势内）
  if (!initAudioContext()) {
    alert('无法初始化音频，请尝试刷新页面');
    return;
  }
  if (audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  
  // 隐藏开始页，显示加载页
  document.getElementById('startOverlay').classList.add('hide');
  document.getElementById('loader').classList.remove('hide');
  
  // 加载所有音频
  // Load with 15s timeout safety
  const loadPromise = loadAllAudio();
  const timeoutPromise = new Promise(resolve => setTimeout(resolve, 15000));
  await Promise.race([loadPromise, timeoutPromise]);
  
  // 隐藏加载页，开始游戏
  setTimeout(() => {
    document.getElementById('loader').classList.add('hide');
    resizeCanvas();
    score = 0; combo = 0; totalRounds = 0;
    updateHUD();
    newRound();
  }, 300);
});

// 事件监听 - 同时支持 click 和 touch
function handlePointer(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  let clientY;
  if (e.touches && e.touches.length > 0) {
    clientY = e.touches[0].clientY;
  } else {
    clientY = e.clientY;
  }
  const y = clientY - rect.top;
  onStaffClick(y);
}

canvas.addEventListener('click', handlePointer);
canvas.addEventListener('touchstart', handlePointer, {passive: false});

// 初始化画布
resizeCanvas();
drawStaff();
</script>

</body>
</html>
