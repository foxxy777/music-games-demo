<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频试听</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:sans-serif;padding:16px;max-width:700px;margin:0 auto}
h1{color:#e94560;font-size:20px;margin-bottom:8px}
h2{color:#52b788;font-size:16px;margin:20px 0 8px}
.item{display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #16213e}
.item button{background:#e94560;color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
.item button:active{transform:scale(0.9)}
.item .name{font-size:14px;flex:1}
.item .size{font-size:12px;color:#888}
.note{color:#888;font-size:13px;margin-bottom:16px;line-height:1.5}
</style>
</head>
<body>
<h1>🎵 音频试听</h1>
<p class="note">点 ▶ 播放。出题音频是B站视唱教程的切片，答题音频是变频人声。</p>

<h2>📝 出题音频（视唱切片）</h2>
<div id="qList"></div>

<h2>🎤 答题音频（变频人声）</h2>
<div id="aList"></div>

<script>
var qFiles = ['3A','3A#','3B','3E','3F#','3G','3G#','4A','4A#','4B','4C','4C#','4D','4D#','4E','4F','4F#','4G','4G#','5A','5C','5C#','5D','5D#','5E','5F','5F#','5G'];
var aFiles = ['4A','4B','4C','4D','4E','4F','4G','5A','5C','5D','5E','5F','5G'];

function makeList(containerId, files, prefix) {
  var c = document.getElementById(containerId);
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var url = 'assets/audio/' + prefix + f + '.wav';
    var div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<button onclick="play(this,\'' + url + '\')">&#9654;</button><span class="name">' + f + '</span>';
    c.appendChild(div);
  }
}

var current = null;
function play(btn, url) {
  if (current) { current.pause(); }
  var a = new Audio(url);
  current = a;
  a.play().catch(function(e){ alert('Play failed: ' + e.message); });
  btn.textContent = '⏸';
  a.onended = function() { btn.innerHTML = '&#9654;'; };
  setTimeout(function() { if(!a.ended) btn.innerHTML = '&#9654;'; }, 100);
}

makeList('qList', qFiles, 'question_');
makeList('aList', aFiles, '');
</script>
</body>
</html>
