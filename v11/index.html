<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>V11 · 音符对撞 · 走音的八音盒</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0812; font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; }

  #stage { position:fixed; left:50%; top:50%; width:1920px; height:1080px;
    transform:translate(-50%,-50%); transform-origin:center center;
    background:radial-gradient(ellipse at 30% 20%, #1a1326 0%, #0b0812 60%);
    display:flex; flex-direction:column; }

  /* ============ 顶栏：玩家(左) / 敌人(右) ============ */
  #topbar { height:170px; display:flex; justify-content:space-between; align-items:flex-start; padding:18px 40px; }
  .panel { background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09); border-radius:16px; padding:14px 22px; }
  #playerPanel { width:560px; display:flex; align-items:center; gap:18px; }
  .avatar { font-size:64px; line-height:1; filter:drop-shadow(0 0 14px rgba(255,215,0,.25)); }
  .pinfo { flex:1; }
  .pname { font-size:22px; color:#ffd88a; font-weight:700; letter-spacing:2px; margin-bottom:8px; }
  .hpbar { height:20px; background:rgba(255,255,255,.08); border-radius:10px; overflow:hidden; position:relative; }
  .hpfill { height:100%; background:linear-gradient(90deg,#e94560,#ff6b6b); transition:width .35s; }
  .hptext { position:absolute; inset:0; text-align:center; font-size:14px; color:#fff; line-height:20px; font-weight:700; text-shadow:0 1px 2px #000; }
  .energyRow { margin-top:8px; display:flex; align-items:center; gap:10px; }
  .energyOrb { width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #7ee8fa, #1f7a8c 70%);
    border:3px solid #bdefff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; color:#04222b;
    box-shadow:0 0 18px rgba(126,232,250,.5); }
  .energyNum { font-size:22px; color:#bdefff; font-weight:800; }
  .energyLabel { font-size:13px; color:#7aa; }

  #enemyPanel { width:620px; text-align:right; }
  .ename { font-size:24px; color:#ff9fc0; font-weight:800; letter-spacing:2px; margin-bottom:6px; }
  .edesc { font-size:13px; color:#a89; margin-bottom:10px; }
  #enemyPanel .hpbar { height:24px; }
  #enemyPanel .hpfill { background:linear-gradient(90deg,#c0392b,#ff7675); }
  #intent { margin-top:10px; display:flex; justify-content:flex-end; gap:8px; align-items:center; min-height:44px; }
  .intentLabel { font-size:13px; color:#c9a; }
  .intentBlk { min-width:44px; height:38px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000; padding:0 6px; }

  /* ============ 中部：7 音轨战场 ============ */
  #lanesWrap { flex:1; position:relative; padding:6px 40px; }
  #lanes { position:relative; height:100%; display:flex; flex-direction:column-reverse; gap:6px; }
  .lane { flex:1; position:relative; border-radius:12px; background:var(--laneBg); border:1px solid var(--laneBd);
    box-shadow:inset 0 0 30px rgba(0,0,0,.35); overflow:visible; }
  .laneTag { position:absolute; left:-4px; top:50%; transform:translateY(-50%); width:76px; text-align:center;
    font-size:26px; font-weight:900; color:var(--laneC); text-shadow:0 0 12px var(--laneC); font-family:Georgia,serif; z-index:5; }
  .laneZone { position:absolute; left:84px; right:120px; top:0; bottom:0; }
  .goalP { position:absolute; left:84px; top:0; bottom:0; width:10px; border-radius:5px; background:linear-gradient(#7ee8fa33,#1f7a8c55); }
  .goalE { position:absolute; right:120px; top:0; bottom:0; width:10px; border-radius:5px; background:linear-gradient(#ff9fc055,#c0392b66); }

  .blk { position:absolute; width:58px; height:58px; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; font-family:Georgia,serif;
    color:#fff; text-shadow:0 1px 3px #000; will-change:left; z-index:10; }
  .blk.p { border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--c2), var(--c1) 70%); border:3px solid var(--c1);
    box-shadow:0 0 16px var(--c1); }
  .blk.e { border-radius:14px; transform:translate(-50%,-50%) rotate(45deg); background:linear-gradient(135deg, #3a2030, #552838);
    border:3px solid var(--c1); box-shadow:0 0 14px var(--c1); }
  .blk.e > span:not(.fnum) { transform:rotate(-45deg); }
  .blk .fnum { position:absolute; bottom:-6px; right:-6px; font-size:13px; background:#000a; border-radius:8px; padding:1px 6px; color:#ffd88a; font-family:system-ui; }
  .blk.boosted { animation:resopulse 1s infinite alternate; border-color:#ffd60a; box-shadow:0 0 24px #ffd60a; }
  @keyframes resopulse { from { box-shadow:0 0 12px #ffd60a88; } to { box-shadow:0 0 28px #ffd60a; } }

  #resonantSvg { pointer-events:none; z-index:9; }

  .spark { position:absolute; width:10px; height:10px; border-radius:50%; background:#fff; z-index:20; pointer-events:none;
    animation:sparkfly .55s ease-out forwards; }
  @keyframes sparkfly { to { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
  .dmgFloat { position:absolute; font-size:30px; font-weight:900; color:#ff7675; text-shadow:0 2px 4px #000; z-index:30;
    animation:dmgup .9s ease-out forwards; pointer-events:none; }
  @keyframes dmgup { to { transform:translateY(-56px); opacity:0; } }

  /* ============ 底栏：手牌区 ============ */
  #bottombar { height:294px; position:relative; display:flex; align-items:flex-end; justify-content:center; padding:0 40px 16px; }
  #hand { display:flex; align-items:flex-end; justify-content:center; gap:0; min-height:240px; }
  .card { width:158px; height:226px; margin:0 -9px; border-radius:14px; position:relative; cursor:pointer;
    background:linear-gradient(160deg, #2a2333, #171221); border:2px solid var(--cardBd,#556);
    box-shadow:0 4px 14px #000a; transition:transform .16s ease, box-shadow .16s ease; z-index:1; }
  .card:hover { transform:translateY(-30px) scale(1.13); z-index:20; box-shadow:0 10px 30px #000c, 0 0 20px var(--cardBd); }
  .card.disabled { filter:grayscale(.85) brightness(.6); cursor:not-allowed; }
  .cost { position:absolute; top:-10px; left:-10px; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7ee8fa, #1f7a8c 75%); border:3px solid #bdefff;
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:900; color:#04222b; z-index:2; }
  .cardType { text-align:center; font-size:12px; color:#b9a8c9; letter-spacing:4px; margin-top:16px; }
  .cardName { text-align:center; font-size:30px; font-weight:900; margin-top:2px; color:var(--cardTc,#fff);
    text-shadow:0 0 14px var(--cardBd); font-family:Georgia,"Microsoft YaHei",serif; }
  .cardGlyph { text-align:center; font-size:44px; margin:6px 0 2px; }
  .cardDesc { position:absolute; left:8px; right:8px; bottom:34px; text-align:center; font-size:13.5px; line-height:1.45; color:#d8cbe6; }
  .cardForce { position:absolute; bottom:8px; width:100%; text-align:center; font-size:13px; color:#ffd88a; font-weight:800; }
  .cardRune .cardName { font-size:24px; }

  .pile { position:absolute; bottom:20px; width:120px; text-align:center; font-size:14px; color:#9a8bb0; }
  .pile .pileIcon { font-size:34px; filter:drop-shadow(0 2px 4px #000); }
  .pile .pileNum { font-size:20px; font-weight:800; color:#cbb8de; margin-top:2px; }
  #drawPile { left:56px; } #discardPile { right:180px; }

  #endTurnBtn { position:absolute; right:52px; bottom:96px; width:150px; height:56px; border-radius:14px; border:2px solid #ff9fc0;
    background:linear-gradient(160deg,#4a2030,#2a1020); color:#ffb8cf; font-size:19px; font-weight:800; cursor:pointer; letter-spacing:3px;
    box-shadow:0 0 16px #ff9fc033; }
  #endTurnBtn:hover:not(:disabled) { box-shadow:0 0 26px #ff9fc066; }
  #endTurnBtn:disabled { opacity:.35; cursor:not-allowed; }

  #turnBanner { position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:17px; color:#cbb8de; letter-spacing:3px;
    background:#00000055; padding:6px 22px; border-radius:20px; }

  #toast { position:absolute; top:220px; left:50%; transform:translateX(-50%); background:#000c; color:#ffd88a; font-size:17px;
    padding:10px 28px; border-radius:12px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }

  #overlay { position:absolute; inset:0; background:#000000bb; display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; }
  #overlay.show { display:flex; }
  #overlayTitle { font-size:74px; font-weight:900; letter-spacing:8px; margin-bottom:14px; }
  #overlaySub { font-size:20px; color:#b9a8c9; margin-bottom:44px; }
  #overlayBtn { padding:16px 52px; font-size:22px; border-radius:14px; border:2px solid #ffd60a; background:transparent;
    color:#ffd60a; cursor:pointer; letter-spacing:4px; font-weight:800; }
  #overlayBtn:hover { background:#ffd60a22; }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar">
    <div class="panel" id="playerPanel">
      <div class="avatar">📻</div>
      <div class="pinfo">
        <div class="pname">老收音机</div>
        <div class="hpbar"><div class="hpfill" id="pHpFill"></div><div class="hptext" id="pHpText"></div></div>
        <div class="energyRow">
          <div class="energyOrb" id="energyOrb">3</div>
          <div><div class="energyNum" id="energyNum">3/3</div><div class="energyLabel">音量 🔊</div></div>
        </div>
      </div>
    </div>
    <div id="turnBanner">第 1 小节</div>
    <div class="panel" id="enemyPanel">
      <div class="ename">🎵 走音的八音盒</div>
      <div class="edesc">一台被摔坏的八音盒，循环播放着走调的歌</div>
      <div class="hpbar"><div class="hpfill" id="eHpFill"></div><div class="hptext" id="eHpText"></div></div>
      <div id="intent"><span class="intentLabel">下小节它将唱出：</span></div>
    </div>
  </div>

  <div id="lanesWrap">
    <div id="lanes"></div>
  </div>

  <div id="bottombar">
    <div class="pile" id="drawPile"><div class="pileIcon">🎼</div>曲库<div class="pileNum" id="drawNum">15</div></div>
    <div id="hand"></div>
    <div class="pile" id="discardPile"><div class="pileIcon">🎙️</div>已奏<div class="pileNum" id="discardNum">0</div></div>
    <button id="endTurnBtn">结束小节</button>
  </div>

  <div id="toast"></div>
  <div id="overlay">
    <div id="overlayTitle"></div>
    <div id="overlaySub"></div>
    <button id="overlayBtn">再奏一曲</button>
  </div>
</div>

<script>
'use strict';
/* ================= V11 音符对撞 · 初步原型 =================
   布局参考杀戮尖塔：左下玩家+能量，右上敌人+意图，底部手牌。
   核心机制：7 条唱名横轨（do 在下 si 在上，音高直觉），
   音符卡发射音块从左飞向右，敌方音块从右飞向左，
   同轨相撞比力度（大者存活差值），到达对端造成伤害。
   do+mi+sol 同场 = 大三和弦共鸣，全体我方音块+2。 */

const NOTES = [
  { id:'do',  cn:'Do',  full:'主音', semi:0,  hue:0   },
  { id:'re',  cn:'Re',  full:'上行', semi:2,  hue:55  },
  { id:'mi',  cn:'Mi',  full:'中音', semi:4,  hue:203 },
  { id:'fa',  cn:'Fa',  full:'下属', semi:5,  hue:352 },
  { id:'sol', cn:'Sol', full:'属音', semi:7,  hue:32  },
  { id:'la',  cn:'La',  full:'下中', semi:9,  hue:128 },
  { id:'si',  cn:'Si',  full:'导音', semi:11, hue:225 },
];
const NMAP = Object.fromEntries(NOTES.map(n=>[n.id,n]));
const LANE_C = {}; // 轨道主色/辅色
NOTES.forEach(n=>{
  LANE_C[n.id] = { c1:`hsl(${n.hue} 90% 58%)`, c2:`hsl(${n.hue} 70% 30%)`,
    bg:`hsl(${n.hue} 60% 14% / .55)`, bd:`hsl(${n.hue} 70% 40% / .5)` };
});

/* ---------- 卡牌定义 ---------- */
const CARDS = {
  do:  { type:'note', note:'do',  cost:1, name:'Do · 主音', desc:'在 Do 轨发射一个音块' },
  re:  { type:'note', note:'re',  cost:1, name:'Re · 上行', desc:'在 Re 轨发射一个音块' },
  mi:  { type:'note', note:'mi',  cost:1, name:'Mi · 中音', desc:'在 Mi 轨发射一个音块' },
  fa:  { type:'note', note:'fa',  cost:1, name:'Fa · 下属', desc:'在 Fa 轨发射一个音块' },
  sol: { type:'note', note:'sol', cost:1, name:'Sol · 属音', desc:'在 Sol 轨发射一个音块' },
  la:  { type:'note', note:'la',  cost:1, name:'La · 下中', desc:'在 La 轨发射一个音块' },
  si:  { type:'note', note:'si',  cost:1, name:'Si · 导音', desc:'在 Si 轨发射一个音块' },
  cresc:  { type:'rune', cost:1, glyph:'𝄝', name:'渐强', desc:'本小节你奏出的音符力度 +2', en:'crescendo' },
  wave:   { type:'rune', cost:1, glyph:'〜', name:'波浪', desc:'下一张音符卡：该轨与相邻轨各发一块', en:'trillo' },
  decresc:{ type:'rune', cost:1, glyph:'𝄞', name:'渐弱', desc:'所有敌方音块力度 −3', en:'diminuendo' },
  dacapo: { type:'rune', cost:1, glyph:'𝄋', name:'反复', desc:'重演最后一张音符卡（再发一块）', en:'da capo' },
  rest:   { type:'rune', cost:2, glyph:'𝄐', name:'终曲华彩', desc:'所有飞行中的我方音块立即命中结算，无视拦截', en:'cadenza' },
  heal:   { type:'aux',  cost:1, glyph:'🔧', name:'调音', desc:'恢复 6 点生命', en:'accordatura' },
  draw2:  { type:'aux',  cost:0, glyph:'👂', name:'复听', desc:'抽 2 张牌', en:'riascolto' },
};
const NOTE_FORCE = 6, BASE_SPEED = 150; // px/s
const START_DECK = ['do','do','re','mi','mi','fa','sol','sol','la','si','cresc','dacapo','heal','draw2','wave'];

/* ---------- 敌人歌单（循环，每圈力度+cycle） ---------- */
const SONG = [
  [], // 第1小节蓄力
  [ {n:'do',f:3},{n:'re',f:3},{n:'mi',f:3} ],
  [ {n:'sol',f:7} ],
  [ {n:'la',f:4},{n:'si',f:4},{n:'do',f:4} ],
];
const ENEMY_HP = 42, PLAYER_HP = 50, ENERGY_MAX = 3;

/* ---------- 状态 ---------- */
const S = {
  php:PLAYER_HP, ehp:ENEMY_HP, energy:ENERGY_MAX,
  deck:[], hand:[], discard:[], turn:1, phase:'play', // play | resolve | over
  blocks:[], lastNote:null, crescThisBar:false, waveNext:false,
  cycle:0, songIdx:0,
};
const $=id=>document.getElementById(id);
const lanesEl=$('lanes'), handEl=$('hand');

/* ---------- 音频（Web Audio 合成，零资产） ---------- */
let AC=null;
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); }
document.addEventListener('pointerdown', ensureAudio, {capture:true});
function playNote(id, vol=.4, dur=.5){
  if(!AC || AC.state!=='running') return;
  const f=261.63*Math.pow(2,NMAP[id].semi/12), t=AC.currentTime;
  const o1=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
  o1.type='triangle'; o2.type='sine'; o1.frequency.value=f; o2.frequency.value=f*2;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o1.connect(g); o2.connect(g); g.connect(AC.destination);
  o1.start(t); o2.start(t); o1.stop(t+dur); o2.stop(t+dur);
}
function playCrash(){ if(!AC)return; const t=AC.currentTime, len=.22, buf=AC.createBuffer(1,AC.sampleRate*len|0,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(); s.buffer=buf; const g=AC.createGain(); g.gain.value=.35;
  const fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900;
  s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start(t); }
function playChord(ids){ ids.forEach((n,i)=>setTimeout(()=>playNote(n,.45,.75), i*90)); }
function playBad(){ playNote('fa',.3,.3); setTimeout(()=>playNote('mi',.3,.4),110); }

/* ---------- 舞台缩放 ---------- */
const stage=$('stage');
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ---------- 建轨道 ---------- */
NOTES.forEach(n=>{
  const lane=document.createElement('div'); lane.className='lane'; lane.id='lane_'+n.id;
  const c=LANE_C[n.id];
  lane.style.setProperty('--laneBg',c.bg); lane.style.setProperty('--laneBd',c.bd); lane.style.setProperty('--laneC',c.c1);
  lane.innerHTML=`<div class="laneTag">${n.cn}</div><div class="laneZone" id="zone_${n.id}"></div>
    <div class="goalP"></div><div class="goalE"></div>`;
  lanesEl.appendChild(lane);
});
function zoneOf(id){ return $('zone_'+id); }
function zoneW(id){ return zoneOf(id).clientWidth; }

/* ---------- 音块 ---------- */
function spawnBlock(side, note, force){
  const c=LANE_C[note];
  const el=document.createElement('div'); el.className='blk '+side;
  el.style.setProperty('--c1',c.c1); el.style.setProperty('--c2',c.c2);
  el.innerHTML=`<span>${NMAP[note].cn}</span><span class="fnum">${force}</span>`;
  const b={ side, note, force, x:(side==='p'?58:zoneW(note)-58), el, boosted:false };
  el.style.left=b.x+'px'; zoneOf(note).appendChild(el);
  S.blocks.push(b);
  if(side==='p'){ playNote(note,.4,.5); if(S.crescThisBar){ b.force+=2; b.boosted=true; el.classList.add('boosted'); b.el.querySelector('.fnum').textContent=b.force; } }
  checkResonance();
  return b;
}
function killBlock(b, spark=true){
  if(spark) doSpark(b);
  b.el.remove(); S.blocks.splice(S.blocks.indexOf(b),1);
  checkResonance();
}
function doSpark(b){
  const z=zoneOf(b.note), r=z.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const scale=sr.width/1920;
  const zx=(r.left-sr.left)/scale + b.x*scale, zy=(r.top-sr.top)/scale + r.height/2*scale;
  for(let i=0;i<6;i++){
    const sp=document.createElement('div'); sp.className='spark';
    sp.style.left=zx+'px'; sp.style.top=zy+'px';
    sp.style.background=Math.random()<.5?LANE_C[b.note].c1:'#fff';
    sp.style.setProperty('--dx',(Math.random()*160-80)+'px');
    sp.style.setProperty('--dy',(Math.random()*120-60)+'px');
    stage.appendChild(sp); setTimeout(()=>sp.remove(),600);
  }
}
function floatDmg(target, val){
  const el=document.createElement('div'); el.className='dmgFloat'; el.textContent='-'+val;
  const px=target==='e'? 1660 : 320, py=target==='e'? 120 : 60;
  el.style.left=px+'px'; el.style.top=py+'px'; stage.appendChild(el); setTimeout(()=>el.remove(),950);
}

/* ---------- 大三和弦共鸣：do+mi+sol 同场 → 我方全体+2（一次性标记） ---------- */
function checkResonance(){
  const mine=S.blocks.filter(b=>b.side==='p').map(b=>b.note);
  const has=['do','mi','sol'].every(n=>mine.includes(n));
  if(has){
    let any=false;
    S.blocks.filter(b=>b.side==='p'&&!b.boosted).forEach(b=>{ b.force+=2; b.boosted=true; b.el.classList.add('boosted');
      b.el.querySelector('.fnum').textContent=b.force; any=true; });
    if(any){ playChord(['do','mi','sol']); toast('🎹 大三和弦共鸣！我方音块 +2'); drawResonantLines(); }
  }
  const svg=$('resonantSvg');
  if(svg) svg.remove(); const old=document.querySelector('#resonantSvg'); if(old) old.remove();
  if(has) drawResonantLines();
}
function drawResonantLines(){
  document.querySelectorAll('#resonantSvg').forEach(e=>e.remove());
  const trio=S.blocks.filter(b=>b.side==='p'&&['do','mi','sol'].includes(b.note));
  if(trio.length<3) return;
  const sr=stage.getBoundingClientRect(), scale=sr.width/1920;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='resonantSvg';
  svg.setAttribute('width','1920'); svg.setAttribute('height','1080');
  svg.style.cssText='position:absolute;left:0;top:0;pointer-events:none;z-index:9;';
  const pts=trio.map(b=>{ const z=zoneOf(b.note).getBoundingClientRect();
    return { x:(z.left-sr.left)/scale + b.x*scale, y:(z.top-sr.top)/scale + z.height/2*scale }; });
  for(let i=0;i<pts.length;i++){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    const a=pts[i], bp=pts[(i+1)%pts.length];
    l.setAttribute('x1',a.x); l.setAttribute('y1',a.y); l.setAttribute('x2',bp.x); l.setAttribute('y2',bp.y);
    l.setAttribute('stroke','#ffd60a'); l.setAttribute('stroke-width','3'); l.setAttribute('opacity','.75');
    l.setAttribute('stroke-dasharray','12 8'); svg.appendChild(l);
  }
  stage.appendChild(svg);
}

/* ---------- 牌 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function drawCards(n){
  for(let i=0;i<n;i++){
    if(S.hand.length>=10) break;
    if(!S.deck.length){ if(!S.discard.length) break; S.deck=shuffle(S.discard.splice(0)); }
    S.hand.push(S.deck.pop());
  }
  renderHand(); renderPiles();
}
function cardForceOf(def){ return def.type==='note'? NOTE_FORCE + (S.crescThisBar?2:0) : null; }
function renderHand(){
  handEl.innerHTML='';
  S.hand.forEach((cid,i)=>{
    const def=CARDS[cid]; const el=document.createElement('div');
    el.className='card '+(def.type==='note'?'cardNote':def.type==='rune'?'cardRune':'');
    const note=def.note, c=note?LANE_C[note]:null;
    const bd = def.type==='note'? (c?c.c1:'#888') : def.type==='rune'? '#b07af0' : '#63d47e';
    el.style.setProperty('--cardBd',bd); el.style.setProperty('--cardTc', def.type==='note'?'#fff':'#e6d9f5');
    const force=cardForceOf(def);
    el.innerHTML=`
      <div class="cost">${def.cost}</div>
      <div class="cardType">${def.type==='note'?'音 符':def.type==='rune'?'符 文':'辅 助'}</div>
      <div class="cardName">${def.name}</div>
      <div class="cardGlyph">${def.type==='note'? (NMAP[note].cn) : def.glyph}</div>
      <div class="cardDesc">${def.desc}</div>
      <div class="cardForce">${def.type==='note'? '力度 '+force : def.en||''}</div>`;
    const usable = S.phase==='play' && S.energy>=def.cost;
    if(!usable) el.classList.add('disabled');
    el.onclick=()=>playCard(i, el);
    handEl.appendChild(el);
  });
}
function playCard(i, el){
  if(S.phase!=='play'){ toast('这一小节已经结束啦'); return; }
  const cid=S.hand[i], def=CARDS[cid];
  if(S.energy<def.cost){ toast('音量不够了 🔇'); playBad(); return; }
  if(cid==='dacapo' && !S.lastNote){ toast('还没有奏出任何音符'); return; }

  S.energy-=def.cost; S.hand.splice(i,1); S.discard.push(cid);
  if(def.type==='note'){
    S.lastNote=def.note;
    const f=NOTE_FORCE+(S.crescThisBar?2:0);
    spawnBlock('p',def.note,f);
    if(S.waveNext){
      S.waveNext=false;
      const idx=NOTES.findIndex(n=>n.id===def.note);
      const up=idx<6?NOTES[idx+1].id:null, dn=idx>0?NOTES[idx-1].id:null;
      const adj=up||dn; spawnBlock('p',adj,f); toast('〜 波浪：'+NMAP[adj].cn+' 轨追加一块');
    }
  }
  else if(cid==='cresc'){ S.crescThisBar=true; toast('𝄝 渐强：本小节音符 +2 力度'); }
  else if(cid==='wave'){ S.waveNext=true; toast('〜 波浪已蓄势：下一张音符双轨齐发'); }
  else if(cid==='decresc'){ let hit=0; S.blocks.filter(b=>b.side==='e').forEach(b=>{ b.force=Math.max(0,b.force-3);
      b.el.querySelector('.fnum').textContent=b.force; hit++; }); toast(hit?('𝄞 渐弱：'+hit+' 个敌方音块 −3'):'𝄞 渐弱：敌方还没有音块'); }
  else if(cid==='dacapo'){ const f=NOTE_FORCE+(S.crescThisBar?2:0); spawnBlock('p',S.lastNote,f); toast('𝄋 反复：重演 '+NMAP[S.lastNote].cn); }
  else if(cid==='rest'){ let n=0,total=0;
      [...S.blocks].filter(b=>b.side==='p').forEach(b=>{ total+=b.force; S.ehp-=b.force; n++; doSpark(b); killBlock(b,false); });
      if(n){ floatDmg('e',total); playChord(['sol','si','do']); toast('𝄐 华彩！'+n+' 个音块立即命中，共 '+total+' 伤害'); renderTop(); if(S.ehp<=0) return gameOver(true); }
      else toast('场上没有我方音块'); }
  else if(def.id==='heal'){ S.php=Math.min(PLAYER_HP,S.php+6); toast('🔧 调音完成，生命 +6'); }
  else if(def.id==='draw2'){ drawCards(2); toast('👂 复听：抽 2 张'); }

  renderTop(); renderHand(); renderPiles();
}
function renderPiles(){ $('drawNum').textContent=S.deck.length; $('discardNum').textContent=S.discard.length; }
function renderTop(){
  $('pHpFill').style.width=(S.php/PLAYER_HP*100)+'%'; $('pHpText').textContent=S.php+' / '+PLAYER_HP;
  $('eHpFill').style.width=(Math.max(0,S.ehp)/ENEMY_HP*100)+'%'; $('eHpText').textContent=Math.max(0,S.ehp)+' / '+ENEMY_HP;
  $('energyOrb').textContent=S.energy; $('energyNum').textContent=S.energy+'/'+ENERGY_MAX;
  $('turnBanner').textContent='第 '+S.turn+' 小节'+(S.phase==='resolve'?' · 演奏中…':'');
  $('endTurnBtn').disabled = S.phase!=='play';
}
function renderIntent(){
  const next=SONG[S.songIdx].map(b=>({...b, f:b.f+S.cycle}));
  const it=$('intent'); it.innerHTML='<span class="intentLabel">结束本小节时它将唱出：</span>';
  if(!next.length){ it.innerHTML+='<span class="intentLabel">💤 蓄力（不发块）</span>'; return; }
  next.forEach(b=>{ const d=document.createElement('div'); d.className='intentBlk';
    d.style.background=LANE_C[b.n].bg; d.style.border='2px solid '+LANE_C[b.n].c1; d.style.color=LANE_C[b.n].c1;
    d.innerHTML=NMAP[b.n].cn+'<b style="font-size:14px">'+b.f+'</b>'; it.appendChild(d); });
}

/* ---------- 敌方回合 ---------- */
$('endTurnBtn').onclick=()=>{
  if(S.phase!=='play') return;
  S.phase='resolve'; renderTop();
  const bar=SONG[S.songIdx].map(b=>({...b}));
  S.songIdx++; if(S.songIdx>=SONG.length){ S.songIdx=0; S.cycle++; }
  if(!bar.length){ S.enemySpawning=false; toast('八音盒在蓄力……'); setTimeout(endResolveCheck, 900); }
  else {
    S.enemySpawning=true;
    bar.forEach((b,k)=> setTimeout(()=>{
      if(S.phase==='over') return;
      spawnBlock('e', b.n, b.f+S.cycle); playNote(b.n,.25,.35);
      if(k===bar.length-1) S.enemySpawning=false;
    }, k*400+250));
  }
};
function endResolveCheck(){
  if(S.phase!=='resolve') return;
  if(S.enemySpawning) return;
  if(S.blocks.length){ setTimeout(endResolveCheck,500); return; }
  if(S.php<=0) return gameOver(false);
  if(S.ehp<=0) return gameOver(true);
  S.turn++; S.energy=ENERGY_MAX; S.crescThisBar=false; S.phase='play';
  drawCards(Math.max(0,5-S.hand.length));
  renderTop(); renderIntent();
}

/* ---------- 主循环：飞行 / 对撞 / 到达 ---------- */
let lastT=performance.now();
function tick(t){
  const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(S.phase!=='over'){
    for(const b of [...S.blocks]){
      const dir=b.side==='p'?1:-1;
      b.x += dir*BASE_SPEED*dt;
      b.el.style.left=b.x+'px';
      // 到达判定
      if(b.side==='p' && b.x>=zoneW(b.note)-30){
        S.ehp-=b.force; floatDmg('e',b.force); doSpark(b);
        playChord([b.note]); killBlock(b,false);
        $('enemyPanel').style.transform='translateX(-6px)'; setTimeout(()=>$('enemyPanel').style.transform='',120);
        renderTop();
        if(S.ehp<=0) return gameOver(true);
      } else if(b.side==='e' && b.x<=30){
        S.php-=b.force; floatDmg('p',b.force); doSpark(b);
        playCrash(); killBlock(b,false);
        $('playerPanel').style.transform='translateX(6px)'; setTimeout(()=>$('playerPanel').style.transform='',120);
        renderTop();
        if(S.php<=0) return gameOver(false);
      }
    }
    // 对撞判定（同轨异侧）
    for(let i=0;i<S.blocks.length;i++){
      const a=S.blocks[i];
      for(let j=i+1;j<S.blocks.length;j++){
        const b=S.blocks[j];
        if(a.note===b.note && a.side!==b.side && Math.abs(a.x-b.x)<44){
          playCrash();
          const diff=a.force-b.force;
          if(diff>0){ b.force=0; killBlock(b); a.force=diff; a.el.querySelector('.fnum').textContent=a.force;
            toast('💥 '+NMAP[a.note].cn+' 轨对撞！'+(a.side==='p'?'我方':'敌方')+'音块胜出，余力 '+diff); }
          else if(diff<0){ a.force=0; killBlock(a); b.force=-diff; b.el.querySelector('.fnum').textContent=b.force;
            toast('💥 '+NMAP[a.note].cn+' 轨对撞！'+(b.side==='p'?'我方':'敌方')+'音块胜出，余力 '+(-diff)); }
          else { toast('💥 '+NMAP[a.note].cn+' 轨对撞！同归于尽'); killBlock(a); killBlock(b); }
          renderTop(); break;
        }
      }
    }
    if(S.phase==='resolve' && !S.blocks.length) endResolveCheck();
    if(document.querySelector('.blk.boosted')) drawResonantLines();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- 胜负 ---------- */
function gameOver(win){
  S.phase='over'; renderTop();
  const ov=$('overlay');
  $('overlayTitle').textContent = win?'🏆 演出成功':'📻 声音哑了';
  $('overlayTitle').style.color = win?'#ffd60a':'#ff7675';
  $('overlaySub').textContent = win?'走音的八音盒被你的旋律治好了':'收音机需要重新调频……';
  ov.classList.add('show');
  if(win) playChord(['do','mi','sol','do']);
  else playBad();
}
$('overlayBtn').onclick=()=>location.reload();

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,1600); }

/* ---------- 开局 ---------- */
S.deck=shuffle([...START_DECK]);
drawCards(5);
renderTop(); renderPiles(); renderIntent();
toast('📻 收音机V11 · 打出音符卡拦截敌方旋律，或直取八音盒！');
window.__game=S; window.__api={spawnBlock, playCard}; // 调试/测试钩子
</script>
