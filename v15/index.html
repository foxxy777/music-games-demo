<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V15 音浪尖塔 · 三音攻防</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060d; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; user-select:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #app { position:relative; width:1280px; height:720px; flex:none; transform-origin:center center;
         background:radial-gradient(1100px 650px at 42% 38%, #151b36 0%, #0d1122 55%, #070912 100%); color:#dfe6ff; overflow:hidden; }
  .scr { position:absolute; inset:0; display:none; }
  .scr.on { display:block; }
  .shake { animation:appShake .3s; }
  @keyframes appShake { 0%,100%{translate:0 0;} 25%{translate:-7px 3px;} 50%{translate:6px -3px;} 75%{translate:-3px 2px;} }

  /* ===== 通用 ===== */
  .btn { background:#232b4d; border:1px solid #4a568f; border-radius:12px; color:#dfe6ff; font-size:20px; padding:10px 22px; cursor:pointer; }
  .btn:hover { background:#2e3866; border-color:#6d7cc0; }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.gold { background:linear-gradient(160deg,#a37c1c,#6d5210); border-color:#ffd54f; color:#fff6d8; font-weight:bold; }
  .hpbar { height:16px; background:#20264a; border:1px solid #3d4680; border-radius:8px; overflow:hidden; }
  .hpfill { height:100%; background:linear-gradient(90deg,#ff5d6c,#ff9a76); transition:width .35s; border-radius:8px; }
  .hpfill.enemy { background:linear-gradient(90deg,#c04658,#ff7a7a); }

  /* ===== 主菜单 ===== */
  #scr-menu { display:none; flex-direction:column; align-items:center; justify-content:center; gap:24px; }
  #scr-menu.on { display:flex; }
  #title { font-size:64px; font-weight:900; letter-spacing:10px; color:#ffe9b8; text-shadow:0 0 30px #ffb84d88, 0 0 80px #ff7ad955; }
  #subtitle { font-size:20px; color:#8f9ccf; letter-spacing:4px; }
  #menu-rules { max-width:760px; text-align:center; font-size:16px; line-height:1.9; color:#7d8ab8; }
  #menu-rules b { color:#ffd54f; font-weight:normal; }
  #menu-box { display:flex; flex-direction:column; gap:14px; width:300px; }
  #menu-box .btn { font-size:24px; padding:14px; }
  #vol-row { display:flex; align-items:center; gap:12px; color:#8f9ccf; font-size:16px; }
  #vol-row input { width:160px; accent-color:#ffd54f; }

  /* ===== 战斗 ===== */
  #scr-battle { display:none; flex-direction:column; }
  #scr-battle.on { display:flex; }
  #b-top { height:132px; display:flex; align-items:stretch; gap:8px; padding:8px 10px; }
  .hero-box { width:250px; display:flex; gap:10px; align-items:center; background:#0d1128cc; border:1px solid #2c3560; border-radius:14px; padding:8px 12px; }
  .hero-face { font-size:44px; filter:drop-shadow(0 0 10px #7d8aff88); }
  .hero-face.hurt { animation:enemyHit .3s; }
  .hero-info { flex:1; }
  .hero-name { font-size:16px; color:#ffe9b8; margin-bottom:4px; }
  #b-mid { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #turn-ind { font-size:15px; color:#8f9ccf; }
  #b-hint { font-size:17px; color:#7dffcf; height:26px; text-align:center; }
  #b-hint.chord { color:#ffd54f; text-shadow:0 0 12px #ffd54f66; }

  /* 小怪区 */
  #enemy-box { width:330px; display:flex; gap:10px; background:#0d1128cc; border:1px solid #2c3560; border-radius:14px; padding:8px 12px; align-items:center; }
  #enemy-face { font-size:46px; filter:drop-shadow(0 0 12px #ffb84d88); transition:transform .15s; }
  #enemy-face.hit { animation:enemyHit .3s; }
  @keyframes enemyHit { 50% { transform:scale(.88) rotate(-5deg); } }
  #enemy-info { flex:1; }
  #enemy-name { font-size:14px; color:#ffe9b8; margin-bottom:3px; }
  #enemy-chips { display:flex; gap:5px; margin-bottom:5px; min-height:24px; }
  .chip { font-size:12px; font-weight:bold; padding:2px 7px; border-radius:8px; border:1px solid #3d4680; background:#161c39; color:#5d6ba0; transition:all .2s; }
  .chip.lit { color:#ffb0c0; border-color:#c04658; background:#2a1220; box-shadow:0 0 8px #ff5d6c55; }
  .chip.blocked { color:#7db8ff; border-color:#4d8ae2; background:#12203a; text-decoration:line-through; box-shadow:0 0 8px #4d8ae255; }
  .chip.leak { color:#ff7a7a; border-color:#ff5d6c; background:#3a1218; animation:chipLeak .5s; }
  @keyframes chipLeak { 30% { transform:scale(1.25); } }

  /* 七轨 */
  #b-lanes { flex:1; margin:0 10px 6px; display:flex; flex-direction:column; gap:4px; position:relative; }
  .lane { flex:1; display:flex; align-items:center; border-radius:10px; position:relative;
          background:linear-gradient(90deg, #ffffff05, #ffffff0a 50%, #ffffff05); border:1px solid #ffffff10; }
  .lane.flash { animation:laneFlash .45s; }
  @keyframes laneFlash { 30% { background:#ffffff26; box-shadow:0 0 18px #ffffff33; } }
  .lane.targetable { cursor:pointer; }

  .lane-name { width:34px; text-align:center; font-size:17px; font-weight:bold; opacity:.9; text-shadow:0 0 10px currentColor; flex:none; cursor:pointer; }
  .lane-field { flex:1; position:relative; height:100%; cursor:pointer; }

  /* 轨内标记：敌音 / 防御盾 / 攻击 */
  .mark { position:absolute; width:32px; height:32px; margin:-16px 0 0 -16px; border-radius:50%; z-index:5;
          display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:bold;
          background:radial-gradient(circle at 35% 30%, #b388ff, #7d4de0 60%, #3d2685); border:2px solid #e0c8ff; box-shadow:0 0 10px #b388ff77;
          transition:opacity .25s, transform .25s; }
  .mark.blocked { opacity:.35; transform:scale(.75); }
  .mark.covered { opacity:.55; }
  .mark.leak { animation:markLeak .5s; background:radial-gradient(circle at 35% 30%, #ff9a9a, #e25555 60%, #8f2e2e); border-color:#ffd0d0; }
  @keyframes markLeak { 30% { transform:scale(1.3); } }
  .mark.gone { opacity:0; transform:scale(.2); }
  .shld { position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; z-index:6;
          display:flex; align-items:center; justify-content:center; font-size:14px;
          background:radial-gradient(circle at 35% 30%, #9ad8ff, #4d8ae2 60%, #2e4a8f); border:2px solid #d0e8ff; box-shadow:0 0 12px #4dd8ff88;
          animation:shldPop .25s; }
  @keyframes shldPop { 0% { transform:scale(.3); } 70% { transform:scale(1.15); } }
  .shld.dissolve { transition:all .35s; opacity:0; transform:scale(.4) translateY(-6px); }
  .atk-mark { position:absolute; width:32px; height:32px; margin:-16px 0 0 -16px; border-radius:50%; z-index:5;
              display:flex; align-items:center; justify-content:center; font-size:15px;
              background:radial-gradient(circle at 35% 30%, #ffb08a, #e2664d 60%, #8f3a2e); border:2px solid #ffd8c0; box-shadow:0 0 10px #ff7a5577;
              transition:left .3s, top .3s, opacity .3s; }
  .atk-mark.fly { transition:all .4s ease-in; opacity:.25; }

  /* 底栏：牌堆信息+手牌+操作 */
  #b-bottom { height:168px; display:flex; align-items:center; gap:12px; padding:8px 14px; }
  #deck-info { width:118px; flex:none; display:flex; flex-direction:column; gap:5px; font-size:13px; color:#8f9ccf;
               background:#0d1128aa; border:1px solid #2c3560; border-radius:12px; padding:10px 12px; }
  #deck-info b { color:#dfe6ff; }
  #hand { flex:1; display:flex; gap:10px; align-items:center; justify-content:center; height:100%; }
  .card { position:relative; width:97px; height:132px; flex:none; border-radius:10px; cursor:pointer; overflow:hidden;
          background:linear-gradient(165deg,#232a52,#151a38); border:2px solid var(--cc,#3d4680); transition:transform .1s; }
  .card:hover { transform:translateY(-8px); }
  .card.sel { outline:3px solid #ffd54f; transform:translateY(-10px); box-shadow:0 0 18px #ffd54f66; }
  .card .cicon { margin-top:16px; text-align:center; font-size:32px; filter:drop-shadow(0 0 8px currentColor); }
  .card .cname { margin-top:5px; text-align:center; font-size:16px; font-weight:bold; }
  .card .cval { margin:4px 4px 0; text-align:center; font-size:12px; color:#9fb0e8; }
  .card.def { --cc:#4d8ae2; color:#9ad8ff; }
  .card.atk { --cc:#ff5d6c; color:#ff9a8a; }
  .card.def .cname { color:#9ad8ff; } .card.atk .cname { color:#ff9a8a; }
  #ops { display:flex; flex-direction:column; gap:8px; flex:none; }
  #endturn { width:132px; height:64px; flex:none; font-size:20px; font-weight:bold; }
  #btn-replay { width:132px; height:40px; flex:none; font-size:15px; padding:2px; }

  /* 大字 */
  #bigword { position:absolute; left:0; right:0; top:34%; text-align:center; font-size:56px; font-weight:900; pointer-events:none; opacity:0; z-index:50;
             color:#ffd54f; text-shadow:0 0 30px #ffb84d, 0 0 80px #ff7ad9; }
  #bigword.pop { animation:bigPop 1.1s forwards; }
  @keyframes bigPop { 0% { opacity:0; transform:scale(.4); } 18% { opacity:1; transform:scale(1.15); } 30% { transform:scale(1); } 78% { opacity:1; } 100% { opacity:0; transform:scale(1.05) translateY(-16px); } }

  /* ===== 胜负屏 ===== */
  .panel-scr { display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#070a18ee; }
  .panel-scr.on { display:flex; }
  .panel-title { font-size:44px; font-weight:900; color:#ffe9b8; text-shadow:0 0 20px #ffb84d66; letter-spacing:6px; }
  #end-title.lose { color:#8f9ccf; text-shadow:0 0 20px #4d5a8f66; }
  #end-stats { color:#9fb0e8; font-size:19px; line-height:2; text-align:center; }
  #end-stats b { color:#ffd54f; }

  #toast { position:absolute; left:50%; bottom:186px; transform:translateX(-50%); background:#181e3dee; border:1px solid #4a568f; border-radius:10px;
           padding:8px 20px; font-size:15px; z-index:99; opacity:0; pointer-events:none; transition:opacity .25s; white-space:nowrap; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<div id="stage"><div id="app">

  <!-- 主菜单：直进战斗 -->
  <div class="scr on" id="scr-menu">
    <div id="title">音浪尖塔</div>
    <div id="subtitle">三音攻防 · 听音盖牌 · 和弦爆发</div>
    <div id="menu-rules">
      🎵 音符小怪每回合随机播 <b>3 个音</b>（可重复）<br>
      🛡 打出<b>防御牌</b>盖住敌音轨（1 张盖 1 音，do×2 要叠 2 张）｜⚔ 打出<b>攻击牌</b>放上空轨飞打小怪<br>
      🎼 三张攻击牌构成<b>大三/小三和弦</b> → 总伤害 <b>×2</b>！没盖住的敌音每音打你 10
    </div>
    <div id="menu-box">
      <button class="btn gold" id="btn-start">开始战斗</button>
    </div>
    <div id="vol-row">🔊 音量 <input type="range" id="vol" min="0" max="100" value="70"></div>
  </div>

  <!-- 战斗 -->
  <div class="scr" id="scr-battle">
    <div id="b-top">
      <div class="hero-box">
        <div class="hero-face" id="p-face">🧑‍🎤</div>
        <div class="hero-info">
          <div class="hero-name">流浪乐手</div>
          <div class="hpbar"><div class="hpfill" id="p-hpfill"></div></div>
          <div style="font-size:13px; margin-top:3px" id="p-hptxt"></div>
        </div>
      </div>
      <div id="b-mid">
        <div id="turn-ind"></div>
        <div id="b-hint"></div>
      </div>
      <div id="enemy-box">
        <div id="enemy-face">🎵</div>
        <div id="enemy-info">
          <div id="enemy-name">🎵 音符小怪</div>
          <div id="enemy-chips"></div>
          <div class="hpbar"><div class="hpfill enemy" id="e-hpfill"></div></div>
          <div style="font-size:12px; margin-top:2px" id="e-hptxt"></div>
        </div>
      </div>
    </div>
    <div id="b-lanes"></div>
    <div id="b-bottom">
      <div id="deck-info">
        <div>🂠 抽牌堆 <b id="di-draw">0</b></div>
        <div>🗑 弃牌堆 <b id="di-discard">0</b></div>
        <div>🔁 洗牌 <b id="di-shuffle">0</b> 次</div>
      </div>
      <div id="hand"></div>
      <div id="ops">
        <button class="btn gold" id="endturn">结束回合</button>
        <button class="btn" id="btn-replay">重听敌音 🔁</button>
      </div>
    </div>
  </div>

  <!-- 胜负 -->
  <div class="scr panel-scr" id="scr-end">
    <div class="panel-title" id="end-title"></div>
    <div id="end-stats"></div>
    <div style="display:flex; gap:14px">
      <button class="btn gold" id="btn-again">再来一局</button>
      <button class="btn" id="btn-to-menu">回到标题</button>
    </div>
  </div>

  <div id="bigword"></div>
  <div id="toast"></div>
</div></div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/duel.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
