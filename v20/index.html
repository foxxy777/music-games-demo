<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V20 · 第一幕 声之原野 · 铁音武士</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#050714;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none;color:#dfe6ff;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:1280px;height:720px;flex:none;transform-origin:center center;background:radial-gradient(1100px 650px at 42% 38%,#151b36 0%,#0d1122 55%,#070912 100%);display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ===== MAP ===== */
#map-screen{flex:1;display:none;flex-direction:column;padding:14px 20px;overflow:auto}
#map-screen.on{display:flex}
#map-title{font-size:20px;color:#ffe9b8;text-align:center;margin-bottom:6px;letter-spacing:2px}
#map-stats{display:flex;gap:14px;justify-content:center;font-size:13px;color:#9fb0e8;margin-bottom:10px}
#map-stats b{color:#ffd54f}
#map-layers{flex:1;display:flex;flex-direction:column-reverse;gap:8px;justify-content:flex-end}
.map-layer{display:flex;gap:10px;justify-content:center;align-items:center;min-height:56px}
.node{width:64px;height:52px;border-radius:8px;border:2px solid #3d4680;background:#11162e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all .15s;position:relative}
.node .ni{font-size:20px;line-height:1}
.node.locked{opacity:.28;cursor:default}
.node.done{opacity:.45;border-color:#2c3560}
.node.next{border-color:#ffd54f;box-shadow:0 0 14px #ffd54f66;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px #ffd54faa}}
.node.boss{border-color:#ff5d6c;width:76px;height:60px}
.node.elite{border-color:#b88aff}

/* ===== BATTLE ===== */
#battle-screen{flex:1;display:none;flex-direction:column}
#battle-screen.on{display:flex}
#top{flex:0 0 27%;display:flex;flex-direction:column;padding:10px 16px;border-bottom:1px solid #2c3560;background:linear-gradient(180deg,#0d1128,transparent)}
#enemy-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#enemy-face{font-size:44px;filter:drop-shadow(0 0 12px #ffb84d88)}
#enemy-info{flex:1}
#enemy-name{font-size:15px;color:#ffe9b8;margin-bottom:3px}
.hpbar{height:13px;background:#20264a;border:1px solid #3d4680;border-radius:7px;overflow:hidden}
.hpfill{height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9a76);transition:width .3s;border-radius:7px}
#hp-text{font-size:11px;margin-top:2px;color:#9fb0e8}
#enemy-debuffs{margin-top:3px;min-height:0}
.st-icons{display:flex;gap:5px;flex-wrap:wrap}
.st-ico{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold;border:1px solid;line-height:1.3}
.st-ico .n{font-size:10px;opacity:.9;font-weight:normal}
.st-ico.bad{background:#3a1240;color:#b88aff;border-color:#7d4de0}
.st-ico.good{background:#3a2e10;color:#ffd54f;border-color:#ffd54f88}
.st-ico.neutral{background:#12203a;color:#9ad8ff;border-color:#4d8ae288}
#enemy-placements{display:flex;gap:4px;flex-wrap:wrap;min-height:48px;padding:5px;background:#0d1128aa;border:1px solid #2c3560;border-radius:8px}
.placement{width:74px;height:44px;border-radius:6px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.placement.atk{color:#ff5d6c;border-color:#c04658;background:linear-gradient(165deg,#3a1218,#1a0c10)}
.placement.atk .pl{font-size:9px;color:#9fb0e8}
.placement.atk .pp{font-size:16px}
.placement.st-w{color:#b88aff;border-color:#7d4de0;background:linear-gradient(165deg,#2a1240,#160c20);font-size:10px}
.placement.st-b{color:#ffd54f;border-color:#ffd54f;background:linear-gradient(165deg,#3a2e10,#1a1408);font-size:10px}
#mid{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.lane{flex:1;display:flex;align-items:center;border-radius:8px;background:linear-gradient(90deg,#ffffff05,#ffffff0a 50%,#ffffff05);border:1px solid #ffffff15;padding:0 10px;min-height:0;cursor:pointer;transition:background .15s,border-color .15s}
.lane:hover{background:linear-gradient(90deg,#ffffff0a,#ffffff18 50%,#ffffff0a);border-color:#ffffff30}
.lane.win{background:linear-gradient(90deg,#5dff7a15,#5dff7a30 50%,#5dff7a15);border-color:#5dff7a}
.lane.lose{background:linear-gradient(90deg,#ff5d6c15,#ff5d6c30 50%,#ff5d6c30);border-color:#ff5d6c}
.lane.cov,.lane.win.cov,.lane.lose.cov{box-shadow:inset 0 0 26px #4d8ae24d;border-color:#4d8ae2cc}
.lane-name{width:44px;flex:none;text-align:center;font-size:17px;font-weight:bold;text-shadow:0 0 8px currentColor}
.lane-body{flex:1;display:flex;gap:6px;align-items:center}
.slot{width:62px;height:44px;border:1.5px dashed #5d6ba0;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#5d6ba0;flex-shrink:0}
.slot.def{color:#9ad8ff;border-color:#4d8ae2;background:#12203a;font-weight:bold;font-size:14px}
.slot.atkc{color:#ff9a8a;border-color:#ff5d6c;background:#2a1220;font-weight:bold;font-size:14px}
.ldmg{font-size:11px;color:#ff7a7a;padding:0 4px;flex-shrink:0}
#bottom{flex:0 0 30%;display:flex;flex-direction:column;padding:6px 14px 8px;border-top:1px solid #2c3560;background:linear-gradient(0deg,#0d1128,transparent)}
#p-status{display:flex;gap:6px;font-size:11px;color:#9fb0e8;padding-bottom:3px;align-items:center;flex-wrap:wrap}
#hp-big{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:2px}
#hp-big .hicon{font-size:16px;flex:none}
#hp-big .bar{flex:1;height:18px;background:#20264a;border:1.5px solid #ff5d6c88;border-radius:9px;overflow:hidden;position:relative}
#hp-big .fill{height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9a76);transition:width .3s}
#hp-big .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000}
#p-status .tag{padding:2px 7px;border-radius:5px}
.tag.hp{background:#3a1220;color:#ff9a8a}
.tag.gold{background:#3a2e10;color:#ffd54f}
.tag.vol{background:#3a1218;color:#ff9a8a}
.tag.block{background:#12203a;color:#9ad8ff}
.tag.metal{background:#12203a;color:#9ad8ff}
.tag.barricade{background:#2a1240;color:#b88aff}
#hand-row{display:flex;gap:8px;align-items:center;justify-content:center;flex:1;min-height:0}
#hand{display:flex;gap:7px;flex:1;justify-content:center;align-items:center;overflow-x:auto}
.card{width:80px;height:104px;flex-shrink:0;border-radius:9px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;transition:transform .1s;position:relative;padding:3px}
.card:active{transform:scale(.95)}
.card.sel{transform:translateY(-10px);box-shadow:0 0 16px #ffd54f88}
.card.dis{opacity:.35;cursor:default}
.card .cn{font-size:12px;text-align:center;line-height:1.15}
.card .cc{font-size:10px;position:absolute;top:3px;right:5px;color:#ffd54f}
.card .cd{font-size:9px;color:#9fb0e8;text-align:center;margin-top:3px;line-height:1.2}
.card.attack{color:#ff9a8a;border-color:#ff5d6c;background:linear-gradient(165deg,#3a1218,#1a0c10)}
.card.defense{color:#9ad8ff;border-color:#4d8ae2;background:linear-gradient(165deg,#1a2042,#0d1128)}
.card.skill{color:#9de8a8;border-color:#4db86a;background:linear-gradient(165deg,#12301a,#0a1810)}
.card.power{color:#ffd54f;border-color:#c9a227;background:linear-gradient(165deg,#3a2e10,#1a1408)}
.card.curse{color:#888;border-color:#555;background:#16161a}
.card.up{box-shadow:inset 0 0 0 1.5px #ffd54f88}
#ctrl-row{display:flex;gap:10px;align-items:center;justify-content:center;padding-top:5px}
#energy{font-size:18px;color:#ffd54f;font-weight:bold}
.btn{padding:5px 16px;background:#232b4d;border:1px solid #4a568f;border-radius:8px;color:#dfe6ff;font-size:12px;cursor:pointer}
.btn.gold{background:linear-gradient(160deg,#a37c1c,#6d5210);border-color:#ffd54f;color:#fff6d8;font-weight:bold}
.btn.red{background:#3a1218;border-color:#ff5d6c;color:#ff9a8a}
.btn:disabled{opacity:.3;cursor:default}
#pile-info{font-size:10px;color:#8f9ccf}

/* ===== MODAL ===== */
#modal{position:absolute;inset:0;background:#07091eee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;padding:30px}
#modal.on{display:flex}
#m-title{font-size:30px;font-weight:900;letter-spacing:3px}
#m-body{color:#c9d4f5;font-size:14px;line-height:1.9;text-align:center;max-width:800px}
#m-body b{color:#ffd54f}
#m-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#m-cards{display:flex;gap:10px}
.mcard{cursor:pointer}
.mcard:hover{transform:translateY(-6px)}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#232b4dee;border:1px solid #ffd54f88;color:#ffe9b8;padding:8px 22px;border-radius:8px;font-size:14px;z-index:120;display:none}
#toast.on{display:block}
#btn-ult.ult-ready{background:linear-gradient(160deg,#a37c1c,#6d5210);border-color:#ffd54f;color:#fff6d8;font-weight:bold;animation:ultpulse 1s infinite}
@keyframes ultpulse{50%{box-shadow:0 0 18px #ffd54faa}}
#ult-ov{position:absolute;inset:0;background:radial-gradient(600px 400px at 50% 45%,#ff5d6c33,#07091ecc 70%);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:110}
#ult-ov.on{display:flex}
#ult-ov .u1{font-size:40px;font-weight:900;letter-spacing:4px;color:#ffd54f;text-shadow:0 0 24px #ff5d6c}
#ult-ov .u2{font-size:15px;color:#ffe9b8}
</style>
</head>
<body>
<div id="stage"><div id="app">

<div id="map-screen">
  <div id="map-title">🗺 第一幕 · 声之原野 · 铁音武士</div>
  <div id="map-stats"></div>
  <div id="map-layers"></div>
</div>

<div id="battle-screen">
  <div id="top">
    <div id="enemy-row">
      <div id="enemy-face">🎵</div>
      <div id="enemy-info">
        <div id="enemy-name"></div>
        <div class="hpbar"><div class="hpfill" id="ehp-fill"></div></div>
        <div id="hp-text"></div>
        <div id="enemy-debuffs"></div>
      </div>
    </div>
    <div id="enemy-placements"></div>
  </div>
  <div id="mid"><div id="lanes"></div></div>
  <div id="bottom">
    <div id="p-status"></div>
    <div id="hand-row">
      <div id="pile-info"></div>
      <div id="hand"></div>
      <button class="btn gold" id="btn-end">结束回合 ▶</button>
    </div>
    <div id="ctrl-row">
      <div id="energy">♪ 3/3</div>
      <button class="btn" id="btn-ult">💥 0/12</button>
      <button class="btn" id="btn-replay">🔊 重听</button>
      <button class="btn" id="btn-clear">↺ 收回</button>
    </div>
  </div>
</div>

<div id="modal">
  <div id="m-title"></div>
  <div id="m-body"></div>
  <div id="m-cards"></div>
  <div id="m-btns"></div>
</div>
<div id="ult-ov"><div class="u1">💥 高潮爆发！</div><div class="u2" id="ult-info"></div></div>
<div id="toast"></div>

</div></div>
<script>
"use strict";
/* ================= V20 第一幕 · 铁音武士 · 单文件版 =================
 * 09-12 大爷 19:54 拍板：第一张地图，战士流派，小怪+地图+Boss，模仿 StS 卡牌节奏
 * (抽5张/3♪能量/牌库循环/升级/商店/篝火/构筑筛选) */

const LANES=['do','re','mi','fa','sol','la','si'];
const FREQ=[262,294,330,349,392,440,494];
const P_MAXHP=80;
const ORG_MAX=12, MOAN_FILES=15; // 13:12 大爷:防住攻击计数→满格放拼接呻吟大招(湘菲15段拾音)

/* ---------- 卡牌定义 ---------- */
const CARDS={
  hammer:{n:'重音锤',t:'attack',cost:1,atk:8,d:'攻击 8',up:{atk:11,d:'攻击 11'}},
  wall:{n:'音壁',t:'defense',cost:1,def:5,d:'音盾 5 · 盖相邻3道',up:{def:8,d:'音盾 8 · 盖相邻3道'}},
  solo:{n:'铁壁',t:'defense',cost:1,def:12,d:'音盾 12 · 仅这一道',up:{def:16,d:'音盾 16 · 仅这一道'},cover:'single'},
  parion:{n:'奇偶音障',t:'defense',cost:1,def:3,d:'音盾 3 · 盖全部同奇偶道',up:{def:5,d:'音盾 5 · 盖同奇偶道'},cover:'parity'},
  triscale:{n:'三连音',t:'attack',cost:2,atk:4,d:'连打相邻3道 各4+音量 · 自成和弦',up:{atk:6,d:'连打3道 各6+音量 · 自成和弦'},span:true},
  twin:{n:'双锤连音',t:'attack',cost:1,atk:5,multi:2,d:'攻击 5×2 段',up:{atk:7,d:'攻击 7×2 段'}},
  cry:{n:'战吼',t:'skill',cost:0,d:'本回合攻击牌 +2 点',up:{d:'本回合攻击牌 +3 点',bonus:3},bonus:2},
  inflame:{n:'音量凝聚',t:'power',cost:1,d:'音量 +2 (攻击牌永久加成)',up:{vol:3,d:'音量 +3'},vol:2},
  crack:{n:'音膜震裂',t:'skill',cost:0,d:'敌人音膜破损 2 回合 (受伤+50%)',up:{turns:3,d:'音膜破损 3 回合'},turns:2},
  metal:{n:'金属音甲',t:'power',cost:1,d:'每回合末 +3 音盾',up:{val:4,d:'每回合末 +4 音盾'},val:3},
  blood:{n:'血脉鼓动',t:'skill',cost:0,d:'失 3 HP，抽 2 张',up:{draw:3,d:'失 3 HP 抽 3 张'},draw:2},
  insight:{n:'弱点洞察',t:'skill',cost:0,d:'敌人有攻击意图时音量 +3',up:{vol:4,d:'音量 +4'},vol:3},
  slam:{n:'音浪崩击',t:'attack',cost:1,d:'伤害 = 当前音盾值',up:{cost:0,d:'(♪0) 伤害 = 音盾值'},slam:true},
  barricade:{n:'壁垒音墙',t:'power',cost:3,d:'音盾回合末不再清空',up:{cost:2,d:'(♪2) 音盾不清空'}},
  reaper:{n:'狂暴终乐',t:'attack',cost:2,d:'全体 5+音量 伤害，吸血 50%',up:{atk:7,d:'全体 7+音量 吸血'},atk:5,reaper:true},
  whirl:{n:'无双回旋',t:'attack',cost:0,d:'消耗全部♪：5×段 跨道攻击',up:{atk:7,d:'消耗全部♪：7×段'},atk:5,whirl:true},
  daze:{n:'喘息音符',t:'curse',cost:0,d:'无法打出',unplayable:true},
  echo:{n:'战意残响',t:'skill',cost:0,d:'音量 +1，消耗',up:{vol:2,d:'音量 +2 消耗'},vol:1,exhaust:true},
};
function mkCard(id,up=false){const b=CARDS[id];return{id,up:up||(b&&false),...b,...(up?b.up:{}),uid:Math.random().toString(36).slice(2,8)}}

/* ---------- 怪物定义（怪物表精选）---------- */
const MONSTERS={
  louse:{n:'小谱号·音符虱',e:'🐛',hp:60,sh:0,pool:[{t:'atk',min:2,max:4,c:1}]},
  slime:{n:'节拍史莱姆·中',e:'🟢',hp:110,sh:0,pool:[{t:'atk',min:3,max:5,c:2}]},
  star:{n:'星尘精灵',e:'✨',hp:90,sh:5,pool:[{t:'atk',min:4,max:6,c:2}],hideNames:2},
  snow:{n:'雪晶人偶',e:'❄️',hp:100,sh:5,pool:[{t:'atk',min:6,max:6,c:1}],status:'weak',statusP:.5},
  pup:{n:'鼓点幼犬',e:'🐶',hp:95,sh:0,pool:[{t:'atk',min:2,max:2,c:4}]},
  frog:{n:'蓝调青蛙',e:'🐸',hp:105,sh:0,pool:[{t:'atk',min:4,max:6,c:1}],status:'weak',statusP:.7},
  bear:{n:'大提琴熊',e:'🐻',hp:150,sh:5,charge:true,pool:[{t:'atk',min:10,max:12,c:1}]},
  metro:{n:'节拍器骑士',e:'⏱',hp:135,sh:8,cycle:[4,6,9],pool:[{t:'atk',min:4,max:4,c:1}]},
  worm:{n:'巨型音波蠕虫',e:'🪱',hp:240,sh:0,elite:true,pool:[{t:'atk',min:2,max:2,c:5}]},
  golem:{n:'断弦魔像',e:'🗿',hp:220,sh:20,elite:true,reflect:8,pool:[{t:'atk',min:8,max:8,c:1}]},
  tyrant:{n:'铜管暴君',e:'🎺',hp:400,sh:25,boss:true,pool:[{t:'atk',min:6,max:11,c:2}]},
};
const NORMAL_POOL=['louse','slime','star','snow','pup','frog','bear','metro'];
const ELITE_POOL=['worm','golem'];

/* ---------- 全局状态 ---------- */
let S=null;
function newRun(){
  S={
    screen:'map',hp:P_MAXHP,gold:99,floor:0,
    org:0,moanChain:[], // 13:12 大爷:高潮计数器(跨战斗攒)+呻吟链(拼卡增长)
    deck:[],  // 所有卡
    // 地图
    layers:[],curLayer:0,reachable:[],
    // 战斗
    bt:null,
  };
  // 初始卡组 StS 式
  for(let i=0;i<4;i++)S.deck.push(mkCard('hammer'));
  for(let i=0;i<2;i++)S.deck.push(mkCard('wall'));
  S.deck.push(mkCard('solo'));
  S.deck.push(mkCard('parion'));
  S.deck.push(mkCard('twin'));
  S.deck.push(mkCard('cry'));
  genMap();
}
function genMap(){
  // 15 层: 1战斗 2战 3战/商 4战/精英 5事件 6战/精 7商/宝 8篝火 9战/精 10事件/战 11宝/商 12精/战 13战 14篝火 15Boss
  const T={F:'⚔️战斗',E:'💀精英',S:'🛒商店',C:'🔥篝火',V:'❓事件',B:'🎁宝箱',X:'👑Boss'};
  const plan=[
    ['F'],['F'],['F','S'],['F','E'],['V','F'],['F','E'],['S','B2'],['C'],
    ['F','E'],['V','F'],['B1','S'],['E','F'],['F'],['C'],['X']
  ];
  S.layers=plan.map((row,li)=>row.map((t,i)=>({
    t:t==='B1'||t==='B2'?'B':t, done:false, li, ni:i,
    key:t
  })));
}

/* ---------- 地图渲染 ---------- */
const NODE_ICON={F:'⚔️',E:'💀',S:'🛒',C:'🔥',V:'❓',B:'🎁',X:'👑'};
const NODE_NAME={F:'战斗',E:'精英',S:'商店',C:'篝火',V:'事件',B:'宝箱',X:'Boss'};
function renderMap(){
  document.getElementById('map-screen').classList.add('on');
  document.getElementById('battle-screen').classList.remove('on');
  document.getElementById('map-stats').innerHTML=
    `❤️ HP <b>${S.hp}</b>/${P_MAXHP} · 💰 <b>${S.gold}</b> · 🃏 <b>${S.deck.length}</b> 张 · 第 <b>${S.curLayer+1}</b>/15 层<br>⚔️ 战士天赋：多余防御留存为备用盾（维持 1 回合） · 💥 大招链 ${S.moanChain.length} 段（一发 ${ultDmg()} 伤 · 计数 ${S.org}/${ORG_MAX}）`;
  const el=document.getElementById('map-layers');el.innerHTML='';
  S.layers.forEach((row,li)=>{
    const div=document.createElement('div');div.className='map-layer';
    row.forEach(node=>{
      const b=document.createElement('div');
      let cls='node';
      if(node.t==='X')cls+=' boss';
      if(node.t==='E')cls+=' elite';
      if(node.done)cls+=' done';
      if(li===S.curLayer&&!node.done)cls+=' next';
      if(li>S.curLayer)cls+=' locked';
      b.className=cls;
      b.innerHTML=`<div class="ni">${NODE_ICON[node.t]}</div><div>${NODE_NAME[node.t]}</div>`;
      if(li===S.curLayer&&!node.done){
        b.onclick=()=>enterNode(node);
      }
      div.appendChild(b);
    });
    el.appendChild(div);
  });
}

/* ---------- 节点进入 ---------- */
function enterNode(node){
  node.done=true;
  if(node.t==='F'||node.t==='E'||node.t==='X'){startBattle(node.t)}
  else if(node.t==='C')showCamp();
  else if(node.t==='S')showShop();
  else if(node.t==='B')showChest();
  else if(node.t==='V')showEvent();
}

/* ---------- 音频 ---------- */
let AC=null;
function au(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,when=0,dur=.4){const c=au(),t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05)}
document.addEventListener('pointerdown',()=>au(),{once:true});

/* ---------- 战斗 ---------- */
function pickMonster(kind){
  if(kind==='X')return MONSTERS.tyrant;
  if(kind==='E')return MONSTERS[ELITE_POOL[Math.floor(Math.random()*ELITE_POOL.length)]];
  return MONSTERS[NORMAL_POOL[Math.floor(Math.random()*NORMAL_POOL.length)]];
}
function startBattle(kind){
  const m=pickMonster(kind);
  S.bt={
    m,eHP:m.hp,eMax:m.hp,eBlock:m.sh||0,vuln:0, // vuln=音膜破损回合数
    weakN:0,buffN:0, // 12:03 大爷:状态牌要可见图标(玩家被削弱/敌人增强,各持续1回合)
    turn:0,placements:[],picks:{},
    vol:0,block:0,metal:0,barricade:false,tempAtk:0,reserve:0,
    energy:3,maxE:3,
    draw:[],hand:[],discard:[],exhaust:[],
    charging:0,cycleIdx:0,reflect:m.reflect||0,
    over:false,
  };
  // 洗牌
  S.bt.draw=shuffle(S.deck.map(c=>({...c})));
  drawCards(5);
  S.screen='battle';
  enemyTurn();
  renderBattle();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawCards(n){
  for(let i=0;i<n;i++){
    if(S.bt.draw.length===0){
      if(S.bt.discard.length===0)break;
      S.bt.draw=shuffle(S.bt.discard);S.bt.discard=[];
    }
    S.bt.hand.push(S.bt.draw.pop());
  }
}
function enemyTurn(){
  const b=S.bt,m=b.m;
  b.turn++;
  b.placements=[];b.picks={};b.tempAtk=0;
  // 注意:音盾清空已移到 endTurn 结算后(金属音甲需要在清空后累积),这里不清
  // 敌方回盾
  if(m.sh)b.eBlock=m.sh;
  if(m.id==='metro')b.eBlock=m.sh; // 简化
  // 音膜破损递减
  if(b.vuln>0)b.vuln--;
  // 出招
  const atkCount=3+Math.floor(Math.random()*3); // 3-5
  if(m.charge&&b.turn%2===0){
    // 大提琴熊: 偶数回合蓄力不出招
    b.placements.push({type:'charge'});
  }else if(m.boss&&b.turn%4===0){
    // 铜管暴君: 每4回合全场炮
    for(let i=0;i<5;i++){const lane=Math.floor(Math.random()*7);b.placements.push({type:'atk',lane,pts:5})}
  }else if(m.cycle){
    const pts=m.cycle[b.cycleIdx%3];b.cycleIdx++;
    const c=2+Math.floor(Math.random()*2);
    for(let i=0;i<c;i++){let lane=Math.floor(Math.random()*7);b.placements.push({type:'atk',lane,pts})}
  }else{
    const mv=m.pool[0];
    const c=mv.c||atkCount;
    const lanes=[];
    for(let i=0;i<c;i++){
      let lane=Math.floor(Math.random()*7);
      const pts=mv.min+Math.floor(Math.random()*(mv.max-mv.min+1));
      b.placements.push({type:'atk',lane,pts});
    }
  }
  // 状态牌: 大爷拍板每回合必有(19:19) 但战斗里改成低频更合理 → 折中: 有status字段的怪50-70%出
  if(m.status&&Math.random()<(m.statusP||0.5)){
    const lane=Math.floor(Math.random()*7);
    b.placements.push({type:'status',lane,st:m.status});
  }
  if(m.boss&&Math.random()<0.4){ // boss 常出增强
    const lane=Math.floor(Math.random()*7);
    b.placements.push({type:'status',lane,st:'buff'});
  }
  // 重抽能量
  b.energy=b.maxE;
  // 播音
  const atks=b.placements.filter(p=>p.type==='atk');
  atks.forEach((p,i)=>{if(i<6){tone(FREQ[p.lane],i*.45,.4)}});
}
function renderBattle(){

    // 跨道音壁覆盖高亮(按每张牌自己的覆盖形状)
    let hasCov=false;
    for(let j=0;j<7;j++){const pj=b.picks[j];if(pj&&(pj.cards||[]).some(cd=>(cd.cov||[j]).includes(i))){hasCov=true;break}}
    let cls='lane';
    if(hasCov)cls+=' cov';

    const slot=pk.a>0?`<div class="slot atkc">⚔×${pk.a}</div>`:(pk.d>0?`<div class="slot def">🛡×${pk.d}</div>`:`<div class="slot">放牌</div>`);
    const dmg=atkPts>0?`<div class="ldmg">-${Math.max(0,atkPts-covered)}</div>`:'';
    html+=`<div class="${cls}" data-l="${i}"><div class="lane-name">${b.m.hideNames?'·':LANES[i]}</div><div class="lane-body">${slot}${dmg}</div></div>`;
  }

  // 玩家状态: 大血条 + 状态图标行(12:03 大爷:打了状态牌要有图标,放血条下头)
  const pst=[];
  if(b.vol>0)pst.push(`<span class="st-ico good">🔊<span class="n">音量 +${b.vol}</span></span>`);
  if(b.weakN>0)pst.push(`<span class="st-ico bad">⇩<span class="n">削弱×${b.weakN}·我攻-30%</span></span>`);

  if(S.moanChain.length>0)pst.push(`<span class="st-ico neutral">🔗<span class="n">呻吟链 ${S.moanChain.length} 段·一发 ${ultDmg()}</span></span>`);
  document.getElementById('p-status').innerHTML=

    `<div class="st-icons" style="margin:2px 0 3px">${pst.join('')}</div>`+
    `<span class="tag gold">💰 ${S.gold}</span>`;

  const bu=document.getElementById('btn-ult');

  document.getElementById('pile-info').textContent=`牌库 ${b.draw.length} | 弃 ${b.discard.length}${b.exhaust.length?' | 烧 '+b.exhaust.length:''}`;

  const h=document.getElementById('hand');

    if(b.energy<cost||c.unplayable)cls+=' dis';
    return`<div class="${cls}" data-i="${i}"><div class="cc">♪${cost}</div><div class="cn">${c.n}${c.up?'⁺':''}</div><div class="cd">${c.d}</div></div>`;

}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1600)}
// 12:03 大爷:防御牌连续防3条音阶 → 放置轨为中心盖住相邻3道(边缘向内延伸)
function covLanes(c){return c<=0?[0,1,2]:c>=6?[4,5,6]:[c-1,c,c+1]}

function placeCard(lane){
  const b=S.bt;const c=b.hand[S.selCard];
  if(!c)return;
  // 花能量移牌
  b.energy-=c.cost;
  b.hand.splice(S.selCard,1);
  if(c.exhaust)b.exhaust.push(c);else b.discard.push(c);
  S.selCard=null;
  // 效果
  if(c.t==='defense'){
    // 12:29 大爷:防御牌分覆盖形状 — 单道厚防(solo)/相邻三道(wall)/全部同奇偶道(parion)
    const cov = c.cover==='single' ? [lane]
      : c.cover==='parity' ? [0,1,2,3,4,5,6].filter(L=>L%2===lane%2)
      : covLanes(lane);
    for(const L of cov){
      if(!b.picks[L])b.picks[L]={d:0,a:0,cards:[]};
      b.picks[L].d++;b.picks[L].cards.push({def:c.def,cov:cov.slice()});
    }
    b.block+=c.def; // 也进音盾池(只加1次保slam/备用盾平衡)
    toast(`🛡 盖住 ${cov.map(l=>LANES[l]).join('-')}`);
  }else if(c.t==='attack'){
    if(!b.picks[lane])b.picks[lane]={d:0,a:0,cards:[]};
    if(!c.span)b.picks[lane].a++; // span 牌自己逐道计数,避免中心轨双计(目验抓出)
    // 12:29 大爷:三连音 — 连续音轨攻击牌,相邻3道各打一次,自动构成和弦
    if(c.span){
      const cov=covLanes(lane);
      for(const L of cov){
        if(!b.picks[L])b.picks[L]={d:0,a:0,cards:[]};
        b.picks[L].a++;
        let dm=(c.atk||0)+b.vol+b.tempAtk;
        if(b.vuln>0)dm=Math.floor(dm*1.5);
        if(b.weakN>0)dm=Math.max(1,Math.floor(dm*Math.max(.4,1-.3*b.weakN)));
        dealToEnemy(dm,{t:'attack'});
      }
      toast(`🎵 三连音扫过 ${cov.map(l=>LANES[l]).join('-')}！`);
      renderBattle();
      return;
    }
    // 攻击牌直接结算对敌伤害(音量加成+音膜)
    let dmg=(c.atk||0)+b.vol+b.tempAtk;
    if(c.multi)dmg=(c.atk||0)+b.vol; // 简化双段
    if(c.slam)dmg=b.block+b.vol; // 音浪崩击=音盾值
    if(c.whirl){ // 无双回旋:耗尽全部♪,每♪一段
      const seg=b.energy+1;b.energy=0;
      dmg=(c.atk||5)+b.vol;
      if(b.vuln>0)dmg=Math.floor(dmg*1.5);
      dealToEnemy(dmg*seg,c);
      toast(`🌀 无双回旋 ×${seg} 段！`);
      renderBattle();
      return;
    }
    if(b.vuln>0)dmg=Math.floor(dmg*1.5);
    if(b.weakN>0)dmg=Math.max(1,Math.floor(dmg*Math.max(.4,1-.3*b.weakN)));
    dealToEnemy(dmg,c);
  }else if(c.t==='skill'){
    if(c.id==='cry')b.tempAtk=c.bonus||2;
    if(c.id==='crack')b.vuln=c.turns||2;
    if(c.id==='blood'){S.hp=Math.max(1,S.hp-3);drawCards(c.draw||2)}
    if(c.id==='insight'){
      const hasAtk=b.placements.some(p=>p.type==='atk');
      if(hasAtk){b.vol+=(c.vol||3);toast('看破！音量+'+(c.vol||3))}else{toast('敌人没攻击意图，白唱了');}
    }
    if(c.id==='echo'){b.vol+=(c.vol||1)}
  }else if(c.t==='power'){
    if(c.id==='inflame')b.vol+=(c.vol||2);
    if(c.id==='metal')b.metal+=(c.val||3);
    if(c.id==='barricade')b.barricade=true;
  }
  renderBattle();
}
function dealToEnemy(dmg,card){
  const b=S.bt;
  // 简化: 敌方盾先挡
  if(b.eBlock>0){const abs=Math.min(b.eBlock,dmg);b.eBlock-=abs;dmg-=abs}
  b.eHP=Math.max(0,b.eHP-dmg);
  // 吸血
  if(card&&card.reaper&&dmg>0){S.hp=Math.min(P_MAXHP,S.hp+Math.ceil(dmg/2))}
  // 反伤
  if(b.reflect>0&&card&&card.t==='attack'){S.hp=Math.max(1,S.hp-Math.min(b.reflect,5))}
  if(b.eHP<=0){b.over=true;setTimeout(()=>battleWin(),600)}
  renderBattle();
}

/* ---------- 呻吟大招(13:12 大爷:防住攻击计数→满格拼接高潮爆发) ---------- */
function ultDmg(){return 12+8*S.moanChain.length}
const moanCache={};
async function loadMoan(n){
  if(moanCache[n])return moanCache[n];
  const r=await fetch('audio/'+String(n).padStart(2,'0')+'.m4a');
  moanCache[n]=await au().decodeAudioData(await r.arrayBuffer());
  return moanCache[n];
}
function playSingleMoan(n){loadMoan(n).then(buf=>{const c=au(),src=c.createBufferSource(),g=c.createGain();src.buffer=buf;g.gain.value=.9;src.connect(g);g.connect(c.destination);src.start()}).catch(()=>toast('音频加载失败'))}
async function playMoanChain(){
  const c=au();
  if(!S.moanChain.length){[0,4,7,12].forEach((st,i)=>tone(FREQ[0]*Math.pow(2,st/12),i*.12,.5));return .9}
  let t=c.currentTime+.05,total=0;
  for(const n of S.moanChain){
    const buf=await loadMoan(n);
    const src=c.createBufferSource(),g=c.createGain();
    src.buffer=buf;g.gain.value=.9;src.connect(g);g.connect(c.destination);
    src.start(t);t+=buf.duration;total+=buf.duration;
  }
  return total;
}
function ultOverlay(on,info){
  const o=document.getElementById('ult-ov');
  document.getElementById('ult-info').innerHTML=info||'';
  o.classList.toggle('on',!!on);
}
let ultLock=false;
async function fireUlt(){
  const b=S.bt;
  if(!b||b.over||ultLock||S.org<ORG_MAX)return;
  ultLock=true;
  const dmg=ultDmg();
  S.org=0;
  document.getElementById('btn-ult').disabled=true;
  ultOverlay(true,`🔗 ${S.moanChain.length} 段呻吟链 · <b style="color:#ff9a8a">${dmg}</b> 点伤害`);
  const dur=await playMoanChain();
  setTimeout(()=>{
    dealToEnemy(dmg,{t:'skill'}); // skill=不吃反伤不吸血,纯爆发
    ultOverlay(false);
    ultLock=false;
    renderBattle();
  },Math.max(400,dur*1000-200));
}

/* ---------- 结束回合 ---------- */
function endTurn(){
  const b=S.bt;if(b.over)return;
  // 和弦判定: 相邻3道都有攻击牌 → ×2 追加
  const lanesWith=[];
  for(let i=0;i<7;i++){const pk=b.picks[i];if(pk&&pk.a>0)lanesWith.push(i)}
  let chord=0;
  for(let i=0;i<5;i++){if(lanesWith.includes(i)&&lanesWith.includes(i+1)&&lanesWith.includes(i+2)){chord++}}
  if(chord>0){const bonus=chord*8*(b.vol+2);dealToEnemy(bonus,{t:'attack'});toast(`🎵 和弦共鸣 ×${chord}！追伤 ${bonus}`)}
  // 玩家受击: 每道未挡部分
  let dmgTaken=0;
  let blocked=0;
  for(let i=0;i<7;i++){
    const atk=b.placements.filter(p=>p.type==='atk'&&p.lane===i);
    const atkPts=atk.reduce((s,p)=>s+p.pts,0);
    const pk=b.picks[i];const covered=pk?((pk.cards||[]).reduce((s,c)=>s+(c.def||5),0)):0;
    const leak=Math.max(0,atkPts-covered);
    if(atkPts>0&&leak===0)blocked+=atk.length; // 全挡住的轨,攻击点全数计数(13:12 大爷)
    dmgTaken+=leak;
  }
  if(blocked>0){
    const was=S.org;
    S.org=Math.min(ORG_MAX,S.org+blocked);
    if(S.org>=ORG_MAX&&was<ORG_MAX)toast('💥 计数器满了！可以放高潮大招！');
    else toast(`🛡 防住 ${blocked} 个攻击 · 计数 ${S.org}/${ORG_MAX}`);
  }
  // 削弱/增强状态牌结算(12:03 改版:挂成持续1回合的状态,带图标显示在两侧血条下)
  // 上回合挂的增强本回合生效:敌伤×(1+30%×层)
  if(b.buffN>0){dmgTaken=Math.floor(dmgTaken*(1+.3*b.buffN));toast(`⇧ 敌人增强中!本回合伤害 +30%`)}
  // 音盾抵扣
  if(b.block>0){const abs=Math.min(b.block,dmgTaken);b.block-=abs;dmgTaken-=abs}
  // ⚔️战士天赋: 备用盾抵扣漏伤(上回合留存,只维持这一回合)
  let reserveUsed=0;
  if(dmgTaken>0&&b.reserve>0){const abs=Math.min(b.reserve,dmgTaken);b.reserve-=abs;dmgTaken-=abs;reserveUsed=abs}
  if(dmgTaken>0)S.hp=Math.max(0,S.hp-dmgTaken);
  if(reserveUsed>0)toast(`🛡 战士天赋:备用盾抵了 ${reserveUsed} 伤`)
  // 回合末:音盾清空,多余部分留存为备用盾(天赋,维持1回合);壁垒则不清;金属音甲在清空后累积
  if(!b.barricade){b.reserve=b.block;b.block=0}
  else b.reserve=0;
  if(b.metal>0)b.block+=b.metal;
  // 状态牌到期清零,再挂本回合敌方出的新状态(下回合生效,大爷09-12 18:25拍板:持续1回合)
  const hasWeak=b.placements.some(p=>p.type==='status'&&p.st==='weak');
  const hasBuff=b.placements.some(p=>p.type==='status'&&p.st==='buff');
  b.weakN=hasWeak?1:0;
  b.buffN=hasBuff?1:0;
  if(hasWeak)toast('⇩ 你被削弱了!下回合攻击牌伤害 -30%');
  if(hasBuff)toast('⇧ 敌人增强了!下回合它的攻击 +30%');
  // 弃手牌
  b.discard.push(...b.hand);b.hand=[];
  if(S.hp<=0){gameOver();return}
  if(b.eHP<=0){battleWin();return}
  // 新回合
  drawCards(5);
  enemyTurn();
  renderBattle();
}

/* ---------- 战斗胜负/奖励 ---------- */
function battleWin(){
  const b=S.bt;if(!b)return;
  const isBoss=b.m.boss,isElite=!!b.m.elite;
  const gold=10+Math.floor(Math.random()*11)+(isElite?25:0)+(isBoss?50:0);
  S.gold+=gold;
  const dropCnt=isElite?1:(Math.random()<.6?1:0); // 13:12 大爷:打完小怪概率掉呻吟声卡(Boss直接通关不碰)
  S.bt=null;
  if(isBoss){victory(gold);return}
  moanDrop(dropCnt,()=>offerCardReward(gold));
}
function moanDrop(cnt,after){
  if(!cnt){after();return}
  const n=1+Math.floor(Math.random()*MOAN_FILES);
  const cur=ultDmg(),next=cur+8;
  modal('🎵 捡到一张呻吟声卡！',
    `湘菲拾音 No.${n}（约 2.4 秒）<br>拼入大招链：一发伤害 <b>${cur}</b> → <b>${next}</b><br>当前 ${S.moanChain.length} 段 · 越拼越长，越打越痛`,
    [],[
      {t:'🎧 试听',fn:()=>{playSingleMoan(n)}},
      {t:'➕ 拼入大招',fn:()=>{S.moanChain.push(n);toast(`🔗 大招链 ${S.moanChain.length} 段！`);moanDrop(cnt-1,after)}},
      {t:'✋ 放弃',fn:()=>moanDrop(cnt-1,after)},
    ]);
}
function offerCardReward(gold){
  // 3选1加卡
  const poolIds=['hammer','wall','solo','parion','triscale','twin','cry','inflame','crack','metal','blood','insight','slam','barricade','reaper','whirl','echo'];
  const offers=[];
  const tmp=[...poolIds];
  for(let i=0;i<3;i++)offers.push(tmp.splice(Math.floor(Math.random()*tmp.length),1)[0]);
  modal(`⚔️ 战斗胜利！`,
    `获得 💰 <b>${gold}</b> 金币<br>选 1 张卡加入卡组`,
    offers.map(id=>({card:mkCard(id),fn:()=>{
      S.deck.push(mkCard(id));
      toast(`已加入 ${CARDS[id].n}`);
      nextFloor();
    }})),
    [{t:'跳过',fn:()=>nextFloor()}]
  );
}
function nextFloor(){
  closeModal();
  S.curLayer++;
  if(S.curLayer>=15){victory(0);return}
  S.screen='map';renderMap();
}
function gameOver(){
  S.bt=null;
  modal('💀 你倒下了…',`第一幕 第 ${S.curLayer+1} 层<br><br><b>铁音武士，声之原野会记住你的歌。</b>`,[],[
    {t:'重新开始',fn:()=>{newRun();closeModal();renderMap()}},
  ]);
}
function victory(gold){
  modal('👑 第一幕通关！',`铜管暴君哑火！<br>获得 💰 <b>${gold}</b> 金币<br><br>第二幕 · 情感之城 —— 敬请期待`,[],[
    {t:'再战一局',fn:()=>{newRun();closeModal();renderMap()}},
  ]);
}

/* ---------- 篝火 ---------- */
function showCamp(){
  modal('🔥 排练室','休息或练卡，二选一',[],[
    {t:`💤 休息 (回 ${Math.ceil(P_MAXHP*0.3)} HP)`,fn:()=>{S.hp=Math.min(P_MAXHP,S.hp+Math.ceil(P_MAXHP*0.3));toast('睡了个好觉');nextFloor()}},
    {t:'🎼 练卡 (升级 1 张)',fn:()=>showUpgrade()},
  ]);
}
function showUpgrade(){
  closeModal();
  const upg=S.deck.filter(c=>!c.up);
  if(!upg.length){toast('没有可升级的卡');showCamp();return}
  const byId={};upg.forEach(c=>{byId[c.id]=byId[c.id]||c});
  modal('🎼 练哪张？','升级后数值增强',Object.values(byId).map(c=>({card:c,fn:()=>{
    // 升级所有同名卡中的1张
    const i=S.deck.findIndex(x=>x.id===c.id&&!x.up);
    const base=CARDS[c.id];
    S.deck[i]={...S.deck[i],...base.up,up:true};
    toast(`${c.n} 升级！`);
    nextFloor();
  }})),[{t:'返回',fn:()=>showCamp()}]);
}

/* ---------- 商店 ---------- */
function showShop(){
  const poolIds=['inflame','crack','metal','blood','insight','slam','barricade','reaper','whirl','twin','cry','solo','parion','triscale'];
  const offers=[];
  const tmp=[...poolIds];
  for(let i=0;i<3;i++)offers.push(tmp.splice(Math.floor(Math.random()*tmp.length),1)[0]);
  const price=()=>45+Math.floor(Math.random()*31);
  const prices=offers.map(price);
  const delPrice=50;
  const render=()=>{
    modal('🛒 唱片行',`💰 <b>${S.gold}</b> 金币`,offers.map((id,i)=>({card:mkCard(id),cost:prices[i],fn:()=>{
      if(S.gold<prices[i]){toast('钱不够');return}
      S.gold-=prices[i];S.deck.push(mkCard(id));offers[i]=null;toast(`买了 ${CARDS[id].n}`);render();
    }})),[
      {t:`🗑 删卡 (${delPrice}金)`,fn:()=>{if(S.gold<delPrice){toast('钱不够');return}showDelete(delPrice)}},
      {t:'离开',fn:()=>nextFloor()},
    ]);
  };
  render();
}
function showDelete(price){
  const byId={};S.deck.forEach(c=>{byId[c.id]=byId[c.id]||c});
  modal('🗑 删哪张？',`当前 ${S.deck.length} 张`,Object.values(byId).map(c=>({card:c,fn:()=>{
    const i=S.deck.findIndex(x=>x.id===c.id);
    S.deck.splice(i,1);S.gold-=price;toast(`删掉 ${c.n}`);showShop();
  }})),[{t:'不删了',fn:()=>showShop()}]);
}

/* ---------- 宝箱 ---------- */
function showChest(){
  const g=30+Math.floor(Math.random()*21);
  S.gold+=g;
  const rare=['reaper','barricade','slam','whirl'][Math.floor(Math.random()*4)];
  modal('🎁 音盒',`箱子里有：<br>💰 <b>${g}</b> 金币 + 一张稀有卡`,[{card:mkCard(rare),fn:()=>{
    S.deck.push(mkCard(rare));toast(`获得 ${CARDS[rare].n}！`);nextFloor();
  }}],[{t:'只要金币',fn:()=>nextFloor()}]);
}

/* ---------- 事件 ---------- */
const EVENTS=[
  {t:'⛲ 声音泉',b:'清澈的泉水叮咚作响，喝一口？',opts:[
    {t:'喝一口 (回 20 HP)',fn:()=>{S.hp=Math.min(P_MAXHP,S.hp+20);toast('+20 HP');nextFloor()}},
    {t:'沐浴 (删 1 张基础卡)',fn:()=>showSimpleDelete()},
    {t:'离开',fn:()=>nextFloor()}]},
  {t:'👻 乐器的幽灵',b:'一把旧吉他的灵魂请求加入你的乐队…',opts:[
    {t:'答应 (失 8 HP，得随机稀有卡)',fn:()=>{S.hp=Math.max(1,S.hp-8);const rare=['reaper','barricade','slam','whirl'][Math.floor(Math.random()*4)];S.deck.push(mkCard(rare));toast(`幽灵赠予 ${CARDS[rare].n}！`);nextFloor()}},
    {t:'拒绝',fn:()=>nextFloor()}]},
  {t:'🎲 音速赌场',b:'庄家微笑：赌上你的钱包？',opts:[
    {t:'梭哈 (50% 金币翻倍)',fn:()=>{if(Math.random()<.5){S.gold*=2;toast('赢了！金币翻倍！')}else{S.gold=0;toast('输光了…')}nextFloor()}},
    {t:'走为上',fn:()=>nextFloor()}]},
  {t:'🎻 大师的指导',b:'路过的老乐师愿意帮你精简卡组。',opts:[
    {t:'删 1 张基础卡',fn:()=>showSimpleDelete()},
    {t:'鞠躬致谢',fn:()=>nextFloor()}]},
];
function showEvent(){
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  modal(ev.t,ev.b,[],ev.opts);
}
function showSimpleDelete(){
  const basics=S.deck.filter(c=>c.id==='hammer'||c.id==='wall');
  if(!basics.length){toast('没有基础卡可删');nextFloor();return}
  const byId={};basics.forEach(c=>{byId[c.id]=byId[c.id]||c});
  modal('🗑 删哪张基础卡？','',Object.values(byId).map(c=>({card:c,fn:()=>{
    const i=S.deck.findIndex(x=>x.id===c.id);S.deck.splice(i,1);toast(`删掉 ${c.n}`);nextFloor();
  }})),[{t:'算了',fn:()=>nextFloor()}]);
}

/* ---------- Modal ---------- */
let modalCards=[];
function modal(title,body,cards,btns){
  document.getElementById('m-title').innerHTML=title;
  document.getElementById('m-body').innerHTML=body;
  const ce=document.getElementById('m-cards');ce.innerHTML='';modalCards=cards||[];
  modalCards.forEach((mc,i)=>{
    if(!mc)return;
    const c=mc.card;
    const div=document.createElement('div');
    div.className='card mcard '+c.t;
    div.innerHTML=`<div class="cc">♪${c.cost}</div><div class="cn">${c.n}</div><div class="cd">${c.d}</div>${mc.cost!=null?`<div class="cd" style="color:#ffd54f">💰${mc.cost}</div>`:''}`;
    div.onclick=mc.fn;
    ce.appendChild(div);
  });
  const be=document.getElementById('m-btns');be.innerHTML='';
  (btns||[]).forEach(b=>{
    const btn=document.createElement('button');btn.className='btn gold';btn.textContent=b.t;btn.onclick=b.fn;
    be.appendChild(btn);
  });
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on')}

/* ---------- 控件 ---------- */
document.getElementById('btn-end').onclick=()=>endTurn();
document.getElementById('btn-ult').onclick=()=>fireUlt();
document.getElementById('btn-replay').onclick=()=>{
  if(!S.bt)return;
  S.bt.placements.filter(p=>p.type==='atk').forEach((p,i)=>{if(i<6)tone(FREQ[p.lane],i*.45,.4)});
};
document.getElementById('btn-clear').onclick=()=>{S.selCard=null;renderBattle()};

/* ---------- 启动 ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('app').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
newRun();renderMap();
</script>
