<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V21 · 负债铁匠 · 打铁听音</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0705;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none;color:#f3e9d8;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:780px;height:1280px;flex:none;transform-origin:center center;background:radial-gradient(900px 700px at 50% 30%,#2a1c10 0%,#170f09 55%,#0a0705 100%);display:flex;flex-direction:column;overflow:hidden;position:relative}
#app.frenzy{background:radial-gradient(900px 700px at 50% 30%,#3a1c08 0%,#241106 55%,#120803 100%)}
#app.frenzy::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:35;box-shadow:inset 0 0 90px 24px #ff6b2daa;animation:frpulse .5s infinite}
@keyframes frpulse{50%{box-shadow:inset 0 0 120px 34px #ff9a4dcc}}

/* ===== 顶部 HUD ===== */
#hud{flex:0 0 236px;display:flex;flex-direction:column;padding:10px 16px 6px;border-bottom:2px solid #4a3320;background:linear-gradient(180deg,#1c120a,#170f0999)}
#hud-row1{display:flex;align-items:center;gap:10px}
#debt-tag{font-size:12px;padding:3px 10px;border-radius:12px;background:#3a1218;border:1px solid #ff5d6c88;color:#ff9a8a;flex:none}
#rent-num{font-weight:bold;color:#ffd54f}
#gold-row{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:16px;font-weight:bold;color:#ffd54f}
#pot-row{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:bold;color:#7ddf6a;margin-left:14px}
#hud-row2{display:flex;align-items:flex-end;gap:12px;margin-top:7px}
#sword-info{flex:1;min-width:0}
#sword-name{font-size:18px;color:#ffe9b8;font-weight:bold;letter-spacing:1px;display:flex;align-items:center;gap:8px}
#tier-tag{font-size:11px;color:#c9a06a;border:1px solid #6a4c2a;border-radius:8px;padding:1px 8px}
#value-wrap{margin-top:4px}
#value-bar{height:14px;background:#241505;border:1.5px solid #6a4c2a;border-radius:8px;overflow:hidden;position:relative}
#value-fill{height:100%;width:0%;background:linear-gradient(90deg,#c9822a,#ffd54f);transition:width .25s;border-radius:8px}
#value-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000}
/* 充能条 */
#charge-wrap{flex:none;width:170px;display:flex;flex-direction:column;gap:3px}
#charge-label{font-size:10px;color:#c9a06a;text-align:center}
#charge-label.fz{color:#ffb84d;font-weight:bold}
#charge-bar{height:20px;background:#241505;border:1.5px solid #7a5830;border-radius:10px;overflow:hidden;display:flex}
.ch-cell{flex:1;border-right:1px solid #00000055;transition:background .15s}
.ch-cell:last-child{border-right:none}
.ch-cell.on{background:linear-gradient(180deg,#ffb84d,#ff8a2a);box-shadow:0 0 8px #ffb84d88}
.ch-cell.fz{background:linear-gradient(180deg,#fff3b0,#ffd54f);animation:frpulse .4s infinite}
#frenzy-timer{font-size:11px;color:#ffb84d;font-weight:bold;text-align:center;min-height:14px}
/* 档位概率条 */
#probs-wrap{margin-top:7px;display:flex;gap:6px;align-items:center}
#probs-label{font-size:10px;color:#c9a06a;flex:none;writing-mode:horizontal-tb}
.pbar{flex:1;height:26px;border:1px solid #4a3320;border-radius:6px;position:relative;overflow:hidden;background:#1a110a;transition:all .3s}
.pbar .pfill{position:absolute;left:0;bottom:0;width:100%;transition:height .35s}
.pbar .ptxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.15;font-weight:bold;text-shadow:0 1px 2px #000;z-index:2}
.pbar .ptxt .pct{font-size:11px}
.pbar.great .pfill{background:linear-gradient(180deg,#ffd54f66,#c9822a88)}
.pbar.great .ptxt{color:#ffd54f}
.pbar.good .pfill{background:linear-gradient(180deg,#7ddf6a55,#3a8a2a88)}
.pbar.good .ptxt{color:#a8f0a0}
.pbar.normal .pfill{background:linear-gradient(180deg,#c9c9c944,#8a8a8a66)}
.pbar.normal .ptxt{color:#d8d8d8}
.pbar.poor .pfill{background:linear-gradient(180deg,#ff5d6c55,#8a1a2688)}
.pbar.poor .ptxt{color:#ff9a8a}
#hud-row3{display:flex;gap:8px;margin-top:7px;align-items:center}
.btn{padding:5px 16px;background:#33241374;border:1px solid #7a5830;border-radius:9px;color:#f3e9d8;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#c9a06a;background:#4a332074}
.btn.gold{background:linear-gradient(160deg,#a37c1c,#6d5210);border-color:#ffd54f;color:#fff6d8;font-weight:bold}
.btn:disabled{opacity:.3;cursor:default}
#btn-help{margin-left:auto;font-size:12px;padding:3px 12px}
#acc-row{font-size:11px;color:#c9a06a;display:flex;gap:12px;align-items:center}

/* ===== 题目区 ===== */
#quiz{flex:0 0 118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-bottom:2px solid #4a3320;background:#120c0777;position:relative}
#quiz-title{font-size:13px;color:#c9a06a;letter-spacing:2px}
#slots{display:flex;gap:10px;align-items:center;justify-content:center;min-height:50px}
.qslot{width:52px;height:48px;border:2px dashed #6a4c2a;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a110a;transition:all .18s;position:relative}
.qslot.waiting{border-style:dashed}
.qslot.playing{border-color:#ffd54f;box-shadow:0 0 14px #ffd54f55;animation:qpulse .5s infinite}
.qslot.hit{border-style:solid;border-color:#7ddf6a;background:linear-gradient(165deg,#1a3012,#0d1808)}
.qslot.hit .qn{color:#a8f0a0}
.qslot.miss{border-style:solid;border-color:#ff5d6c;background:linear-gradient(165deg,#3a1218,#1a0c10);animation:shake .35s}
.qslot.miss .qn{color:#ff9a8a}
.qslot .qn{font-size:18px;font-weight:bold;color:#8a6c42}
.qslot .qsi{font-size:9px;color:#c9a06a66;margin-top:1px}
.qslot.hit .qsi,.qslot.miss .qsi{color:#c9a06a}
@keyframes qpulse{50%{box-shadow:0 0 22px #ffd54faa}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#quiz-hint{font-size:12px;color:#8a6c42;min-height:16px;transition:color .2s}
#quiz-hint.warn{color:#ff9a8a}
#quiz-hint.fz{color:#ffb84d;font-weight:bold}

/* ===== 铁砧区(音道+剑) ===== */
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#mid{flex:1;display:flex;min-height:0}
#acc-strip{flex:0 0 48px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#2a1a06,#1a1004);border-bottom:2px solid #c9a06a77}
#acc-strip .lab{font-size:15px;color:#c9a06a;letter-spacing:2px}
#acc-big{font-size:30px;color:#ffd54f;font-weight:800;text-shadow:0 0 16px #ffd54f55;font-family:inherit}
#acc-detail2{font-size:12px;color:#c9a06a}
#quench-btn{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;padding:11px 20px;font-size:18px;font-weight:bold;border-radius:14px;background:linear-gradient(160deg,#2f8fda,#1a5f9e);border:2px solid #a8dcff;color:#fff;cursor:pointer;animation:qbpulse 1.1s ease-in-out infinite;box-shadow:0 0 22px #4da3e888}
@keyframes qbpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
#left-col{width:43%;flex:none;display:flex;flex-direction:column;position:relative;border-right:2px solid #4a3320;background:linear-gradient(180deg,#150d07 0%,#0d0805 100%)}
#bucket-zone{flex:0 0 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 10px 6px;position:relative}
#bucket{width:76%;max-width:235px;flex:none;filter:drop-shadow(0 8px 14px #000a)}
#bucket-cap{font-size:12px;color:#7fb8e8;letter-spacing:1px;text-shadow:0 1px 2px #000}
#bucket-num{font-size:13px;color:#a8dcff;font-weight:600;text-shadow:0 1px 2px #000}
#bucket-water{transition:all .3s}
#bucket-water-glow{transition:all .3s}
.flydrop{position:absolute;z-index:36;pointer-events:none;font-size:19px;opacity:.95;transition:transform .55s cubic-bezier(.3,-.15,.65,1.05);text-shadow:0 2px 4px #0008}
#anvil{flex:1;display:flex;position:relative;overflow:hidden;cursor:none}
#lanes{flex:1;display:flex;flex-direction:column-reverse;padding:10px 14px 16px;gap:4px}
.lane{flex:1;display:flex;align-items:center;border-radius:9px;border:1.5px solid #ffffff10;background:linear-gradient(90deg,#ffffff04,#ffffff08 50%,#ffffff04);transition:background .12s,border-color .12s,filter .2s;position:relative;min-height:0}
.lane .ln{width:60px;flex:none;text-align:center;font-size:16px;font-weight:bold;text-shadow:0 0 8px currentColor}
.lane .lk{width:38px;flex:none;text-align:center;font-size:10px;opacity:.55}
.lane.dim{filter:brightness(.32) saturate(.4)}
.lane.cov{border-color:#ffffff28}
.lane.cov .ln{opacity:1}
.lane.flash-hit{background:linear-gradient(90deg,#5dff7a30,#5dff7a4d 50%,#5dff7a30)!important;border-color:#5dff7a!important}
.lane.flash-miss{background:linear-gradient(90deg,#ff5d6c30,#ff5d6c4d 50%,#ff5d6c30)!important;border-color:#ff5d6c!important}
/* 剑 */
#sword-zone{position:absolute;left:50%;top:0;bottom:0;width:150px;transform:translateX(-50%);pointer-events:none;z-index:5}
#sword-svg{position:absolute;left:50%;transform:translateX(-50%);transition:height .5s,top .5s;filter:drop-shadow(0 0 12px #ffb84d33)}
#sword-glow{position:absolute;left:50%;transform:translateX(-50%);width:120px;border-radius:50%;background:radial-gradient(closest-side,#ffb84d2d,transparent);pointer-events:none;transition:height .5s,top .5s}
/* 激光 */
.laser{position:absolute;left:22px;right:172px;height:2px;background:linear-gradient(90deg,transparent,#ff5d6c66 15%,#ff5d6cdd 50%,#ff5d6c66 85%,transparent);box-shadow:0 0 12px #ff5d6c88;z-index:4;pointer-events:none;transition:top .5s}
.laser::before,.laser::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 10px #ff5d6c}
.laser::before{left:24px}.laser::after{right:24px}

/* ===== 女铁匠(素材槽:H3 视频帧就位前用占位 SVG) ===== */
#girl{flex:1;width:100%;min-height:0;z-index:6;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:0 6px 8px}
#girl .gph{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;transition:transform .1s}
#girl .gph.idle{animation:gbreath 2.6s ease-in-out infinite}
#girl .gph.strike{animation:gbounce .38s ease-out}
#girl .gph.hurt{animation:ghurt .5s ease-out}
@keyframes gbreath{50%{transform:translateY(-6px) scale(1.012)}}
@keyframes gbounce{0%{transform:translateY(0)}35%{transform:translateY(-26px) rotate(-3deg)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes ghurt{0%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(2deg)}55%{transform:translateX(7px) rotate(-2deg)}80%{transform:translateX(-3px)}100%{transform:translateX(0)}}
#girl-tag{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:9px;color:#c9a06a99;background:#1a110acc;padding:1px 8px;border-radius:8px;white-space:nowrap}

/* ===== 铁锤本体(跟随鼠标) ===== */
#app{touch-action:none;cursor:none;-webkit-user-select:none;user-select:none}
#hammer{position:absolute;z-index:30;pointer-events:none;transform-origin:12% 88%;filter:drop-shadow(0 5px 9px #000c);transition:transform .05s linear,opacity .4s}
#hammer svg{display:block}
#hammer.swing{animation:mswing .22s cubic-bezier(.6,0,.9,1)}
@keyframes mswing{0%{transform:rotate(8deg)}45%{transform:rotate(-52deg) translateY(10px)}100%{transform:rotate(8deg)}}
.spark{position:absolute;font-size:15px;z-index:31;pointer-events:none;animation:sparkfly .5s ease-out forwards}
@keyframes sparkfly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.float{position:absolute;font-size:17px;font-weight:bold;z-index:32;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 1px 3px #000}
.float.plus{color:#7ddf6a}
.float.minus{color:#ff5d6c}
.float.gold{color:#ffd54f;font-size:19px}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* ===== 淬火面板 ===== */
#quench{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);width:min(94%,346px);z-index:45;display:none;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,#0e1420f2,#0a0e18f2);border:2px solid #4d8dd8aa;border-radius:16px;padding:14px 18px 16px;box-shadow:0 0 44px #4d8dd844}
#quench.on{display:flex;animation:qin .3s ease-out}
@keyframes qin{0%{opacity:0;transform:translate(-50%,-46%) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#quench-title{font-size:21px;font-weight:900;color:#bfe3ff;letter-spacing:5px;text-shadow:0 0 16px #4d8dd8aa}
#quench-sub{font-size:12px;color:#8fb8dd}
#roll-strip{display:flex;gap:8px;height:84px;position:relative}
.rslot{width:110px;height:84px;border:2px solid #4a3320;border-radius:10px;background:#1a110a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .12s;position:relative}
.rslot .rn{font-size:15px;font-weight:900}
.rslot .rm{font-size:11px;color:#c9a06a}
.rslot.great .rn{color:#ffd54f}.rslot.good .rn{color:#a8f0a0}.rslot.normal .rn{color:#d8d8d8}.rslot.poor .rn{color:#ff9a8a}
.rslot.rolling{animation:rroll .38s linear infinite}
@keyframes rroll{0%{transform:translateY(0)}50%{transform:translateY(-7px)}100%{transform:translateY(0)}}
.rslot.winner{border-color:currentColor;box-shadow:0 0 26px currentColor;transform:scale(1.13);z-index:2}
.rslot.winner.great{color:#ffd54f}.rslot.winner.good{color:#a8f0a0}.rslot.winner.normal{color:#d8d8d8}.rslot.winner.poor{color:#ff9a8a}
#quench-steam{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:34px;opacity:0;pointer-events:none}
#quench-steam.puff{animation:steampuff 1.1s ease-out}
@keyframes steampuff{0%{opacity:0;transform:translateX(-50%) translateY(8px) scale(.6)}25%{opacity:.95}100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(1.5)}}
#quench-result{font-size:19px;font-weight:900;min-height:26px}

/* ===== 遮罩层 ===== */
#overlay{position:absolute;inset:0;background:#0a0705e8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:36px;text-align:center}
#overlay.on{display:flex}
#ov-title{font-size:36px;font-weight:900;letter-spacing:4px}
#ov-title.gold{color:#ffd54f;text-shadow:0 0 30px #ffb84d88}
#ov-title.red{color:#ff5d6c;text-shadow:0 0 30px #ff5d6c66}
#ov-title.blue{color:#bfe3ff;text-shadow:0 0 30px #4d8dd8aa}
#ov-body{color:#d8c9ae;font-size:15px;line-height:1.9;max-width:560px}
#ov-body b{color:#ffd54f}
#ov-sword{font-size:60px}
#ov-btns{display:flex;gap:14px;margin-top:4px}
#toast{position:absolute;top:248px;left:50%;transform:translateX(-50%);background:#2a1c10ee;border:1px solid #ffd54f66;color:#ffe9b8;padding:8px 24px;border-radius:9px;font-size:14px;z-index:120;display:none}
#toast.on{display:block}
#forge-flash{position:absolute;inset:0;background:#ffd54f;opacity:0;z-index:40;pointer-events:none}
#forge-flash.go{animation:fflash .55s ease-out}
@keyframes fflash{12%{opacity:.55}100%{opacity:0}}
</style>
</head>
<body>
<div id="stage"><div id="app">
  <div id="hud">
    <div id="hud-row1">
      <div id="debt-tag">🏚️ 房租倒计时 <span id="rent-num">5:00</span></div>
      <div id="pot-row">💧 潜在 <span id="pot-num">0</span></div>
      <div id="gold-row"><span class="coin">🪙</span><span id="gold-num">0</span></div>
    </div>
    <div id="hud-row2">
      <div id="sword-info">
        <div id="sword-name"><span id="sword-emoji">🗡️</span><span id="sword-title">生锈匕首</span><span id="tier-tag">Tier 1/6</span></div>
        <div id="value-wrap"><div id="value-bar"><div id="value-fill"></div><div id="value-num">0</div></div></div>
      </div>
      <div id="charge-wrap">
        <div id="charge-label">超神充能</div>
        <div id="charge-bar"></div>
        <div id="frenzy-timer"></div>
      </div>
    </div>
    <div id="probs-wrap">
      <div id="probs-label">淬火档位概率</div>
      <div class="pbar great" id="pb-great"><div class="pfill"></div><div class="ptxt"><span class="nm">大成功 ×4</span><span class="pct">8%</span></div></div>
      <div class="pbar good" id="pb-good"><div class="pfill"></div><div class="ptxt"><span class="nm">成功 ×2</span><span class="pct">30%</span></div></div>
      <div class="pbar normal" id="pb-normal"><div class="pfill"></div><div class="ptxt"><span class="nm">普通 ×1</span><span class="pct">42%</span></div></div>
      <div class="pbar poor" id="pb-poor"><div class="pfill"></div><div class="ptxt"><span class="nm">失败 ×½</span><span class="pct">20%</span></div></div>
    </div>
    <div id="hud-row3">
      <button class="btn gold" id="btn-start">🔥 开始锻造</button>
      <button class="btn" id="btn-replay" disabled>🔁 重听题目</button>
      <div id="acc-row"></div>
      <button class="btn" id="btn-help">❓ 玩法</button>
    </div>
  </div>
  <div id="quiz">
    <div id="quiz-title">听音 · 按顺序敲出题目 · 敲完淬火</div>
    <div id="slots"></div>
    <div id="quiz-hint">点击「开始锻造」点火开炉</div>
  </div>
  <div id="main">
   <div id="acc-strip"><span class="lab">🎯 正确率</span><b id="acc-big">—</b><span id="acc-detail2"></span></div>
   <div id="mid">
   <div id="left-col">
    <div id="bucket-zone">
      <button id="quench-btn">🔥 淬 火</button>
      <div id="bucket-cap">💧 淬火桶 · 敲击积累水滴</div>
      <svg id="bucket" viewBox="0 0 200 230">
        <defs><clipPath id="bkc"><path d="M36,42 L32,200 Q100,222 168,200 L164,42 Q100,56 36,42"/></clipPath></defs>
        <path d="M36,42 L32,200 Q100,222 168,200 L164,42" fill="#5c3d20" stroke="#2f1f0e" stroke-width="3"/>
        <path d="M78,44 L75,214" stroke="#3f2a14" stroke-width="2" fill="none"/>
        <path d="M122,44 L125,214" stroke="#3f2a14" stroke-width="2" fill="none"/>
        <g clip-path="url(#bkc)">
          <rect id="bucket-water" x="20" y="204" width="160" height="0" fill="#2f8fda" opacity="0.88"/>
          <rect id="bucket-water-glow" x="20" y="202" width="160" height="3" fill="#a8dcff" opacity="0"/>
        </g>
        <path d="M33,110 Q100,128 167,110" fill="none" stroke="#8d949e" stroke-width="7"/>
        <path d="M31,165 Q100,183 169,165" fill="none" stroke="#8d949e" stroke-width="7"/>
        <ellipse cx="100" cy="42" rx="64" ry="13" fill="none" stroke="#8a5a2e" stroke-width="5"/>
      </svg>
      <div id="bucket-num">💧 ×<span id="bucket-drops">0</span></div>
    </div>
    <div id="girl"><div class="gph idle" id="girl-ph"></div></div>
    <div id="quench">
      <div id="quench-steam">💨💨💨</div>
      <div id="quench-title">🔥 淬 火</div>
      <div id="quench-sub">概率付诸实践…</div>
      <div id="roll-strip"></div>
      <div id="quench-result"></div>
    </div>
   </div>
   <div id="anvil">
    <div id="lanes"></div>
    <div id="laser-top" class="laser"></div>
    <div id="laser-bot" class="laser"></div>
    <div id="sword-glow"></div>
    <div id="sword-zone"><svg id="sword-svg" width="120" height="600" viewBox="0 0 120 600"></svg></div>
   </div>
   </div>

}

function clank(ok){const c=au(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(ok?1240:340,t);o.frequency.exponentialRampToValueAtTime(ok?880:180,t+.09);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.15)}
function sizzle(){ // 淬火蒸汽嘶声:白噪声+带通

 const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0);

 const g=c.createGain();g.gain.setValueAtTime(.24,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(f);f.connect(g);g.connect(c.destination);src.start(t);
}

function genQuestion(){
 const sw=SWORDS[S.tier];const pool=NOTES.slice(0,sw.span);
 const q=[];let prev=-1;
 for(let i=0;i<sw.qlen;i++){
  let idx;
  if(prev<0)idx=Math.floor(Math.random()*pool.length);
  else{const step=[-2,-1,-1,0,0,1,1,2,3][Math.floor(Math.random()*9)];idx=Math.min(pool.length-1,Math.max(0,prev+step));if(idx===prev&&Math.random()<.7)idx=Math.min(pool.length-1,Math.max(0,idx+(Math.random()<.5?1:-1)));}
  q.push(idx);prev=idx;
 }
 return q;
}

  if(S.phase==='playing'){cls+= i===S.pos?' playing':' waiting'}
  else if(i<S.pos){cls+= (S.marks&&S.marks[i]==='miss')?' miss':' hit';inner=nt.n}
  else if(S.revealed){cls+=' hit';inner=nt.n}
  d.className=cls;
  const c=colorOf(nt.n);
  const shown=cls.includes('hit')||cls.includes('miss');
  d.innerHTML=`<div class="qn" style="color:${shown?c:'#8a6c42'}">${shown?nt.n:inner}</div><div class="qsi">${i+1}</div>`;
  box.appendChild(d);
 });
}
function playQuestion(){
 S.phase='playing';S.pos=0;S.revealed=false;S.marks=[];hud();renderSlots();
 S.q.forEach((ni,i)=>tone(midiF(NOTES[ni].m),.16+i*.46,.4));
 const total=.16+S.q.length*.46+.3;
 setTimeout(()=>{if(S.phase!=='playing')return;S.phase='input';renderSlots();
  $('quiz-hint').textContent=S.frenzyActive?'⚡ 超神连打!按顺序敲!':'轮到你:按顺序敲!';hud()},total*1000);
 $('quiz-hint').textContent='🔊 仔细听…';
}

/* ================= 敲击判定(音高+顺序;错≠失败,只改概率) ================= */
function hitLane(i){
 if(S.phase!=='input')return;
 const nt=NOTES[i];
 tone(midiF(nt.m),0,.4);
 const laneEl=document.querySelector(`.lane[data-i="${i}"]`);
 const expect=S.q[S.pos];
 const rect=laneEl.getBoundingClientRect(),appR=app.getBoundingClientRect(),sk=appR.width/app.offsetWidth;
 const fresh=lastPt&&Date.now()-lastPt.t<500;
 const hx=fresh?lastPt.x:(rect.left-appR.left+rect.width/2)/sk,
       hy=fresh?lastPt.y:(rect.top-appR.top+rect.height/2)/sk;
 swingHammer(hx,hy);
 spawnSparks(hx,hy);
 S.strikes++;S.totStrikes++;
 if(i===expect){
  clank(true);
  S.hits++;S.totHits++;
  S.potential+=CFG.POT_PER_HIT;
  flyDrop(hx,hy);
  S.marks[S.pos]='hit';
  laneEl.classList.add('flash-hit');setTimeout(()=>laneEl.classList.remove('flash-hit'),260);
  setGirl('strike',380);
  if(S.frenzyActive){ // 超神:立即结算金币
   S.gold+=CFG.FRENZY_GOLD;
   floatText(hx,hy,`+${CFG.FRENZY_GOLD}🪙`,'gold');
  }else{
   S.charge=Math.min(CFG.FRENZY_NEED,S.charge+1);
   floatText(hx,hy,`+${CFG.POT_PER_HIT}💧`,'plus');
   if(S.charge>=CFG.FRENZY_NEED)startFrenzy();
  }
  S.pos++;renderSlots();hud();
  if(S.pos>=S.q.length)endQuestion();
 }else{
  clank(false);
  S.marks[S.pos]='miss';
  if(!S.frenzyActive){ // 超神豁免:敲错零惩罚
   S.charge=0;
   floatText(hx,hy,'概率↓','minus');
  }
  laneEl.classList.add('flash-miss');setTimeout(()=>laneEl.classList.remove('flash-miss'),340);
  setGirl('hurt',560);
  const wrongN=NOTES[i].n, expN=NOTES[expect].n;
  $('quiz-hint').textContent=`✘ 应为 ${expN},敲成了 ${wrongN}(剑不碎,继续!)`;
  $('quiz-hint').classList.add('warn');setTimeout(()=>$('quiz-hint').classList.remove('warn'),1600);
  S.pos++;renderSlots();hud();
  if(S.pos>=S.q.length)endQuestion();
 }
}

/* ================= 一题结束 → 淬火 ================= */
function endQuestion(){
 if(S.frenzyActive){ // 超神期间:快速连发,攒到窗口结束一次性大淬火
  S.pendingQuench=true;S.phase='busy';
  $('quiz-hint').textContent='⚡ 超神连打!潜在金额累积中…';
  setTimeout(()=>{if(S.phase==='busy'){S.q=genQuestion();playQuestion()}},420);
  return;
 }
 S.phase='ready';
 const qb=$('quench-btn');
 qb.innerHTML=`🔥 淬 火 · 💧${S.potential}`;
 qb.style.display='block';
 $('quiz-hint').textContent='敲完了!点水桶上方按钮淬火';
}
function quenchPhase(){
 S.phase='quench';hud();
 const acc=S.strikes>0?S.hits/S.strikes:0;
 const probs=computeProbs(acc);
 const result=rollTier(probs);
 const payout=Math.round(S.potential*CFG.TIERS[result].mult);
 // 面板
 const qp=$('quench');qp.classList.add('on');
 $('quench-sub').textContent=`正确率 ${Math.round(acc*100)}% · 潜在 💧${S.potential} × 档位倍率`;
 $('quench-result').textContent='';
 const strip=$('roll-strip');strip.innerHTML='';
 const keys=['great','good','normal','poor'];
 keys.forEach(k=>{const d=document.createElement('div');d.className='rslot '+k+' rolling';
  d.innerHTML=`<div class="rn">${CFG.TIERS[k].name}</div><div class="rm">×${CFG.TIERS[k].mult}</div>`;strip.appendChild(d)});
 sizzle();
 $('quench-steam').classList.remove('puff');void $('quench-steam').offsetWidth;$('quench-steam').classList.add('puff');
 // 滚动 1.6s → 揭示
 setTimeout(()=>{
  strip.querySelectorAll('.rslot').forEach(d=>d.classList.remove('rolling'));
  const winEl=strip.querySelector('.rslot.'+result);
  winEl.classList.add('winner');
  const t=CFG.TIERS[result];
  $('quench-result').innerHTML=result==='great'
   ?`<span style="color:#ffd54f">🌈 大成功!💧${S.potential} × ${t.mult} = 🪙${payout}!</span>`
   :result==='poor'
   ?`<span style="color:#ff9a8a">💦 失败…×${t.mult} 只得 🪙${payout}(剑没碎!)</span>`
   :`<span style="color:#a8f0a0">${t.name}!💧${S.potential} × ${t.mult} = 🪙${payout}</span>`;
  tone(midiF(result==='great'?84:result==='poor'?55:72),0,.5,.26);
  if(result==='great')setTimeout(()=>[0,4,7,12].forEach((s,i)=>tone(midiF(72+s),i*.09,.35,.22)),200);
  // 结算
  S.gold+=payout;S.value+=payout;bucketQuenchVisual();S.potential=0;
  S.hits=0;S.strikes=0;
  hud();
  setTimeout(()=>{
   qp.classList.remove('on');
   S.qCount++;
   if(S.qCount>=CFG.GROW_PER){S.qCount=0;growSword()}
   hud();
   S.phase='busy';
   setTimeout(()=>{S.q=genQuestion();playQuestion()},420);
  },1750);
 },1600);
}

/* ================= 超神(Frenzy) ================= */
function startFrenzy(){
 S.frenzyActive=true;S.frenzies++;
 S.frenzyEnd=Date.now()+CFG.FRENZY_SECS*1000;
 app.classList.add('frenzy');
 frenzyJingle();
 toast(`⚡ 超神!${CFG.FRENZY_SECS} 秒疯狂打击:敲对每击 +${CFG.FRENZY_GOLD}🪙,敲错零惩罚!`,2600);
 $('quiz-hint').textContent='⚡ 超神连打!';$('quiz-hint').classList.add('fz');
 clearInterval(S.frenzyTimer);
 S.frenzyTimer=setInterval(()=>{
  const left=(S.frenzyEnd-Date.now())/1000;
  $('frenzy-timer').textContent=left>0?'⏱ '+left.toFixed(1)+'s':'';
  if(left<=0)endFrenzy();
 },100);
 hud();
}
function endFrenzy(){
 clearInterval(S.frenzyTimer);S.frenzyTimer=null;
 S.frenzyActive=false;S.charge=0;
 app.classList.remove('frenzy');
 $('frenzy-timer').textContent='';$('quiz-hint').classList.remove('fz');
 S.pendingQuench=true;
 hud();
 // 当前题敲完立即大淬火
 if(S.phase==='input'&&S.pos>=S.q.length){quenchPhase()}
 else if(S.phase==='busy'){S.q=genQuestion();playQuestion()}
 // playing/input 未敲完:等该题敲完 endQuestion 会走 quench(pendingQuench 兜底)
}

/* ================= 成功/结束 ================= */
function growSword(){
 if(S.tier>=SWORDS.length-1){S.gold+=50;toast('⚔️ 已是最高档!铁匠之神!奖励 🪙50',2200);hud();return}
 S.tier++;
 $('forge-flash').classList.add('go');setTimeout(()=>$('forge-flash').classList.remove('go'),600);
 toast(`⚔️ 剑长大了!${SWORDS[S.tier].emoji} ${SWORDS[S.tier].name} · 音域扩至 ${SWORDS[S.tier].span} 音`,2600);
 hud();updateSword();
}
function forgeSuccess(){
 S.phase='busy';S.forged++;
 const sw=SWORDS[S.tier];
 S.gold+=sw.sell;S.rentLeft+=CFG.RENT_PER_FORGE;
 $('rent-num').textContent=fmtT(S.rentLeft);
 hud();
 $('forge-flash').classList.add('go');setTimeout(()=>$('forge-flash').classList.remove('go'),600);
 const last=S.tier+1>=SWORDS.length;
 showOverlay('gold',sw.emoji,`${sw.name} 铸成!`,
  `淬火收益攒满 <b>${sw.base}</b>,宝剑出炉!<br>卖出得 <b>🪙${sw.sell}</b> · 房租 +${CFG.RENT_PER_FORGE}s · 累计 <b>🪙${S.gold}</b><br>${last?'你已是铁匠之神!':'下一把剑更长,音域更宽,题目更长——'}`,
  last?[{label:'🔄 再战一局',cls:'gold',fn:()=>{hideOverlay();restart()}}]
      :[{label:'🔨 下一把剑',cls:'gold',fn:()=>{hideOverlay();S.tier++;startForge()}}]);
}
function gameOver(){
 if(S.phase==='over')return;
 S.phase='over';clearInterval(S.rentTimer);clearInterval(S.frenzyTimer);
 const acc=S.totStrikes>0?Math.round(S.totHits/S.totStrikes*100):0;
 showOverlay('blue','🏚️','房租到期!',
  `房东把你赶出了铁匠铺…<br>铸成 <b>${S.forged}</b> 把剑 · 身家 <b>🪙${S.gold}</b><br>正确率 <b>${acc}%</b>(${S.totHits}/${S.totStrikes}) · 超神 <b>${S.frenzies}</b> 次<br>最高锻造到 <b>${SWORDS[S.tier].name}</b>`,
  [{label:'🔥 重开铁匠铺',cls:'gold',fn:()=>{hideOverlay();restart()}}]);
}
function restart(){
 S.tier=0;S.value=0;S.potential=0;S.charge=0;S.gold=0;S.forged=0;S.frenzies=0;S.qCount=0;
 S.rentLeft=CFG.RENT_START;S.totHits=0;S.totStrikes=0;S.hits=0;S.strikes=0;
 S.frenzyActive=false;S.pendingQuench=false;app.classList.remove('frenzy');
 clearInterval(S.frenzyTimer);
 $('rent-num').textContent=fmtT(S.rentLeft);
 startForge();
}
function showOverlay(kind,emoji,title,body,btns){
 const ov=$('overlay');ov.classList.add('on');
 $('ov-title').textContent=title;$('ov-title').className=kind==='gold'?'gold':kind==='blue'?'blue':'red';
 $('ov-sword').textContent=emoji;$('ov-body').innerHTML=body;
 const bx=$('ov-btns');bx.innerHTML='';
 btns.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.label;el.onclick=b.fn;bx.appendChild(el)});
}
function hideOverlay(){$('overlay').classList.remove('on')}

/* ================= 粒子/飘字 ================= */
function spawnSparks(x,y){
 for(let k=0;k<5;k++){const s=document.createElement('div');s.className='spark';s.textContent=['✨','⚡','·','✦'][k%4];
  s.style.left=x+'px';s.style.top=y+'px';
  s.style.setProperty('--dx',(Math.random()*90-45)+'px');s.style.setProperty('--dy',(-30-Math.random()*60)+'px');
  app.appendChild(s);setTimeout(()=>s.remove(),520)}
}
function floatText(x,y,txt,cls){const f=document.createElement('div');f.className='float '+cls;f.textContent=txt;
 f.style.left=(x-24)+'px';f.style.top=(y-14)+'px';
 app.appendChild(f);setTimeout(()=>f.remove(),1050)}

/* ================= 流程 ================= */
function startForge(){
 S.value=0;S.potential=0;S.charge=0;S.hits=0;S.strikes=0;S.pendingQuench=false;
 S.phase='idle';hud();updateSword();
 $('quiz-hint').textContent='点火!开始出题';
 toast(`🔥 开炉:${SWORDS[S.tier].name} · 每${CFG.GROW_PER}题长大一次`);
 startRent();
 nextQuestion();
}
function nextQuestion(){S.q=genQuestion();S.pos=0;S.revealed=false;S.marks=[];playQuestion()}
$('btn-start').onclick=()=>{if(S.phase!=='idle')return;startForge()};
$('quench-btn').onclick=()=>{if(S.phase!=='ready')return;$('quench-btn').style.display='none';quenchPhase()};
$('btn-replay').onclick=()=>{if(S.phase==='input'){const p=S.pos,m=S.marks,r=S.revealed;playQuestion();S.pos=p;S.marks=m;S.revealed=r;renderSlots()}};
$('btn-help').onclick=()=>{showOverlay('gold','❓','玩法:打铁听音 · 淬火定命',
 `- 听题目(音序),<b>按顺序</b>在音道上敲出这些音<br>
  · 敲对 <b>+1💧潜在钱</b>;敲错<b>剑不碎</b>,只把淬火档位概率变差<br>
  · 一题敲完 → <b>淬火</b>:roll 档位,潜在钱 × 倍率变金币<br>
  · 档位:<b>大成功×4 / 成功×2 / 普通×1 / 失败×½</b>,敲得越正确概率越好<br>
  · 连对 ${CFG.FRENZY_NEED} 击 → <b>⚡超神 ${CFG.FRENZY_SECS}s</b>:敲对每击 +${CFG.FRENZY_GOLD}🪙、敲错零惩罚,窗口结束大淬火一把结<br>
  · 淬火收益攒满 → 铸成卖剑,换更长剑(音域更宽题目更长),房租 +${CFG.RENT_PER_FORGE}s<br>
  · 房租倒计时归零 = 被赶出铁匠铺<br>
  · 横幅颜色 = 唱名颜色(do 红 re 橙 mi 黄 fa 绿 sol 青 la 蓝 si 紫)`,
 [{label:'明白,开炉!',cls:'gold',fn:hideOverlay}])};

/* 音道点击(用 app 坐标判定,锤子即光标) */
$('lanes').addEventListener('pointerdown',e=>{
 const laneEl=e.target.closest('.lane');if(!laneEl)return;
 placeHammer(e.clientX,e.clientY);
 hitLane(+laneEl.dataset.i);
});

/* 测试钩子 */
window.__api={S,NOTES,SWORDS,CFG,computeProbs,rollTier,startForge,nextQuestion,hitLane,genQuestion,playQuestion,quenchPhase,forceFrenzy:()=>{S.charge=CFG.FRENZY_NEED;startFrenzy()}};

/* ================= 启动 ================= */
buildLanes();
$('rent-num').textContent=fmtT(S.rentLeft);
requestAnimationFrame(()=>requestAnimationFrame(()=>{hud();updateSword()}));
addEventListener('resize',()=>setTimeout(updateSword,80));
</script>
