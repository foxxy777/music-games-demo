<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>V21 · 负债铁匠 · 打铁听音</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0705;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none;color:#f3e9d8;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{width:1280px;height:720px;flex:none;transform-origin:center center;background:radial-gradient(900px 700px at 50% 30%,#2a1c10 0%,#170f09 55%,#0a0705 100%);display:flex;flex-direction:column;overflow:hidden;position:relative}
#app.frenzy{background:radial-gradient(900px 700px at 50% 30%,#3a1c08 0%,#241106 55%,#120803 100%)}
#app.frenzy::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:35;box-shadow:inset 0 0 90px 24px #ff6b2daa;animation:frpulse .5s infinite}
@keyframes frpulse{50%{box-shadow:inset 0 0 120px 34px #ff9a4dcc}}

/* ===== 顶部 HUD ===== */
#hud{flex:0 0 64px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:2px solid #4a3320;background:linear-gradient(180deg,#1c120a,#170f0999)}
#hud-row1{display:flex;align-items:center;gap:10px}
#debt-tag{font-size:12px;padding:3px 10px;border-radius:12px;background:#3a1218;border:1px solid #ff5d6c88;color:#ff9a8a;flex:none}
#rent-num{font-weight:bold;color:#ffd54f}
#gold-row{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:bold;color:#ffd54f}
#pot-row{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:bold;color:#7ddf6a;margin-left:14px}
#hud-row2{display:flex;align-items:flex-end;gap:12px;margin-top:7px}
#sword-info{flex:1;min-width:0}
#sword-name{font-size:18px;color:#ffe9b8;font-weight:bold;letter-spacing:1px;display:flex;align-items:center;gap:8px}
#tier-tag{font-size:11px;color:#c9a06a;border:1px solid #6a4c2a;border-radius:8px;padding:1px 8px}
#value-wrap{margin-top:4px}
#value-bar{height:14px;background:#241505;border:1.5px solid #6a4c2a;border-radius:8px;overflow:hidden;position:relative}
#value-fill{height:100%;width:0%;background:linear-gradient(90deg,#c9822a,#ffd54f);transition:width .25s;border-radius:8px}
#value-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000}
/* 充能条 */
#charge-wrap{flex:none;width:170px;display:flex;flex-direction:column;gap:3px}
#charge-label{font-size:10px;color:#c9a06a;text-align:center}
#charge-label.fz{color:#ffb84d;font-weight:bold}
#charge-bar{height:20px;background:#241505;border:1.5px solid #7a5830;border-radius:10px;overflow:hidden;display:flex}
.ch-cell{flex:1;border-right:1px solid #00000055;transition:background .15s}
.ch-cell:last-child{border-right:none}
.ch-cell.on{background:linear-gradient(180deg,#ffb84d,#ff8a2a);box-shadow:0 0 8px #ffb84d88}
.ch-cell.fz{background:linear-gradient(180deg,#fff3b0,#ffd54f);animation:frpulse .4s infinite}
#frenzy-timer{font-size:11px;color:#ffb84d;font-weight:bold;text-align:center;min-height:14px}
/* 档位概率条(5档,hud下方横跨条内) */
#probs-strip{flex:1;display:flex;gap:5px;height:44px;min-width:0}
.pbar{flex:1;height:44px;border:1px solid #4a3320;border-radius:7px;position:relative;overflow:hidden;background:#1a110a;transition:all .3s;min-width:0}
.pbar .pfill{position:absolute;left:0;bottom:0;width:100%;transition:height .35s}
.pbar .ptxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.15;font-weight:bold;text-shadow:0 1px 2px #000;z-index:2}
.pbar .ptxt .pct{font-size:10px}
.pbar.great .pfill{background:linear-gradient(180deg,#ffd54f66,#c9822a88)}
.pbar.great .ptxt{color:#ffd54f}
.pbar.good .pfill{background:linear-gradient(180deg,#7ddf6a55,#3a8a2a88)}
.pbar.good .ptxt{color:#a8f0a0}
.pbar.keep .pfill{background:linear-gradient(180deg,#c9c9c944,#8a8a8a66)}
.pbar.keep .ptxt{color:#d8d8d8}
.pbar.dmg .pfill{background:linear-gradient(180deg,#ff9d4d55,#8a4a1a88)}
.pbar.dmg .ptxt{color:#ffb87a}
.pbar.fail .pfill{background:linear-gradient(180deg,#ff5d6c55,#8a1a2688)}
.pbar.fail .ptxt{color:#ff9a8a}
#hud-row3{display:flex;gap:8px;margin-top:7px;align-items:center}
.btn{padding:5px 16px;background:#33241374;border:1px solid #7a5830;border-radius:9px;color:#f3e9d8;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#c9a06a;background:#4a332074}
.btn.gold{background:linear-gradient(160deg,#a37c1c,#6d5210);border-color:#ffd54f;color:#fff6d8;font-weight:bold}
.btn:disabled{opacity:.3;cursor:default}
#btn-help{margin-left:auto;font-size:12px;padding:3px 12px}
#acc-row{font-size:11px;color:#c9a06a;display:flex;gap:12px;align-items:center}

/* ===== 题目区 ===== */
#quiz{flex:0 0 126px;order:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-top:2px solid #4a3320;background:#120c0777;position:relative;padding:4px 0}
#quiz-title{font-size:11px;color:#c9a06a;letter-spacing:1px}
#slots{display:flex;gap:8px;align-items:center;justify-content:center;min-height:42px;flex:none}
.qslot{width:46px;height:40px;border:2px dashed #6a4c2a;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a110a;transition:all .18s;position:relative}
.qslot.waiting{border-style:dashed}
.qslot.playing{border-color:#ffd54f;box-shadow:0 0 14px #ffd54f55;animation:qpulse .5s infinite}
.qslot.hit{border-style:solid;border-color:#7ddf6a;background:linear-gradient(165deg,#1a3012,#0d1808)}
.qslot.hit .qn{color:#a8f0a0}
.qslot.miss{border-style:solid;border-color:#ff5d6c;background:linear-gradient(165deg,#3a1218,#1a0c10);animation:shake .35s}
.qslot.miss .qn{color:#ff9a8a}
.qslot .qn{font-size:15px;font-weight:bold;color:#8a6c42}
.qslot .qsi{font-size:8px;color:#c9a06a66;margin-top:1px}
.qslot.hit .qsi,.qslot.miss .qsi{color:#c9a06a}
/* 我的输入行(2026-10-17 大爷令):与题目槽逐位对齐,显示实际按的音,对绿错红 */
#my-slots{display:flex;gap:8px;align-items:center;justify-content:center;min-height:34px;flex:none}
.mslot{width:46px;height:30px;border:1.5px dashed #4a3320;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#150d08;font-size:14px;font-weight:bold;color:#5a4428}
.mslot.next{border-color:#ffd54f66;animation:mpulse 1s infinite}
.mslot.ok{border-style:solid;border-color:#7ddf6a77;color:#a8f0a0;background:linear-gradient(165deg,#14240d,#0a1406)}
.mslot.bad{border-style:solid;border-color:#ff5d6c99;color:#ff9a8a;background:linear-gradient(165deg,#2e0e14,#16070b)}
@keyframes mpulse{50%{box-shadow:0 0 10px #ffd54f33}}
@keyframes qpulse{50%{box-shadow:0 0 22px #ffd54faa}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#quiz-hint{font-size:12px;color:#8a6c42;min-height:16px;transition:color .2s}
#quiz-hint.warn{color:#ff9a8a}
#quiz-hint.fz{color:#ffb84d;font-weight:bold}

/* ===== 铁砧区(音道+剑) ===== */
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#mid{flex:1;display:flex;min-height:0}
#acc-strip{flex:0 0 56px;display:flex;align-items:center;justify-content:flex-start;gap:16px;padding:0 14px;background:linear-gradient(180deg,#2a1a06,#1a1004);border-bottom:2px solid #c9a06a77}
#acc-strip .acc-left{display:flex;align-items:center;gap:8px;flex:none}
#acc-strip .lab{font-size:15px;color:#c9a06a;letter-spacing:2px}
#acc-big{font-size:30px;color:#ffd54f;font-weight:800;text-shadow:0 0 16px #ffd54f55;font-family:inherit}
#acc-detail2{font-size:12px;color:#c9a06a}
#quench-btn{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;padding:11px 20px;font-size:18px;font-weight:bold;border-radius:14px;background:linear-gradient(160deg,#8a5cff,#1a5f9e);border:2px solid #d0b3ff;color:#fff;cursor:pointer;animation:qbpulse 1.1s ease-in-out infinite;box-shadow:0 0 22px #4da3e888}
@keyframes qbpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
#left-col{width:240px;flex:none;order:2;display:flex;flex-direction:column;position:relative;border-left:2px solid #4a3320;background:linear-gradient(180deg,#150d07 0%,#0d0805 100%)}
#girl-col{width:216px;flex:none;order:-1;display:flex;position:relative;border-right:2px solid #4a3320;background:linear-gradient(180deg,#150d07,#0d0805)}
#bucket-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 10px 6px;position:relative}
#bucket{width:76%;max-width:235px;flex:none;filter:drop-shadow(0 8px 14px #000a)}
#bucket-cap{font-size:12px;color:#7fb8e8;letter-spacing:1px;text-shadow:0 1px 2px #000}
#bucket-num{font-size:13px;color:#d0b3ff;font-weight:600;text-shadow:0 1px 2px #000}
/* 乐器音色选择(大爷16:50令) */
#inst-zone{flex:none;max-height:236px;display:flex;flex-direction:column;border-top:2px solid #4a3320;padding:7px 8px 5px;background:linear-gradient(180deg,#150d07,#0d0805)}
#inst-title{font-size:11px;color:#c9a06a;letter-spacing:2px;margin-bottom:5px;text-align:center;text-shadow:0 1px 2px #000}
#inst-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-right:2px;min-height:0}
#inst-grid::-webkit-scrollbar{width:5px}
#inst-grid::-webkit-scrollbar-thumb{background:#4a3320;border-radius:3px}
.ibtn{font-size:10.5px;padding:5px 2px;border-radius:7px;border:1.5px solid #4a3320;background:#1a110a;color:#d8c9ae;cursor:pointer;transition:all .12s;line-height:1.25;font-family:inherit}
.ibtn:hover{border-color:#ffd54f88;color:#ffe9b8}
.ibtn.on{border-color:#ffd54f;background:linear-gradient(160deg,#4a3218,#2a1c0f);color:#ffe89a;box-shadow:0 0 8px #ffb84d44;font-weight:bold}
.ibtn.load{opacity:.45;pointer-events:none}
#bucket-water{transition:all .3s}
#bucket-water-glow{transition:all .3s}
.flydrop{position:absolute;z-index:36;pointer-events:none;font-size:19px;opacity:.95;transition:transform .55s cubic-bezier(.3,-.15,.65,1.05);text-shadow:0 2px 4px #0008}
#anvil{flex:1;display:flex;position:relative;overflow:hidden;cursor:none}
/* 铁砧俯视外形(大爷19:49令):右端尖角horn+左端砧尾 */
#anvil::before{content:'';position:absolute;inset:0;z-index:0;
 clip-path:polygon(1.5% 15%,68% 3%,100% 50%,68% 97%,1.5% 85%,7% 50%);
 background:linear-gradient(165deg,#3d434c 0%,#2a2e35 45%,#181a1f 100%);
 filter:drop-shadow(0 0 22px #000a)}
#anvil::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
 clip-path:polygon(2% 17.5%,68.4% 6%,98.6% 50%,68.4% 94%,2% 82.5%,7.6% 50%);
 background:linear-gradient(165deg,rgba(255,255,255,.10),transparent 26%),linear-gradient(0deg,#434a54 0%,#333941 55%,#262a31 100%)}
#lanes{flex:1;display:flex;flex-direction:column-reverse;padding:12px 26px 12px 34px;gap:4px;position:relative;z-index:1}
.lane{flex:1;display:flex;flex-direction:row;position:relative;align-items:center;gap:8px;padding:0 12px;border-radius:9px;border:1.5px solid #ffffff10;background:linear-gradient(90deg,#ffffff04,#ffffff08 50%,#ffffff04);transition:background .12s,border-color .12s,filter .2s;position:relative;min-height:0}
.lane .ln{flex:none;text-align:center;font-size:15px;font-weight:bold;text-shadow:0 0 8px currentColor}
.lane .lk{flex:none;text-align:center;font-size:10px;opacity:.55}
.lane.dim{filter:brightness(.32) saturate(.4)}
.lane.cov{border-color:#ffffff28}
.lane.cov .ln{opacity:1}
.anchor-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:3;display:none;padding:4px 14px;border-radius:14px;background:linear-gradient(180deg,#4a3218,#2a1c0f);border:2px solid #ffd54f;box-shadow:0 0 10px #ffb84d88,0 1px 3px #000a;color:#ffe89a;font-size:15px;font-weight:bold;cursor:pointer;pointer-events:auto;animation:anchorPulse 1.6s ease-in-out infinite}
@keyframes anchorPulse{0%,100%{box-shadow:0 0 8px #ffb84d55,0 1px 3px #000a}50%{box-shadow:0 0 18px #ffb84dbb,0 1px 3px #000a}}
.lane.anchor-on .anchor-btn{display:block}
.anchor-btn:hover{background:#5a4020;color:#fff}
.lane.off{display:none}
.lane.flash-hit{background:linear-gradient(90deg,#5dff7a30,#5dff7a4d 50%,#5dff7a30)!important;border-color:#5dff7a!important}
.lane.flash-miss{background:linear-gradient(90deg,#ff5d6c30,#ff5d6c4d 50%,#ff5d6c30)!important;border-color:#ff5d6c!important}
@keyframes crackshake{0%{transform:translate(0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,0)}80%{transform:translate(2px,1px)}100%{transform:translate(0)}}
/* 五线谱底色 */
.staff-line{position:absolute;left:1.5%;right:1.5%;height:1.6px;background:#d8c9a844;pointer-events:none;z-index:0}
.staff-line.xl{background:#d8c9a822;border-top:1px dashed #d8c9a855;background:none}
.staff-clef{position:absolute;left:4px;font-size:58px;line-height:1;color:#d8c9a8aa;font-family:'Noto Music','Segoe UI Symbol','Bravura',serif;z-index:0;pointer-events:none;text-shadow:0 0 8px #d8c9a833}
.note-head{position:absolute;left:34%;top:50%;width:15px;height:10.5px;border-radius:50%;transform:translate(-50%,-50%) rotate(-16deg);z-index:1;pointer-events:none;box-shadow:0 1px 3px #0009,inset -2px -1px 2px #0005}
.nh-stem{position:absolute;right:-1.5px;top:7px;width:1.8px;height:34px;background:inherit;opacity:.9}
/* 剑(竖放:柄在下do端,尖朝上高音) */
#sword-zone{position:absolute;left:50%;top:0;bottom:0;width:150px;transform:translateX(-50%);pointer-events:none;z-index:5}
#sword-value{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;font-size:20px;font-weight:bold;color:#ffe89a;text-shadow:0 0 4px #000,0 0 10px #000c,0 2px 2px #000;white-space:nowrap;transition:top .5s}
#sword-svg{position:absolute;left:50%;transform:translateX(-50%);transition:height .5s,top .5s;filter:drop-shadow(0 0 12px #ffb84d33);width:140px}
#sword-glow{position:absolute;left:50%;transform:translateX(-50%);width:140px;border-radius:50%;background:radial-gradient(closest-side,#ffb84d2d,transparent);pointer-events:none;transition:height .5s,top .5s}
/* 激光(上下横线标音域) */
.laser{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,#ff5d6c66 15%,#ff5d6cdd 50%,#ff5d6c66 85%,transparent);box-shadow:0 0 12px #ff5d6c88;z-index:4;pointer-events:none;transition:top .5s}
.laser::before,.laser::after{content:'';position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 10px #ff5d6c}
.laser::before{top:-3px}.laser::after{bottom:-3px}
/* 碎剑(失败档) */
#sword-zone.shatter #sword-svg{animation:sshake .55s ease-out}
@keyframes sshake{0%{filter:drop-shadow(0 0 16px #ff5d6c)}25%{transform:translateX(calc(-50% - 12px)) rotate(-4deg)}50%{transform:translateX(calc(-50% + 9px)) rotate(3deg)}75%{transform:translateX(calc(-50% - 5px))}100%{transform:translateX(-50%)}}
.frag{position:absolute;width:11px;height:9px;background:linear-gradient(135deg,#c9d4e0,#7a848f);clip-path:polygon(0 100%,50% 0,100% 100%);z-index:20;pointer-events:none;animation:fragfly .9s ease-in forwards}
@keyframes fragfly{to{transform:translate(var(--fx),var(--fy)) rotate(200deg);opacity:0}}

/* ===== 女铁匠(素材槽:H3 视频帧就位前用占位 SVG) ===== */
#girl{flex:1;width:100%;min-height:0;z-index:6;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:0 6px 8px}
#girl .gph{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;transition:transform .1s}
#girl .gph.idle{animation:gbreath 2.6s ease-in-out infinite}
#girl .gph.strike{animation:gbounce .38s ease-out}
#girl .gph.hurt{animation:ghurt .5s ease-out}
@keyframes gbreath{50%{transform:translateY(-6px) scale(1.012)}}
@keyframes gbounce{0%{transform:translateY(0)}35%{transform:translateY(-26px) rotate(-3deg)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes ghurt{0%{transform:translateX(0)}25%{transform:translateX(-9px) rotate(2deg)}55%{transform:translateX(7px) rotate(-2deg)}80%{transform:translateX(-3px)}100%{transform:translateX(0)}}
#girl-tag{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:9px;color:#c9a06a99;background:#1a110acc;padding:1px 8px;border-radius:8px;white-space:nowrap}

/* ===== 铁锤本体(跟随鼠标) ===== */
#app{touch-action:none;cursor:none;-webkit-user-select:none;user-select:none}
body{overflow:hidden}
#hammer{position:absolute;z-index:30;pointer-events:none;transform-origin:12% 88%;filter:drop-shadow(0 5px 9px #000c);transition:transform .05s linear,opacity .4s}
#hammer svg{display:block}
#hammer.swing{animation:mswing .22s cubic-bezier(.6,0,.9,1)}
@keyframes mswing{0%{transform:rotate(8deg)}45%{transform:rotate(-52deg) translateY(10px)}100%{transform:rotate(8deg)}}
.spark{position:absolute;font-size:15px;z-index:31;pointer-events:none;animation:sparkfly .5s ease-out forwards}
@keyframes sparkfly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.float{position:absolute;font-size:17px;font-weight:bold;z-index:32;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 1px 3px #000}
.float.plus{color:#7ddf6a}
.float.minus{color:#ff5d6c}
.float.gold{color:#ffd54f;font-size:19px}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* ===== 淬火居中面板(大爷19:49令:覆盖式展示,点继续才关) ===== */
#quench-modal{position:fixed;inset:0;z-index:60;background:#000000ba;display:none;align-items:center;justify-content:center;cursor:auto}
#quench-modal.on{display:flex}
#qm-card{width:min(620px,88vw);background:linear-gradient(165deg,#2b2118,#191018 70%);border:2px solid #c9a06a90;border-radius:18px;padding:24px 30px;text-align:center;box-shadow:0 18px 60px #000c,0 0 46px #ffb84d26;animation:qmpop .3s cubic-bezier(.3,-.2,.6,1.4)}
@keyframes qmpop{from{transform:scale(.84);opacity:0}}
#qm-title{font-size:26px;font-weight:bold;color:#ffd54f;text-shadow:0 0 16px #ffb84d66;margin-bottom:6px}
#qm-sub{font-size:13px;color:#cbb8a0;margin-bottom:14px}
#qm-strip{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
#qm-strip .rslot{width:96px;height:80px}
#qm-result{font-size:17px;min-height:28px;margin-bottom:14px;font-weight:bold}
#qm-btn{font-size:15px;padding:9px 32px}

/* ===== 淬火面板(旧左栏版,退役保留) ===== */
#quench{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);width:min(96%,224px);z-index:45;display:none;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,#0e1420f2,#0a0e18f2);border:2px solid #4d8dd8aa;border-radius:16px;padding:14px 18px 16px;box-shadow:0 0 44px #4d8dd844}
#quench.on{display:flex;animation:qin .3s ease-out}
@keyframes qin{0%{opacity:0;transform:translate(-50%,-46%) scale(.9)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#quench-title{font-size:21px;font-weight:900;color:#bfe3ff;letter-spacing:5px;text-shadow:0 0 16px #4d8dd8aa}
#quench-sub{font-size:12px;color:#8fb8dd}
#roll-strip{display:flex;gap:8px;height:84px;position:relative}

function computeProbs(errN,fullN){ // errN=本剑累计错音,fullN=本剑累计全对题数
 let dmg=CFG.PROB.dmg+CFG.ERR_PENALTY*(errN||0),
     g=CFG.PROB.great+CFG.FULL_BONUS*(fullN||0);
 if(dmg+g>100){const s=100/(dmg+g);dmg*=s;g*=s} // 超界等比压缩,成功档归零
 return {great:g,good:Math.max(0,100-dmg-g),dmg};
}
function rollTier(probs){
 const r=Math.random()*100;
 if(r<probs.great)return 'great';
 if(r<probs.great+probs.good)return 'good';
 return 'dmg';
}

let AC=null;
function au(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,when=0,dur=.42,vol=.22){const c=au(),t=c.currentTime+when;const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.028);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05)}
function clankNeutral(){const c=au(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(760,t);o.frequency.exponentialRampToValueAtTime(560,t+.08);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.13)}
function clank(ok){const c=au(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(ok?1240:340,t);o.frequency.exponentialRampToValueAtTime(ok?880:180,t+.09);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.15)}
function sizzle(){ // 淬火蒸汽嘶声:白噪声+带通
 const c=au(),t=c.currentTime,dur=1.1;
 const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
 const src=c.createBufferSource();src.buffer=buf;
 const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(5200,t);f.frequency.exponentialRampToValueAtTime(1600,t+dur);f.Q.value=.8;
 const g=c.createGain();g.gain.setValueAtTime(.24,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(f);f.connect(g);g.connect(c.destination);src.start(t);
}

/* ================= 题目 ================= */
function genQuestion(){
 const span=curSpan();let pool=NOTES.slice(0,span);
 const av=instAvail();if(av){const f=pool.filter(n=>av.has(n.m));if(f.length>=4)pool=f} // 乐器缺音时只在可用音内出题
 const q=[];let prev=-1;
 for(let i=0;i<3;i++){
  let idx;
  if(prev<0)idx=Math.floor(Math.random()*pool.length);
  else{const step=[-2,-1,-1,0,0,1,1,2,3][Math.floor(Math.random()*9)];idx=Math.min(pool.length-1,Math.max(0,prev+step));if(idx===prev&&Math.random()<.7)idx=Math.min(pool.length-1,Math.max(0,idx+(Math.random()<.5?1:-1)));}
  q.push(idx);prev=idx;
 }
 return q;
}
function renderSlots(state){
 const box=$('slots');box.innerHTML='';
 S.q.forEach((ni,i)=>{
  const nt=NOTES[ni];const d=document.createElement('div');
  let cls='qslot',inner='?';
  if(S.phase==='playing'){cls+= i===S.pos?' playing':' waiting'}
  else if(i<S.pos){
   if(S.marks&&S.marks[i]==='pending'){cls+=' waiting';inner='?'}
   else{cls+= (S.marks&&S.marks[i]==='miss')?' miss':' hit';inner=nt.n}
  }
  else if(S.revealed){cls+=' hit';inner=nt.n}
  d.className=cls;
  const c=colorOf(nt.n);
  const shown=cls.includes('hit')||cls.includes('miss');
  d.innerHTML=`<div class="qn" style="color:${shown?c:'#8a6c42'}">${shown?nt.n:inner}</div><div class="qsi">${i+1}</div>`;
  box.appendChild(d);
 });
 // 我的输入行:逐位对照(上=题目,下=实际按的音)
 const my=$('my-slots');my.innerHTML='';
 S.q.forEach((ni,i)=>{
  const d2=document.createElement('div');let cls='mslot',txt='·';
  if(S.typed&&S.typed[i]!==undefined){const t=S.typed[i];txt=NOTES[t].n;cls+=(S.marks[i]==='pending')?' next':(S.marks[i]==='hit')?' ok':' bad'}
  else if(S.phase==='input'&&i===S.pos){cls+=' next'}

function gradeQuestion(){

 S.hits+=okCnt;S.totHits+=okCnt;
 if(S.cur){const missN=S.q.length-okCnt;S.cur.errN=(S.cur.errN||0)+missN;if(missN===0)S.cur.fullN=(S.cur.fullN||0)+1}
 S.potential+=okCnt*CFG.POT_PER_HIT;
 S.q.forEach((exp,pos)=>{S.marks[pos]=S.typed[pos]===exp?'hit':'miss'});
 if(S.frenzyActive){S.gold+=okCnt*CFG.FRENZY_GOLD}
 else{S.charge=Math.min(CFG.FRENZY_NEED,S.charge+okCnt);if(okCnt===0)S.charge=0}
 renderSlots();hud();
 const step=380;
 S.q.forEach((exp,pos)=>{setTimeout(()=>{
  clank(S.marks[pos]==='hit');
  if(S.marks[pos]==='miss'){
   const expN=NOTES[exp].n,gotN=S.typed[pos]!==undefined?NOTES[S.typed[pos]].n:'·';
   $('quiz-hint').textContent=`✘ 第${pos+1}音 应为 ${expN},你敲了 ${gotN}`;
   $('quiz-hint').classList.add('warn');setTimeout(()=>$('quiz-hint').classList.remove('warn'),900);
  }
 },pos*step)});
 if(okCnt===S.q.length)$('quiz-hint').textContent=`✔ ${S.q.length}/${S.q.length} 全对!魔能+${okCnt*CFG.POT_PER_HIT}🔮`;
 const dShift=S.typed[0]-S.q[0];
 const contour=dShift!==0&&S.q.every((exp,i)=>S.typed[i]-exp===dShift);
 if(contour){S.potential+=CFG.CONTOUR_BONUS;hud()}
 setTimeout(()=>{
  if(!S.frenzyActive&&S.charge>=CFG.FRENZY_NEED)startFrenzy();
  endQuestion();
  if(contour)$('quiz-hint').textContent=`🎵 轮廓全对(整体${dShift>0?'+':''}${dShift}音)!保底+${CFG.CONTOUR_BONUS}🔮 · 点淬火`;
 },S.q.length*step+450);
}

  const p=S.pack[+d.slice(4)];if(!p||p.sold||S.counter.includes(p))return;
  const w=wOf(p.name),cur=S.counter.reduce((a,x)=>a+wOf(x.name),0);
  if(cur+w>16){toast('柜台摆不下了('+cur+'+'+w+'格 > 16)——先卖掉几把');return}
  S.counter.push(p);renderCounter();renderInv()});
 const chest=$('ps-chest');
 chest.addEventListener('dragover',e=>{if(![...(e.dataTransfer?.types||[])].includes('text/plain'))return;e.preventDefault();chest.classList.add('drop-ready')});
 chest.addEventListener('dragleave',()=>chest.classList.remove('drop-ready'));
 chest.addEventListener('drop',e=>{e.preventDefault();chest.classList.remove('drop-ready');
  const d=e.dataTransfer.getData('text/plain');if(!d||!d.startsWith('ct:'))return;
  const i=+d.slice(3);if(!S.counter[i])return;
  const back=S.counter.splice(i,1)[0];renderCounter();renderInv();toast(back.name+' 收回箱子')});
})();
function endForgeDay(){
 if(S.mode!=='forge')return;
 const it=stashSword(true);
 S.forgeEnded=true;S.phase='idle';hud();
 toast(it?`🌙 收工!${it.name} 没碎——收进箱子,明天照样卖 💰${it.value}`:'收工!点「第二天」去卖货');
}
function coinSound(){const c=au(),t=c.currentTime;
 [[1568,0],[2093,.09]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.11,t+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d+.3);
 o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+.32)})}
function nightFade(cb,txt,sub){
 const nf=$('night-fade');$('nf-text').textContent=txt||'第二天';$('nf-sub').textContent=sub||'';
 nf.classList.remove('on');void nf.offsetWidth;nf.classList.add('on');
 setTimeout(()=>{cb&&cb()},1000);
 setTimeout(()=>{nf.classList.remove('on')},2050);
}
/* ================= Probably-Stolen 柜台售卖(v22 实验) ================= */
const CUST_TYPES=[
 {e:'🛡️',n:'战士',hi:'好剑!就它了!',no:'呸,这不是我要的'},
 {e:'🧙',n:'法师',hi:'魔力波动不错,收了',no:'气息不对,拿走'},
 {e:'🥷',n:'盗贼',hi:'轻!快!趁手…成交',no:'太扎眼,不买'},
 {e:'🧝',n:'游侠',hi:'森林会记得这份手艺',no:'再看看吧…'},
 {e:'🧔',n:'村民',hi:'给儿子的成人礼,谢啦',no:'贵了贵了!'}];
let CUST=null;
function openShop(){
 S.mode='shop';$('shop').classList.add('on');
 S.counter=[];S.pack.forEach(p=>{p.onShelf=false});
 renderCounter();renderInv();renderShopGold();
 $('ps-cust').style.left='110%';CUST=null;
 $('shop-hint').textContent='点箱子里的剑摆上柜台,再点「🛎️ 下一位」招客';
}
function renderShopGold(){$('shop-gold-num').textContent=S.gold}
function renderCounter(){
 const box=$('ct-slots');box.innerHTML='';
 let used=0;
 S.counter.forEach((p,i)=>{used+=wOf(p.name);
  const d=document.createElement('div');d.className='ct-bar';d.style.gridColumn='span '+wOf(p.name);
  d.innerHTML='<span class="cs-e">'+p.emoji+'</span><span class="cs-info"><span>'+p.name+'</span><span class="cs-v">💰'+p.value+' ★'+p.star+'</span></span>';
  d.onclick=()=>offer(i);
  d.draggable=true;d.title='拖回箱子或点击推销';
  d.ondragstart=e=>{e.dataTransfer.setData('text/plain','ct:'+i);e.dataTransfer.effectAllowed='move'};
  box.appendChild(d)});
 $('ct-cap').textContent='格 '+used+'/16';
}
function renderInv(){
 const g=$('inv-grid');g.innerHTML='';
 const sec=g.previousElementSibling.querySelector('.sec-cap');
 const avail=S.pack.filter(p=>!p.sold&&!S.counter.includes(p));
 if(!avail.length){g.innerHTML='<div style="color:#6b5844;font-size:12px;padding:8px;grid-column:1/-1">箱子空空——没铸出剑,或都卖完了</div>';if(sec)sec.textContent='格 0/48';return}
 let used=0;
 avail.forEach(p=>{used+=wOf(p.name);
  const d=document.createElement('div');d.className='inv-cell';d.style.gridColumn='span '+wOf(p.name);
  d.innerHTML='<span class="ic-e">'+p.emoji+'</span><span class="ic-info"><span>'+p.name+'</span><span class="ic-v">💰'+p.value+' ★'+p.star+'</span></span>';
  d.onclick=()=>{const w=wOf(p.name),cur=S.counter.reduce((a,x)=>a+wOf(x.name),0);
   if(cur+w>16){toast('柜台摆不下了('+cur+'+'+w+'格 > 16)——先卖掉几把');return}
   S.counter.push(p);renderCounter();renderInv()};
  d.draggable=true;d.title='拖到上方柜台或点击上架';
  d.ondragstart=e=>{e.dataTransfer.setData('text/plain','inv:'+S.pack.indexOf(p));e.dataTransfer.effectAllowed='move'};
  g.appendChild(d)});
 if(sec)sec.textContent='格 '+used+'/48';
}
function say(t,keep){const b=$('ps-bubble');b.textContent=t;b.classList.add('on');
 if(!keep)setTimeout(()=>b.classList.remove('on'),2600)}
function emote(t){const e=$('pc-emote');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function nextCustomer(){
 if(S.mode!=='shop')return;
 if(CUST){$('shop-hint').textContent='这位客人还没走呢——点柜台上的剑卖给他';return}
 const t=CUST_TYPES[Math.floor(Math.random()*CUST_TYPES.length)];
 const tierMax=Math.min(3,S.day);
 const want=Math.random()<.22?null:SWORDS[Math.floor(Math.random()*(tierMax+1))];
 const mult=+(0.9+Math.random()*0.55).toFixed(2);
 CUST={t,want,mult,fails:0};
 $('pc-face').textContent=t.e;$('pc-name').textContent=t.n;
 $('ps-cust').style.left='110%';
 setTimeout(()=>{$('ps-cust').style.left='50%'},80);
 setTimeout(()=>{
  if(!CUST)return;
  say(CUST.want?('想买一把「'+CUST.want.name+'」,出得起价'):'想要一把 ★2 以上的剑,啥都行');
  $('shop-hint').textContent=CUST.want?('他在等「'+CUST.want.name+'」——点柜台上那把卖他'):'把 ★2 以上的剑摆上柜台卖他';
 },2000);
}
function offer(i){
 const p=S.counter[i];if(!p)return;
 if(p.sold){S.counter.splice(i,1);renderCounter();toast('这把已经卖掉了');return}
 if(!CUST){$('shop-hint').textContent='柜台前没人——点「🛎️ 下一位」先招个客人';return}
 const ok=CUST.want?(p.name===CUST.want.name):(p.star>=2);
 if(ok){
  const price=Math.round(p.value*CUST.mult);
  coinSound();S.gold+=price;S.soldCnt++;p.sold=true;S.counter.splice(i,1);
  say(CUST.t.hi+' 💰+'+price,1);emote(CUST.mult>=1.2?'🤩':'😄');
  toast('💰 卖出 '+p.name+'(★'+p.star+') +'+price+' (×'+CUST.mult+')');
  renderCounter();renderInv();renderShopGold();
  setTimeout(()=>{$('ps-cust').style.left='-20%';
   setTimeout(()=>{CUST=null;$('ps-bubble').classList.remove('on');
    $('shop-hint').textContent=S.pack.some(x=>!x.sold)?'点「🛎️ 下一位」继续招客':'存货清空!点「🌙 打烊」收工'},1400)},900);
 }else{
  CUST.fails++;emote('😠');say(CUST.t.no);
  if(CUST.fails>=2){say(CUST.t.no+'…算了,告辞!');
   setTimeout(()=>{$('ps-cust').style.left='110%';
    setTimeout(()=>{CUST=null;$('ps-bubble').classList.remove('on');
     $('shop-hint').textContent='点「🛎️ 下一位」招下一位'},1400)},900)}
 }
}
function closeShop(){
 S.mode='forge';$('shop').classList.remove('on');
 S.day++;S.forgeEnded=false;S.phase='idle';
 S.pack=S.pack.filter(p=>!p.sold);
 while(S.chest.length<3)S.chest.push({name:'匕首',emoji:'🗡️'}); // 新一天补足 3 坯(大爷21:51令:3剑胚=3剑/晚)
 S.dayLog=[];
 hud();updateSword();
 $('quiz-hint').textContent=`第 ${S.day} 天 · 新剑坯×${S.chest.length}!从箱子拖剑坯开锻`;
}
$('btn-bell').onclick=nextCustomer;
$('btn-close').onclick=()=>{if(S.mode!=='shop')return;nightFade(closeShop,'打烊',`🌙 第 ${S.day} 天结束 · 明天继续`)};

/* ================= 成功/结束 ================= */
function growSword(){
 if(S.tier>=SWORDS.length-1){S.gold+=50;toast('⚔️ 已是最高档!铁匠之神!奖励 🪙50',2200);hud();return}
 S.tier++;
 applyWindow();
 $('forge-flash').classList.add('go');setTimeout(()=>$('forge-flash').classList.remove('go'),600);
 toast(`⚔️ 剑长大了!${SWORDS[S.tier].emoji} ${SWORDS[S.tier].name} · 音域扩至 ${SWORDS[S.tier].span} 音`,2600);
 hud();updateSword();
}
function forgeSuccess(){
 S.phase='busy';S.forged++;
 const sw=SWORDS[S.tier];
 const sell=Math.round(sw.sell*(1-S.dmgLv*.1));
 S.gold+=sell;S.dmgLv=0;
 hud();
 $('forge-flash').classList.add('go');setTimeout(()=>$('forge-flash').classList.remove('go'),600);
 const last=S.tier+1>=SWORDS.length;
 showOverlay('gold',sw.emoji,`${sw.name} 铸成!`,
  `淬火收益攒满 <b>${sw.base}</b>,宝剑出炉!<br>卖出得 <b>🪙${sell}</b> · 累计 <b>🪙${S.gold}</b><br>${last?'你已是铁匠之神!':'下一把剑更长,音域更宽,题目更长——'}`,
  last?[{label:'🔄 再战一局',cls:'gold',fn:()=>{hideOverlay();restart()}}]
      :[{label:'🔨 下一把剑',cls:'gold',fn:()=>{hideOverlay();S.tier++;startForge()}}]);
}
function gameOver(){
 if(S.phase==='over')return;
 S.phase='over';clearInterval(S.rentTimer);clearInterval(S.frenzyTimer);
 const acc=S.totStrikes>0?Math.round(S.totHits/S.totStrikes*100):0;
 showOverlay('blue','🏚️','房租到期!',
  `房东把你赶出了铁匠铺…<br>铸成 <b>${S.forged}</b> 把剑 · 身家 <b>🪙${S.gold}</b><br>正确率 <b>${acc}%</b>(${S.totHits}/${S.totStrikes}) · 超神 <b>${S.frenzies}</b> 次<br>最高锻造到 <b>${SWORDS[S.tier].name}</b>`,
  [{label:'🔥 重开铁匠铺',cls:'gold',fn:()=>{hideOverlay();restart()}}]);
}
function restart(){
 S.tier=0;S.value=0;S.potential=0;S.charge=0;S.gold=0;S.forged=0;S.frenzies=0;S.qCount=0;
 S.totHits=0;S.totStrikes=0;S.hits=0;S.strikes=0;S.dmgLv=0;
 S.roleLv=1;S.dayLog=[];S.day=1;S.mode='forge';S.pack=[];S.counter=[];S.forgeEnded=false;S.soldCnt=0;$('shop').classList.remove('on');
 S.chest=[{name:'匕首',emoji:'🗡️'},{name:'匕首',emoji:'🗡️'},{name:'匕首',emoji:'🗡️'}];S.cur=null;$('chest-modal').classList.remove('on');
 S.frenzyActive=false;S.pendingQuench=false;app.classList.remove('frenzy');
 clearInterval(S.frenzyTimer);
 applyWindow();
 startForge();
}
function showOverlay(kind,emoji,title,body,btns){
 const ov=$('overlay');ov.classList.add('on');
 $('ov-title').textContent=title;$('ov-title').className=kind==='gold'?'gold':kind==='blue'?'blue':'red';
 $('ov-sword').textContent=emoji;$('ov-body').innerHTML=body;
 const bx=$('ov-btns');bx.innerHTML='';
 btns.forEach(b=>{const el=document.createElement('button');el.className='btn '+(b.cls||'');el.textContent=b.label;el.onclick=b.fn;bx.appendChild(el)});
}
function hideOverlay(){$('overlay').classList.remove('on')}

/* ================= 粒子/飘字 ================= */
function spawnSparks(x,y){
 for(let k=0;k<5;k++){const s=document.createElement('div');s.className='spark';s.textContent=['✨','⚡','·','✦'][k%4];
  s.style.left=x+'px';s.style.top=y+'px';
  s.style.setProperty('--dx',(Math.random()*90-45)+'px');s.style.setProperty('--dy',(-30-Math.random()*60)+'px');
  app.appendChild(s);setTimeout(()=>s.remove(),520)}
}
function floatText(x,y,txt,cls){const f=document.createElement('div');f.className='float '+cls;f.textContent=txt;
 f.style.left=(x-24)+'px';f.style.top=(y-14)+'px';
 app.appendChild(f);setTimeout(()=>f.remove(),1050)}

/* ================= 流程 ================= */
function startForge(){
 S.value=0;S.potential=0;S.charge=0;S.hits=0;S.strikes=0;S.pendingQuench=false;
 S.cur=null;S.phase='idle';hud();updateSword();
 $('quiz-hint').textContent='点「🧰 箱子」拖一把剑坯上砧开锻';
}
function nextQuestion(){S.q=genQuestion();S.pos=0;S.revealed=false;S.marks=[];playQuestion()}
$('btn-start').onclick=()=>{if(S.phase==='over')return;openChest()};
$('quench-btn').onclick=()=>{if(S.phase!=='ready')return;$('quench-btn').style.display='none';quenchPhase()};
$('btn-replay').onclick=()=>{if(S.phase==='input'){const p=S.pos,m=S.marks,r=S.revealed;playQuestion();S.pos=p;S.marks=m;S.revealed=r;renderSlots()}};
$('btn-help').onclick=()=>{showOverlay('gold','❓','玩法:打铁听音 · 淬火定命',
 `- 听题目(音序),<b>按顺序</b>在音道上敲出这些音<br>
  · 敲对 <b>+1🔮魔能</b>;敲错剑不碎,但<b>每错一音:淬火损坏率 +5%</b><br>
  · 一题敲完 → <b>淬火</b>:roll 档位,魔能 × 倍率变金币<br>
  · 三档:<b>大成功×4 / 成功×2 / 损坏(剑当场爆!)</b> · 基础 20/70/10,整题全对→大成功+5%<br>

  · 每 2 题剑升 1 级(3音域→4音域),4 题铸成入箱,没爆就能卖<br>
  · 横幅颜色 = 唱名颜色(do 红 re 橙 mi 黄 fa 绿 sol 青 la 蓝 si 紫)<br>

 [{label:'明白,开炉!',cls:'gold',fn:hideOverlay}])};

 const laneEl=e.target.closest('.lane');if(!laneEl)return;
 placeHammer(e.clientX,e.clientY);
 hitLane(+laneEl.dataset.i);

/* 测试钩子 */
window.__api={S,NOTES,SWORDS,CFG,GRIDW,wOf,INST,playInst,computeProbs,rollTier,afterQuestionDone,swordBreak,placeBlank,openChest,startForge,nextQuestion,hitLane,genQuestion,playQuestion,quenchPhase,forceFrenzy:()=>{S.charge=CFG.FRENZY_NEED;startFrenzy()}};

/* ================= 启动 ================= */
buildLanes();
loadManifest();
/* 昼夜循环按钮注入+HUD覆盖(大爷17:08令) */
(function(){
 const hudBox=$('hud');
 const mk=(id,txt,cls)=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.id=id;b.textContent=txt;hudBox.appendChild(b);return b};
 mk('btn-skill','🌳 技能树');mk('btn-endforge','🏁 结束铸造');mk('btn-day2','🌅 第二天','gold');
 $('btn-skill').onclick=()=>showOverlay('blue','🌳','技能树','工匠的成长之路——技能树系统开发中,敬请期待。',[{label:'继续干活',fn:hideOverlay}]);
 $('btn-endforge').onclick=endForgeDay;
 $('btn-day2').onclick=()=>{if(S.mode!=='forge')return;S.phase='idle';stashSword(true);nightFade(openShop,'第二天',`☀️ 第 ${S.day+1} 天 · 售卖日`)};
 const _hudOrig=hud;
 hud=function(){_hudOrig();
  if(S.cur){$('tier-tag').textContent=`剑Lv.${S.cur.lv}/${CFG.SWORD_CAP_LV} · 第${S.day}天`;
   $('sword-title').textContent=SWORDS[curSpan()-3].name;
   $('value-fill').style.width=(S.cur.qDone/(CFG.SWORD_CAP_LV*2)*100)+'%';}
  else{$('tier-tag').textContent=`第${S.day}天 · 铁砧空`;$('value-fill').style.width='0%'}
  const cb=$('chest-btn');if(cb)cb.innerHTML=`🧰 箱子 <b>${S.chest.length}</b>`;
  $('mp-label').textContent=`👷 铁匠 Lv.${S.roleLv}`;
  const dd=$('day-dots');if(dd){dd.innerHTML='';S.dayLog.forEach(s=>{const d=document.createElement('div');
   d.className='day-dot '+s;d.textContent=s==='done'?'✓':s==='broke'?'✗':'🔨';dd.appendChild(d)})}
  const msub=$('mp-sub');if(msub)msub.textContent=`今日剑胚:剩 ${S.chest.length} 坯待锻`;
  $('btn-day2').style.display=(S.mode==='forge'&&S.forgeEnded)?'inline-block':'none';
 };
 hud();
})();
requestAnimationFrame(()=>requestAnimationFrame(()=>{hud();updateSword()}));
addEventListener('resize',()=>setTimeout(updateSword,80));
