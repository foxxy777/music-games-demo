<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5 - Ear Training x Awakening</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f1e; color: #eee; height: 100vh; padding: 10px;
  }
  .main-container { display: flex; gap: 14px; max-width: 1500px; height: calc(100vh - 20px); margin: 0 auto; }
  .quiz-panel { flex: 1 1 58%; display: flex; flex-direction: column; align-items: center; }
  .video-panel { flex: 0 0 40%; display: flex; flex-direction: column; align-items: center; }
  h1 { color: #e94560; margin-bottom: 2px; font-size: 22px; text-align: center; }
  .sub { color: #888; margin-bottom: 8px; font-size: 12px; text-align: center; }
  .stats { display: flex; gap: 24px; margin-bottom: 8px; font-size: 15px; }
  .stats span { color: #e94560; font-weight: bold; }
  .phase-hint { color: #e94560; font-size: 13px; text-align: center; margin-bottom: 8px; min-height: 18px; }
  .staff-card { background: #16213e; border: 2px solid #0f3460; border-radius: 12px; padding: 10px; margin-bottom: 8px; width: 100%; }
  .staff-svg { display: block; cursor: pointer; max-width: 100%; }
  .ctrl-row { display: flex; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
  .btn { border: none; padding: 8px 20px; font-size: 13px; border-radius: 50px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .btn-play { background: #e94560; color: #fff; }
  .btn-play:hover { background: #ff6b6b; transform: scale(1.05); }
  .btn-next { background: #0f3460; color: #eee; border: 2px solid #e94560; }
  .btn-next:hover { background: #1a4070; transform: scale(1.05); }
  .btn-confirm { background: #52b788; color: #fff; }
  .btn-confirm:hover { background: #6cc99a; transform: scale(1.05); }
  .btn-confirm:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; border: 2px solid #444; }
  .result { font-size: 15px; font-weight: bold; min-height: 22px; text-align: center; line-height: 1.4; }
  .back { position: fixed; top: 10px; left: 10px; color: #888; text-decoration: none; font-size: 12px; z-index: 100; }
  .dbg-toggle { position: fixed; bottom: 10px; right: 10px; background: none; border: 1px solid #333; color: #444; padding: 3px 8px; border-radius: 20px; cursor: pointer; font-size: 10px; z-index: 100; }
  .dbg-toggle:hover { border-color: #e94560; color: #e94560; }

  .video-card { background: #16213e; border: 2px solid #0f3460; border-radius: 12px; padding: 8px; width: 100%; position: relative; overflow: hidden; }
  .video-wrapper { position: relative; width: 100%; padding-top: 141%; border-radius: 12px; overflow: hidden; background: #000; }
  .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #effectVideo { display: none; }
  .video-label { text-align: center; color: #e94560; font-size: 13px; margin-top: 6px; min-height: 18px; }

  /* Star progress */
  .star-bar-container { margin-top: 6px; padding: 0 4px; display: flex; align-items: center; gap: 6px; justify-content: center; }
  .star { font-size: 20px; color: #333; transition: all 0.4s ease; filter: drop-shadow(0 0 0 transparent); }
  .star.lit { color: #fbbf24; filter: drop-shadow(0 0 6px rgba(251,191,36,0.6)); }
  .score-text { font-size: 12px; color: #888; margin-left: 4px; }

  .hit-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,215,100,0); pointer-events: none; transition: background 0.15s; border-radius: 12px; }
  .hit-flash.active { background: rgba(255,215,100,0.25); }

  /* Combo display */
  .combo-display {
    position: absolute; top: 12px; right: 12px;
    font-size: 28px; font-weight: 900;
    color: #ff6b6b;
    text-shadow: 0 0 10px rgba(233,69,96,0.6), 2px 2px 4px rgba(0,0,0,0.8);
    opacity: 0; transform: scale(0.5);
    transition: all 0.3s ease;
    pointer-events: none; z-index: 10;
    font-family: 'Segoe UI', sans-serif;
  }
  .combo-display.show { opacity: 1; transform: scale(1); }
  .combo-display.x3 { color: #fbbf24; text-shadow: 0 0 15px rgba(251,191,36,0.7), 2px 2px 4px rgba(0,0,0,0.8); font-size: 34px; }
  .combo-display.x5 { color: #c084fc; text-shadow: 0 0 20px rgba(192,132,252,0.8), 2px 2px 4px rgba(0,0,0,0.8); font-size: 38px; }

  @keyframes pulse-ring { 0%,100%{opacity:.2;stroke-width:2} 50%{opacity:.5;stroke-width:3} }
  @keyframes fadeIn { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
  fieldset#debugRow { background: rgba(0,0,0,0.15); }
  fieldset#debugRow legend { padding: 0 6px; }
  @media (max-width: 900px) { .main-container { flex-direction: column; } }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; 关卡选择</a>
  <div class="main-container">
    <!-- LEFT: Quiz -->
    <div class="quiz-panel">
      <h1>Ear Training</h1>
      <div class="sub">听三音 &rarr; 五线谱点击选出第 2、3 音</div>
      <div class="stats">得分: <span id="score">0</span> | 连击: <span id="combo">0</span> | 题数: <span id="total">0</span></div>
      <div class="phase-hint" id="phaseHint">点击 New 开始</div>
      <div class="staff-card">
        <svg class="staff-svg" id="staffSvg" width="800" height="240" viewBox="0 0 800 240">
          <g id="layerStatic"></g>
          <g id="layerDynamic"></g>
        </svg>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-next" onclick="newQuestion()">New</button>
        <button class="btn btn-play" onclick="playMelody()">Replay</button>
        <button class="btn btn-confirm" id="btnConfirm" onclick="confirmAnswer()" disabled>Confirm</button>
      </div>
      <fieldset id="debugRow" style="display:block;border:1px dashed #555;border-radius:10px;padding:8px 12px;margin:4px auto;max-width:520px">
        <legend style="color:#666;font-size:11px;text-align:center">Debug · 视频预览（正式版移除）</legend>
        <div class="ctrl-row" style="margin-bottom:0">
          <button class="btn" style="background:#8b5cf6;color:#fff;font-size:12px" onclick="debugVideo('idle')">Idle</button>
          <button class="btn" style="background:#52b788;color:#fff;font-size:12px" onclick="debugVideo('happy')">Happy</button>
          <button class="btn" style="background:#f59e0b;color:#000;font-size:12px" onclick="debugVideo('encourage')">Encourage</button>
          <button class="btn" style="background:#ec4899;color:#fff;font-size:12px" onclick="debugVideo('kiss')">Kiss</button>
          <button class="btn" style="background:#e94560;color:#fff;font-size:12px" onclick="debugVideo('combo')">Combo</button>
        </div>
      </fieldset>
      <button class="dbg-toggle" onclick="var d=document.getElementById('debugRow');d.style.display=d.style.display==='none'?'block':'none'">DBG</button>
      <div class="result" id="result"></div>
    </div>
    <!-- RIGHT: Video -->
    <div class="video-panel">
      <h1>Student</h1>
      <div class="sub" id="studentIdLabel">答对开心，连击触发飞吻&圣光注入</div>
      <div class="video-card" id="videoCard">
        <div class="combo-display" id="comboDisplay"></div>
        <div class="video-wrapper">
          <video id="idleVideo" autoplay loop muted playsinline><source src="idle.mp4" type="video/mp4"></video>
          <video id="effectVideo" muted playsinline><source src="" type="video/mp4"></video>
          <div class="hit-flash" id="hitFlash"></div>
        </div>
        <div class="star-bar-container" id="starBar">
          <span class="star" id="star1">&#9733;</span>
          <span class="star" id="star2">&#9733;</span>
          <span class="star" id="star3">&#9733;</span>
          <span class="score-text" id="scoreText">0 / 20</span>
        </div>
        <div class="video-label" id="videoLabel">listening...</div>
      </div>
    </div>
  </div>

<script>
// ===== Layout =====
const SVG_NS='http://www.w3.org/2000/svg';
const STAFF_TOP=50,LINE_SPACE=20,HALF=10,STAFF_LEFT=115,STAFF_RIGHT=760,SVG_W=800,SVG_H=240;
const NOTE_X=[255,465,665],DIVIDER_X=[360,565];
const ZONES=[
  {xMin:STAFF_LEFT+5,xMax:DIVIDER_X[0]-2},
  {xMin:DIVIDER_X[0]+2,xMax:DIVIDER_X[1]-2},
  {xMin:DIVIDER_X[1]+2,xMax:STAFF_RIGHT-5}
];

// ===== Notes =====
const NOTE_DEFS=[[-4,'C',6,84],[-3,'B',5,83],[-2,'A',5,81],[-1,'G',5,79],[0,'F',5,77],[1,'E',5,76],[2,'D',5,74],[3,'C',5,72],[4,'B',4,71],[5,'A',4,69],[6,'G',4,67],[7,'F',4,65],[8,'E',4,64],[9,'D',4,62],[10,'C',4,60],[11,'B',3,59],[12,'A',3,57]];
const SOLFEGE={C:'do',D:'re',E:'mi',F:'fa',G:'so',A:'la',B:'si'};
const STEP_NOTES={};
NOTE_DEFS.forEach(([s,nm,oc,m])=>{STEP_NOTES[s]={step:s,name:nm,octave:oc,midi:m,solfege:SOLFEGE[nm]};});
const MIN_STEP=-2,MAX_STEP=10;

// ===== Load level config from URL =====
const params = new URLSearchParams(location.search);
const LEVEL_ID = params.get('level') || '155';
const VIDEO_BASE = 'students/' + LEVEL_ID + '/';
const VIDEOS = {
  idle:      VIDEO_BASE + LEVEL_ID + '_idle.mp4',
  happy:     VIDEO_BASE + LEVEL_ID + '_happy.mp4',
  encourage: VIDEO_BASE + LEVEL_ID + '_encourage.mp4',
  kiss:      VIDEO_BASE + LEVEL_ID + '_kiss.mp4',
  combo:     VIDEO_BASE + LEVEL_ID + '_combo.mp4',
};

// Set video sources
document.querySelector('#idleVideo source').src = VIDEOS.idle;
// Show student ID
document.getElementById('studentIdLabel').textContent = 'No.' + LEVEL_ID + ' · 答对开心，连击触发飞吻&圣光注入';

// ===== Video system: idle loops underneath, effect overlays on top =====
const idleVideo=document.getElementById('idleVideo');
idleVideo.load(); idleVideo.play().catch(()=>{});
const effectVideo=document.getElementById('effectVideo');
const videoLabel=document.getElementById('videoLabel');
const hitFlash=document.getElementById('hitFlash');
const videoCard=document.getElementById('videoCard');

function showEffect(type,label){
  const src = VIDEOS[type] || VIDEOS.happy;
  effectVideo.src=src;
  effectVideo.style.display='block';
  effectVideo.play().catch(()=>{});
  videoLabel.textContent=label;
}
function hideEffect(){
  effectVideo.style.display='none';
  effectVideo.removeAttribute('src');
  effectVideo.load();
  videoLabel.textContent='listening...';
}
effectVideo.addEventListener('ended', hideEffect);

// ===== Star system =====
const STAR_THRESHOLDS=[5,12,20]; // points needed for 1/2/3 stars
let starsLit=0;

function updateStars(){
  let newStars=0;
  for(let i=0;i<STAR_THRESHOLDS.length;i++){
    if(score>=STAR_THRESHOLDS[i]) newStars=i+1;
  }
  // Light up newly earned stars
  if(newStars>starsLit){
    starsLit=newStars;
    for(let i=1;i<=3;i++){
      document.getElementById('star'+i).classList.toggle('lit', i<=starsLit);
    }
  }
  document.getElementById('scoreText').textContent=score+' / '+STAR_THRESHOLDS[STAR_THRESHOLDS.length-1];
}

// ===== Effect trigger =====
function triggerEffect(isCorrect){
  if(isCorrect){
    // Correct answer: pick video based on combo level
    let type, label;
    if(combo >= 5){
      type = 'combo'; label = '✨ 圣光注入! Combo x' + combo;
    } else if(combo >= 3){
      type = 'kiss'; label = '💋 飞吻! Combo x' + combo;
    } else {
      type = 'happy'; label = '😊 开心! +pts';
    }
    showEffect(type, label);
  } else {
    // Wrong answer: encouragement
    showEffect('encourage', '💪 没关系，再来!');
  }
  // Golden flash for correct
  if(isCorrect){
    hitFlash.classList.add('active');
    setTimeout(()=>hitFlash.classList.remove('active'),200);
  }
  // Combo display
  if(combo>=2 && isCorrect){
    const cd=document.getElementById('comboDisplay');
    cd.textContent='COMBO x'+combo;
    cd.className='combo-display show'+(combo>=5?' x5':combo>=3?' x3':'');
    setTimeout(()=>cd.classList.remove('show'),1800);
  }
}

// ===== State =====
let notes=[],answers=[null,null];
let hoverStep=null,hoverZone=-1;
let locked=false,submitted=false;
let score=0,combo=0,total=0,wasWrong=false;

// ===== Utils =====
const midiToFreq=m=>440*Math.pow(2,(m-69)/12);
const getY=s=>STAFF_TOP+s*HALF;
function svgEl(t,a){const e=document.createElementNS(SVG_NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function getLedgerSteps(step){const l=[];if(step<=-2){for(let s=-2;s>=step;s-=2)l.push(s);}if(step>=10){for(let s=10;s<=step;s+=2)l.push(s);}return l;}
function clientToSvgY(cy){const r=staffSvg.getBoundingClientRect();return(cy-r.top)*(SVG_H/r.height);}
function clientToSvgX(cx){const r=staffSvg.getBoundingClientRect();return(cx-r.left)*(SVG_W/r.width);}

// ===== Melody gen =====
function pickNext(prev){const r=Math.random();let pool;if(r<0.55)pool=[-2,-1,-1,1,1,2];else if(r<0.85)pool=[-4,-3,3,4];else pool=[-5,5];let d=pool[Math.floor(Math.random()*pool.length)];let n=prev+d;if(n<MIN_STEP)n=prev+Math.abs(d);if(n>MAX_STEP)n=prev-Math.abs(d);return n;}
function genMelody(){const pool=[];for(let s=3;s<=8;s++)pool.push(s);const s1=pool[Math.floor(Math.random()*pool.length)];return[STEP_NOTES[s1],STEP_NOTES[pickNext(s1)],STEP_NOTES[pickNext(pickNext(s1))]];}

// ===== Static layer =====
function drawStatic(){
  const g=document.getElementById('layerStatic');g.innerHTML='';
  [-2,10].forEach(s=>g.appendChild(svgEl('line',{x1:STAFF_LEFT+15,y1:getY(s),x2:STAFF_RIGHT-10,y2:getY(s),stroke:'#555','stroke-width':1.5,'stroke-dasharray':'5,3',opacity:0.35})));
  for(let i=0;i<5;i++)g.appendChild(svgEl('line',{x1:STAFF_LEFT,y1:STAFF_TOP+i*LINE_SPACE,x2:STAFF_RIGHT,y2:STAFF_TOP+i*LINE_SPACE,stroke:'#778','stroke-width':1.5}));
  g.appendChild(svgEl('line',{x1:STAFF_LEFT,y1:STAFF_TOP,x2:STAFF_LEFT,y2:STAFF_TOP+4*LINE_SPACE,stroke:'#778','stroke-width':2}));
  g.appendChild(svgEl('line',{x1:STAFF_RIGHT,y1:STAFF_TOP,x2:STAFF_RIGHT,y2:STAFF_TOP+4*LINE_SPACE,stroke:'#778','stroke-width':3}));
  const clef=svgEl('text',{x:STAFF_LEFT+4,y:STAFF_TOP+4.3*LINE_SPACE,'font-size':80,fill:'#e94560','font-family':"'Segoe UI Symbol','Noto Music','Bravura',serif"});
  clef.textContent='\u{1D11E}';g.appendChild(clef);
  for(let s=MIN_STEP;s<=MAX_STEP;s++){const y=getY(s),n=STEP_NOTES[s],on=s>=0&&s<=8,op=on?0.7:0.35;
    const t=svgEl('text',{x:14,y:y+4,'font-size':12,fill:'#999',opacity:op,'text-anchor':'start'});t.textContent=n.solfege;g.appendChild(t);
    const l=svgEl('text',{x:55,y:y+4,'font-size':10,fill:'#667',opacity:op*0.8,'text-anchor':'start'});l.textContent=n.name+n.octave;g.appendChild(l);}
  DIVIDER_X.forEach(dx=>g.appendChild(svgEl('line',{x1:dx,y1:STAFF_TOP-12,x2:dx,y2:STAFF_TOP+4*LINE_SPACE+12,stroke:'#e94560','stroke-width':1.5,'stroke-dasharray':'6,4',opacity:0.4})));
  ['ref','note 2','note 3'].forEach((label,i)=>{
    const cx=(i===0?STAFF_LEFT+5:i===1?DIVIDER_X[0]+2:DIVIDER_X[1]+2)+(i===0?(DIVIDER_X[0]-STAFF_LEFT-5)/2:i===1?(DIVIDER_X[1]-DIVIDER_X[0]-4)/2:(STAFF_RIGHT-DIVIDER_X[1]-7)/2);
    const t=svgEl('text',{x:cx,y:STAFF_TOP-16,'font-size':12,fill:'#e94560',opacity:0.6,'text-anchor':'middle'});t.textContent=label;g.appendChild(t);});
  if(notes.length===3)drawNote(g,NOTE_X[0],notes[0],'#f5f5f5');
}

// ===== Dynamic layer =====
function drawDynamic(){
  const g=document.getElementById('layerDynamic');g.innerHTML='';
  if(hoverStep!==null&&!submitted&&!locked&&hoverZone>=1){
    const y=getY(hoverStep);
    g.appendChild(svgEl('rect',{x:STAFF_LEFT+5,y:y-HALF/2,width:STAFF_RIGHT-STAFF_LEFT-10,height:HALF,fill:'#e94560',opacity:0.08,rx:4}));
  }
  if(!submitted&&!locked){
    for(let zi=1;zi<=2;zi++){
      const active=hoverZone===zi||(!answers[zi-1]&&hoverZone<0);
      if(active)g.appendChild(svgEl('rect',{x:ZONES[zi].xMin,y:12,width:ZONES[zi].xMax-ZONES[zi].xMin,height:216,fill:'#e94560',opacity:hoverZone===zi?0.05:0.03,rx:8}));
    }
  }
  if(notes.length===3){
    for(let i=0;i<2;i++){
      const ax=NOTE_X[i+1];
      if(answers[i]){
        let color='#f5f5f5';
        if(submitted){color=answers[i].step===notes[i+1].step?'#52b788':'#e94560';}
        drawNote(g,ax,answers[i],color);
        if(submitted&&answers[i].step!==notes[i+1].step)drawNoteOutline(g,ax+18,notes[i+1],'#52b788');
      }else if(!submitted)drawPlaceholder(g,ax);
    }
    if(submitted)for(let i=0;i<2;i++)if(!answers[i])drawNoteOutline(g,NOTE_X[i+1],notes[i+1],'#52b788');
  }
  if(hoverStep!==null&&!submitted&&!locked&&hoverZone>=1){
    const ax=NOTE_X[hoverZone],hn=STEP_NOTES[hoverStep];
    getLedgerSteps(hoverStep).forEach(s=>g.appendChild(svgEl('line',{x1:ax-14,y1:getY(s),x2:ax+14,y2:getY(s),stroke:'#888','stroke-width':1.5,'stroke-dasharray':'3,2',opacity:0.5})));
    g.appendChild(svgEl('ellipse',{cx:ax,cy:getY(hoverStep),rx:9,ry:7,fill:'rgba(255,255,255,0.12)',stroke:'rgba(255,255,255,0.35)','stroke-width':1.5,transform:'rotate(-20 '+ax+' '+getY(hoverStep)+')'}));
    const l=svgEl('text',{x:ax,y:getY(hoverStep)-18,'font-size':12,fill:'rgba(255,255,255,0.55)','text-anchor':'middle'});l.textContent=hn.solfege+' '+hn.name+hn.octave;g.appendChild(l);
  }
}

function drawAll(){drawStatic();drawDynamic();}

// ===== Drawing helpers =====
function drawNote(g,x,note,color){
  const y=getY(note.step);
  getLedgerSteps(note.step).forEach(s=>g.appendChild(svgEl('line',{x1:x-16,y1:getY(s),x2:x+16,y2:getY(s),stroke:'#aaa','stroke-width':2.5})));
  const ng=svgEl('g');const su=note.step>4,sl=3.5*LINE_SPACE,sx=su?x+8:x-8;
  ng.appendChild(svgEl('line',{x1:sx,y1:su?y-2:y+2,x2:sx,y2:su?y-sl:y+sl,stroke:color,'stroke-width':2}));
  ng.appendChild(svgEl('ellipse',{cx:x,cy:y,rx:9,ry:7,fill:color,transform:'rotate(-20 '+x+' '+y+')'}));
  g.appendChild(ng);
}
function drawNoteOutline(g,x,note,color){
  const y=getY(note.step);
  getLedgerSteps(note.step).forEach(s=>g.appendChild(svgEl('line',{x1:x-14,y1:getY(s),x2:x+14,y2:getY(s),stroke:color,'stroke-width':1.5,'stroke-dasharray':'3,2',opacity:0.6})));
  const ng=svgEl('g');
  ng.appendChild(svgEl('ellipse',{cx:x,cy:y,rx:9,ry:7,fill:'none',stroke:color,'stroke-width':2,transform:'rotate(-20 '+x+' '+y+')',opacity:0.7}));
  const l=svgEl('text',{x:x,y:y-18,'font-size':11,fill:color,'text-anchor':'middle',opacity:0.8});l.textContent=note.solfege+' '+note.name+note.octave;ng.appendChild(l);
  g.appendChild(ng);
}
function drawPlaceholder(g,x){
  const cy=STAFF_TOP+2*LINE_SPACE;
  const r=svgEl('circle',{cx:x,cy:cy,r:18,fill:'none',stroke:'#e94560','stroke-width':2,'stroke-dasharray':'5,3'});r.style.animation='pulse-ring 1.4s ease-in-out infinite';g.appendChild(r);
  const q=svgEl('text',{x:x,y:cy+7,'font-size':24,fill:'#e94560','text-anchor':'middle'});q.textContent='?';g.appendChild(q);
}

// ===== Mouse/touch =====
const staffSvg=document.getElementById('staffSvg');
function handleMove(cx,cy){
  if(submitted||locked)return;
  const sx=clientToSvgX(cx),sy=clientToSvgY(cy);
  let zone=-1;for(let i=1;i<=2;i++)if(sx>=ZONES[i].xMin&&sx<=ZONES[i].xMax){zone=i;break;}
  const step=Math.round((sy-STAFF_TOP)/HALF),cl=Math.max(MIN_STEP,Math.min(MAX_STEP,step));
  if(hoverStep!==cl||hoverZone!==zone){hoverStep=cl;hoverZone=zone;drawDynamic();}
}
async function handleClick(cx){
  if(submitted||locked)return;
  const sx=clientToSvgX(cx);let zone=-1;
  for(let i=1;i<=2;i++)if(sx>=ZONES[i].xMin&&sx<=ZONES[i].xMax){zone=i;break;}
  if(zone<1||hoverStep===null)return;
  const note=STEP_NOTES[hoverStep];answers[zone-1]=note;
  try{await Tone.start();const syn=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.2,sustain:0.3,release:0.5}}).toDestination();
    const now=Tone.now();let t=now;syn.triggerAttackRelease(midiToFreq(notes[0].midi),0.5,t);t+=0.55;
    if(zone===2&&answers[0]){syn.triggerAttackRelease(midiToFreq(answers[0].midi),0.5,t);t+=0.55;}
    syn.triggerAttackRelease(midiToFreq(note.midi),0.5,t);
  }catch(e){}
  document.getElementById('btnConfirm').disabled=!(answers[0]&&answers[1]);
  updatePhase();drawDynamic();
}
staffSvg.addEventListener('mousemove',e=>handleMove(e.clientX,e.clientY));
staffSvg.addEventListener('mouseleave',()=>{if(hoverStep!==null||hoverZone!==-1){hoverStep=null;hoverZone=-1;drawDynamic();}});
staffSvg.addEventListener('click',e=>handleClick(e.clientX));
staffSvg.addEventListener('touchmove',e=>{e.preventDefault();handleMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
staffSvg.addEventListener('touchend',e=>{e.preventDefault();if(hoverStep!==null&&hoverZone>=1)handleClick(clientToSvgX_offset(hoverZone));},{passive:false});
function clientToSvgX_offset(zone){const r=staffSvg.getBoundingClientRect();return r.left+(NOTE_X[zone]/(SVG_W/r.width));}

// ===== Game flow =====
async function newQuestion(){
  if(locked)return;
  try{await Tone.start();}catch(e){}
  notes=genMelody();answers=[null,null];submitted=false;hoverStep=null;hoverZone=-1;wasWrong=false;
  document.getElementById('result').textContent='';
  document.getElementById('btnConfirm').disabled=true;
  updatePhase();drawAll();
  setTimeout(()=>playMelody(),250);
}
function updatePhase(){
  const el=document.getElementById('phaseHint');
  if(!notes.length){el.textContent='click New to start';return;}
  if(submitted){const c1=answers[0]&&answers[0].step===notes[1].step,c2=answers[1]&&answers[1].step===notes[2].step;el.textContent=(c1&&c2)?'correct!':'green = correct pos';return;}
  const h1=!!answers[0],h2=!!answers[1];
  el.textContent=!h1&&!h2?'click in note 2 or note 3 zone':h1&&!h2?'note 2 placed, pick note 3':!h1&&h2?'note 3 placed, pick note 2':'both placed, confirm or keep fixing';
}
function confirmAnswer(){
  if(submitted||!answers[0]||!answers[1])return;
  submitted=true;hoverStep=null;hoverZone=-1;total++;
  const c1=answers[0].step===notes[1].step,c2=answers[1].step===notes[2].step,both=c1&&c2;
  const ms=notes.map(n=>n.solfege+'('+n.name+n.octave+')').join(' -> ');
  if(both){
    // Score: base 1 + combo bonus
    combo++;
    const points = combo >= 3 ? 3 : combo >= 2 ? 2 : 1;
    score += points;
    wasWrong=false;
    document.getElementById('result').innerHTML='OK! +'+points+'pts  '+ms;
    triggerEffect(true);
    updateStars();
    // Save best stars
    const key='stars_'+LEVEL_ID;
    const prev=parseInt(localStorage.getItem(key)||'0',10);
    if(starsLit>prev) localStorage.setItem(key, String(starsLit));
    // Check if 3 stars reached
    if(starsLit>=3){
      document.getElementById('result').innerHTML += '  &#11088; PASSED! &#11088;';
      setTimeout(()=>{ window.location.href='index.html'; }, 3000);
    }
  }else{
    combo=0;wasWrong=true;
    document.getElementById('result').innerHTML=(c1?'n2 OK':'n2 X')+' '+(c2?'n3 OK':'n3 X')+' | '+ms;
    triggerEffect(false);
  }
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent=combo;
  document.getElementById('total').textContent=total;
  document.getElementById('btnConfirm').disabled=true;
  updatePhase();drawDynamic();
  if(both && starsLit<3)setTimeout(()=>newQuestion(),2500);
}

function resetProgress(){
  // Save best stars before reset
  if(starsLit>=3){
    const key='stars_'+LEVEL_ID;
    const prev=parseInt(localStorage.getItem(key)||'0',10);
    if(3>prev) localStorage.setItem(key,'3');
  }
  score=0;combo=0;total=0;starsLit=0;
  for(let i=1;i<=3;i++)document.getElementById('star'+i).classList.remove('lit');
  document.getElementById('score').textContent=0;
  document.getElementById('combo').textContent=0;
  document.getElementById('total').textContent=0;
  updateStars();
  newQuestion();
}

// ===== Audio =====
async function playMelody(){
  if(!notes.length)return;
  try{await Tone.start();const syn=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.02,decay:0.2,sustain:0.4,release:0.6}}).toDestination();
    const now=Tone.now();notes.forEach((n,i)=>syn.triggerAttackRelease(midiToFreq(n.midi),0.6,now+i*0.68));
  }catch(e){}
}

// ===== Debug =====
function debugVideo(type){
  const labels = { idle:'Idle', happy:'Happy', encourage:'Encourage', kiss:'Kiss', combo:'Combo' };
  if(type === 'idle'){
    hideEffect();
  } else {
    showEffect(type, 'DEBUG: ' + labels[type]);
  }
}

// ===== Init =====
updateStars();
drawStatic();
</script>
